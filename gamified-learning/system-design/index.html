<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>System Design Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0b1020; --bg2:#121a33; --card:#162042; --card2:#1c2852; --line:#2a3768;
  --tx:#e8ecff; --mut:#9aa6d1; --dim:#6b77a6;
  --acc:#8b5cf6; --acc2:#22d3ee; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --gold:#fbbf24;
  --r:16px; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Space Grotesk','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.55}
body{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 10%,color-mix(in srgb,var(--acc2) 14%,transparent),transparent 60%),var(--bg);min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{color:var(--acc2)}
code{font-family:var(--mono);font-size:.88em;background:#0d1430;border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:#c4d0ff}
b,strong{color:#fff}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 80px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;cursor:pointer;user-select:none}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:18px;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.stats{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}
.pill.timer{cursor:pointer}
.pill.timer.run{border-color:var(--acc2);color:var(--acc2)}
.lvlbar{width:70px;height:6px;background:#0d1430;border-radius:9px;overflow:hidden}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}

/* cards / generic */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px}
.h1{font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:700;line-height:1.15;margin:26px 0 6px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
.sec-t{font-size:1.15rem;font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.98rem;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--acc) 22%,transparent);color:color-mix(in srgb,var(--acc) 40%,#fff);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.e{background:#14532d55;color:#86efac;border-color:#22c55e55}
.tag.m{background:#78350f55;color:#fcd34d;border-color:#f59e0b55}
.tag.h{background:#7f1d1d55;color:#fca5a5;border-color:#ef444455}

/* home: mission */
.mission{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:760px){.mission{grid-template-columns:1fr}}
.mission .big{position:relative;overflow:hidden}
.mission .big:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 40%,transparent),transparent 70%)}
.kick{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--acc2)}
.mtitle{font-size:1.5rem;font-weight:700;margin:6px 0 4px}
.blocks{display:flex;gap:8px;margin:14px 0}
.blocks span{pointer-events:none;flex:1;font-size:.78rem;text-align:center;padding:8px 4px;border-radius:10px;background:#0d1430;border:1px solid var(--line);color:var(--mut)}
.blocks span.on{border-color:var(--acc);color:#fff;background:color-mix(in srgb,var(--acc) 18%,#0d1430)}
.weekdots{display:flex;gap:6px;margin-top:10px}
.weekdots i{width:28px;height:28px;border-radius:8px;background:#0d1430;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.7rem;color:var(--dim)}
.weekdots i.on{background:linear-gradient(135deg,var(--warn),#f97316);color:#fff;border-color:transparent}

/* path map */
.seg{margin:26px 0 8px}
.seg-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.seg-h h3{margin:0;font-size:1.05rem}
.seg-h .c{color:var(--dim);font-size:.85rem}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.node{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 12px;color:var(--tx);transition:transform .15s,border-color .15s,box-shadow .15s}
.node:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 22%,transparent)}
.node .em{font-size:1.6rem;line-height:1}
.node .n{font-size:.72rem;color:var(--dim);font-weight:700;letter-spacing:.06em}
.node .tt{font-weight:700;margin:6px 0 2px;font-size:.98rem;line-height:1.25}
.node .ds{font-size:.8rem;color:var(--mut);line-height:1.35}
.node .st{position:absolute;top:12px;right:12px;font-size:.85rem;letter-spacing:1px}
.node.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 10%,var(--card)),var(--card))}
.node.next{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 40%,transparent),0 0 30px color-mix(in srgb,var(--acc) 30%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent),0 0 40px color-mix(in srgb,var(--acc) 35%,transparent)}}

/* lesson */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--mut);font-size:.9rem;margin-top:18px}
.crumbs a{cursor:pointer;color:var(--mut);text-decoration:none}
.crumbs a:hover{color:#fff}
.stepper{display:flex;gap:6px;margin:16px 0 18px;overflow-x:auto;padding-bottom:4px}
.stepper button{flex:1;min-width:92px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:9px 8px;font-weight:700;font-size:.85rem;white-space:nowrap}
.stepper button.on{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--acc2)));color:#fff;border-color:transparent}
.stepper button.ok{color:#86efac;border-color:#22c55e66}
.pane{animation:fadeup .35s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* stage (animation) */
.stage{background:radial-gradient(800px 300px at 50% 0%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 70%),#0a0f22;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--mut);gap:10px}
.stage-h b{color:#fff;font-size:.92rem}
.stage svg{display:block;width:100%;height:auto}
[data-vis]{overflow-x:auto}
@media(max-width:700px){.stage svg{min-width:640px}}
.cap{min-height:84px;padding:14px 18px;border-top:1px solid var(--line);background:#0c1228;font-size:1rem}
.cap .k{font-size:.72rem;font-weight:700;color:var(--acc2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.cap .tx{animation:fadeup .35s ease}
.ctrls{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrls .dots{display:flex;gap:5px;flex:1;flex-wrap:wrap;justify-content:center}
.ctrls .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .2s}
.ctrls .dots i.on{background:var(--acc2);transform:scale(1.35)}
.ctrls .dots i.seen{background:color-mix(in srgb,var(--acc) 70%,var(--line))}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:1rem;display:grid;place-items:center}
.ib:hover{border-color:var(--acc)}
.spd{font-size:.78rem;color:var(--mut);border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px}

/* flow svg */
.fn rect{fill:#141d3d;stroke:#34437c;stroke-width:1.5;transition:all .35s}
.fn text{fill:#cdd6ff;font-family:var(--sans);font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.fn text.s{font-size:11px;fill:#8d99c8;font-weight:500}
.fn{transition:opacity .4s,transform .4s;transform-box:fill-box;transform-origin:center}
.fn.hid{opacity:0;transform:scale(.6)}
.fn.on rect{fill:color-mix(in srgb,var(--acc) 35%,#141d3d);stroke:var(--acc2);stroke-width:2.5;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc2) 70%,transparent))}
.fn.on text{fill:#fff}
.fn.c-g rect{stroke:#22c55e}.fn.c-r rect{stroke:#ef4444}.fn.c-y rect{stroke:#f59e0b}.fn.c-p rect{stroke:#a78bfa}.fn.c-b rect{stroke:#38bdf8}
.fn.c-g.on rect{fill:#14532d;stroke:#4ade80}.fn.c-r.on rect{fill:#7f1d1d;stroke:#f87171}.fn.c-y.on rect{fill:#78350f;stroke:#fbbf24}
.fn.okk rect{fill:#14532d;stroke:#4ade80;filter:drop-shadow(0 0 10px #22c55e99)}
.fn.badd rect{fill:#7f1d1d;stroke:#f87171;filter:drop-shadow(0 0 10px #ef444499)}
.fe{stroke:#3a4a85;stroke-width:2;fill:none;transition:all .35s}
.fe.on{stroke:var(--acc2);stroke-width:3}
.fe.dash{stroke-dasharray:6 5}
.fel{fill:#8d99c8;font-size:11px;font-family:var(--sans);text-anchor:middle}
.fe-g{transition:opacity .4s}
.fe-g.hid{opacity:0}
.pk{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.zone rect{fill:none;stroke:#2c3a72;stroke-dasharray:5 6;stroke-width:1.5}
.zone text{fill:#6b77a6;font-size:11px;font-family:var(--sans);font-weight:700;letter-spacing:.08em}

/* array tracer */
.arr{padding:26px 14px 18px;overflow-x:auto}
.arr-row{display:flex;gap:6px;justify-content:center;min-width:max-content;margin:0 auto}
.cell{position:relative;min-width:50px;height:52px;padding:0 8px;border-radius:10px;background:#141d3d;border:2px solid #34437c;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.05rem;color:#dbe3ff;transition:all .35s}
.cell .ix{position:absolute;top:-19px;font-size:.66rem;color:var(--dim);font-weight:500}
.cell.hl{background:#78350f;border-color:#fbbf24;color:#fff;transform:translateY(-4px)}
.cell.ok{background:#14532d;border-color:#4ade80;color:#fff}
.cell.bad{background:#7f1d1d;border-color:#f87171;color:#fff}
.cell.dim{opacity:.3}
.cell.win{background:color-mix(in srgb,var(--acc) 30%,#141d3d);border-color:var(--acc)}
.cell.hl.win{background:#78350f}
.cell.emp{background:transparent;border-style:dashed;color:var(--dim)}
.ptrs{display:flex;gap:6px;justify-content:center;min-width:max-content;margin:6px auto 0}
.ptrs div{min-width:50px;padding:0 8px;text-align:center;font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--acc2);line-height:1.25;min-height:16px;visibility:hidden}
.grid-arr .arr-row{margin-bottom:6px}
.grid-arr .cell{min-width:44px;height:44px;font-size:.92rem}
.vars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.vars span{font-family:var(--mono);font-size:.85rem;background:#0d1430;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:#c4d0ff}
.vars span b{color:var(--gold)}
.lbl-row{text-align:center;font-size:.75rem;color:var(--dim);margin:14px 0 22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* learn */
.learn{display:grid;gap:14px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.lc h4{margin:0 0 8px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.lc p{margin:6px 0;color:#d3daf7}
.lc ul{margin:6px 0;padding-left:20px;color:#d3daf7}
.lc li{margin:4px 0}
.say{border-left:4px solid var(--gold);background:linear-gradient(90deg,#fbbf2412,transparent);border-radius:0 14px 14px 0;padding:14px 18px}
.say h4{color:var(--gold)}
.analogy{border-left:4px solid var(--acc2);background:linear-gradient(90deg,color-mix(in srgb,var(--acc2) 10%,transparent),transparent)}
.pitfall{border-left:4px solid var(--bad);background:linear-gradient(90deg,#ef444410,transparent)}

/* compare table */
.tblw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);margin-bottom:16px}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
table.cmp th{background:color-mix(in srgb,var(--acc) 20%,var(--card));text-align:left;padding:11px 14px;font-size:.85rem}
table.cmp td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;color:#d3daf7}
table.cmp td:first-child{font-weight:700;color:#fff;white-space:nowrap}
table.cmp tr:hover td{background:#ffffff06}
.cmp-t{font-weight:700;margin:6px 0 8px;color:var(--mut);font-size:.9rem}

/* quiz */
.qbox{max-width:760px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.85rem;margin-bottom:10px}
.qprog{height:8px;background:#0d1430;border-radius:9px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.qq{font-size:1.2rem;font-weight:700;margin:0 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:13px 16px;font-size:1rem;display:flex;gap:12px;align-items:flex-start;transition:all .15s}
.opt:hover{border-color:var(--acc)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:#0d1430;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:#14532d66}
.opt.bad{border-color:var(--bad);background:#7f1d1d66;animation:shake .4s}
.opt.off{opacity:.55;pointer-events:none}
.expl{margin-top:14px;padding:14px 16px;border-radius:12px;background:#0d1430;border:1px solid var(--line);animation:fadeup .3s}
.expl.g{border-color:#22c55e66}.expl.r{border-color:#ef444466}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hearts{letter-spacing:2px}
.combo{color:var(--gold);font-weight:700}

/* order game */
.slots{display:grid;gap:8px;margin:14px 0}
.slot{min-height:46px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:8px 14px;color:var(--dim)}
.slot.f{border-style:solid;border-color:var(--ok);color:#fff;background:#14532d44;animation:fadeup .3s}
.slot .n{font-weight:700;color:var(--acc2);width:22px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card2);color:var(--tx);border-radius:12px;padding:9px 14px;font-size:.95rem;text-align:left}
.chip:hover{border-color:var(--acc)}
.chip.bad{border-color:var(--bad);animation:shake .4s}
.chip.used{display:none}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 13px;font-size:.92rem;text-align:left;transition:all .15s}
.mi.sel{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,var(--card))}
.mi.done{border-color:var(--ok);background:#14532d55;opacity:.7;pointer-events:none}
.mi.bad{border-color:var(--bad);animation:shake .4s}

/* code */
.code{position:relative;background:#070b1a;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.85rem;line-height:1.6;color:#d6deff}
.code .cp{position:absolute;top:8px;right:8px}
.kw{color:#c792ea}.st{color:#c3e88d}.cm{color:#6b77a6;font-style:italic}.nu{color:#f78c6c}.fnn{color:#82aaff}.bi{color:#ffcb6b}
.prob{margin-bottom:18px}
.prob-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.prob-h h4{margin:0;font-size:1.08rem}
.cx{font-family:var(--mono);font-size:.8rem;color:var(--mut)}
details.rev{margin-top:8px}
details.rev summary{cursor:pointer;font-weight:700;color:var(--acc2);padding:6px 0}

/* done */
.done-scr{text-align:center;padding:40px 20px}
.done-scr .big{font-size:4rem;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.stars{font-size:2.2rem;letter-spacing:6px;margin:8px 0}
.xpfly{position:fixed;z-index:99;font-weight:800;color:var(--gold);font-size:1.2rem;pointer-events:none;animation:fly 1s ease-out forwards;text-shadow:0 2px 10px #000}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:98;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* plan table */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pday{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:.82rem;cursor:pointer}
.pday:hover{border-color:var(--acc)}
.pday .d{font-weight:700;color:var(--acc2);font-size:.75rem;letter-spacing:.06em}
.pday .t{color:#dfe5ff;margin-top:2px;line-height:1.3}
.pday.ok{border-color:#22c55e77}
.pday.boss{background:linear-gradient(135deg,#7f1d1d55,var(--card))}

/* flashcards */
.flip{perspective:1000px;cursor:pointer;min-height:180px}
.flip .in{position:relative;width:100%;min-height:180px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line)}
.flip .fa{background:linear-gradient(135deg,var(--card2),var(--card));font-weight:700;font-size:1.1rem}
.flip .fb{background:linear-gradient(135deg,#123,#0d1430);transform:rotateY(180deg);font-size:.95rem;color:#d3daf7;overflow:auto}
.hint{color:var(--dim);font-size:.8rem;margin-top:8px}

.modal{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:20px;animation:fadeup .2s}
.modal .card{max-width:440px;width:100%}
.foot{color:var(--dim);font-size:.8rem;text-align:center;margin-top:50px}
@media(max-width:600px){
  .top .in{padding:8px 12px}.brand span.nm,.pill .nm{display:none}.pill{padding:4px 9px;font-size:.8rem}.lvlbar{display:none}
  .match{grid-template-columns:1fr 1fr}.mi{font-size:.82rem;padding:9px}

/* ---------------- WEB BASICS ---------------- */
{id:'web-basics',em:'🌐',t:'What Happens When You Hit Enter',mins:15,d:`DNS, TCP/TLS, HTTP, CDN, load balancer, app server, database: the request lifecycle end to end.`,
anim:[{type:'flow',title:'Request lifecycle',h:400,nodes:[
 ['br','Browser',80,200,'shop.example.com'],['dns','DNS resolver',240,70,'name → IP','y'],['cdn','CDN edge',240,320,'static files, nearby','g'],
 ['lb','Load balancer',430,200,'TLS termination'],['app','App servers',610,200,'stateless ×N','p'],['cache','Cache',610,70,'Redis','g'],['db','Database',610,330,'source of truth','b']],
 edges:[{f:'br',t:'dns',bi:1},{f:'br',t:'cdn',bi:1},{f:'br',t:'lb',bi:1},{f:'lb',t:'app',bi:1},{f:'app',t:'cache',bi:1},{f:'app',t:'db',bi:1}],
 steps:[
 {on:'br',t:`You type <code>shop.example.com</code>. The browser first needs an <b>IP address</b>.`},
 {on:'dns',go:'br>dns dns>br',t:`<b>DNS</b> resolves the name (browser cache → OS → resolver → root → TLD → authoritative). Answers are cached for their TTL. DNS can also do geo-routing.`},
 {on:'cdn',go:'br>cdn cdn>br',t:`Static assets (JS, CSS, images) come from a <b>CDN edge</b> near the user, which is fast and offloads origin servers.`},
 {on:'lb',go:'br>lb',t:`The API call opens TCP + <b>TLS</b> (HTTPS) to the <b>load balancer</b>, which picks a healthy app server.`},
 {on:'app',go:'lb>app',t:`A <b>stateless</b> app server handles the request (sessions live in a shared store, so any server can serve any user).`},
 {on:'cache',go:'app>cache cache>app',t:`Check the <b>cache</b> first. A hit costs ~1 ms.`},
 {on:'db',go:'app>db db>app',t:`On a miss, query the <b>database</b>, then populate the cache.`},
 {on:'br',go:'app>lb lb>br',t:`Response travels back as HTTP status + headers + JSON body. Every box here is a topic in this track.`}
]}],
learn:[
 {h:'Key pieces',b:`<ul><li><b>DNS:</b> name → IP. Hierarchical and cached. TTL controls how fast changes propagate.</li><li><b>TCP + TLS:</b> reliable connection plus encryption. HTTP/2 multiplexes requests; HTTP/3 runs on QUIC (UDP).</li><li><b>HTTP:</b> methods (GET, POST, PUT, PATCH, DELETE), status codes (2xx ok, 3xx redirect, 4xx client error, 5xx server error), headers (cache-control, auth).</li><li><b>CDN:</b> caches content at edge locations close to users.</li></ul>`},
 {h:'Latency numbers to remember (roughly)',b:`<ul><li>L1 cache ~1 ns · RAM ~100 ns</li><li>SSD random read ~100 µs</li><li>Same-datacenter round trip ~0.5 ms</li><li>Redis GET ~&lt;1 ms · simple DB query ~1–10 ms</li><li>Cross-continent round trip ~100–150 ms</li></ul><p>Takeaway: <b>network hops and disk dominate</b>, so cache close to the user and avoid chatty calls.</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"DNS resolves the domain, static assets come from a CDN, and API calls hit a load balancer that terminates TLS and routes to stateless app servers. They read through a cache to the database. That's the baseline I'd start from and then scale each layer."</p>`}
],
cmp:[{t:'HTTP status codes you must know',cols:['Code','Meaning','Typical use'],rows:[['200 / 201','OK / Created','success; POST created a resource'],['204','No Content','successful DELETE'],['301 / 302','Moved permanently / temporarily','redirects (URL shortener!)'],['304','Not Modified','client cache still valid'],['400 / 401 / 403 / 404','Bad request / Unauthenticated / Forbidden / Not found','client errors'],['409','Conflict','version conflict, duplicate'],['429','Too Many Requests','rate limiting'],['500 / 502 / 503 / 504','Server error / Bad gateway / Unavailable / Gateway timeout','server-side failures']]}],
quiz:[
 {q:`What does DNS do?`,o:['Encrypts traffic','Translates domain names to IP addresses','Balances load','Stores sessions'],a:1,x:`It resolves names to IPs, with caching at many levels.`},
 {q:`Why keep app servers stateless?`,o:['Faster CPUs','Any server can handle any request, so scaling and failover are easy','Saves DNS lookups','Required by HTTP'],a:1,x:`State lives in shared stores (DB, cache), so servers are interchangeable.`},
 {q:`Which status code signals rate limiting?`,o:['403','404','429','503'],a:2,x:`429 Too Many Requests, often with a Retry-After header.`},
 {q:`A CDN mainly reduces…`,o:['Database writes','Latency for static or cacheable content by serving from nearby edges','DNS TTL','TLS cost only'],a:1,x:`Content is served close to users and offloads the origin.`}
],
order:{q:`Order the request lifecycle`,items:['DNS resolves domain','TCP + TLS handshake','Load balancer picks a server','App server checks cache','DB query on cache miss','Response returned']},
match:{pairs:[['301','Permanent redirect'],['401','Not authenticated'],['503','Service unavailable'],['304','Use your cached copy']]},
cards:[[`What happens when you type a URL and press enter?`,`DNS resolution, TCP and TLS handshake, HTTP request to the CDN (static) or load balancer (API), LB routes to a stateless app server, app checks cache then DB, response returns and the browser renders and fetches sub-resources.`]]
},

/* ---------------- SCALING ---------------- */
{id:'scaling',em:'📈',t:'Scaling: Vertical vs Horizontal',mins:15,d:`Scale up vs scale out, statelessness, autoscaling, and the path from 1 user to 10 million.`,
anim:[{type:'flow',title:'From 1 server to millions of users',h:440,nodes:[
 ['u','Users',80,210],['s1','Single server',280,80,'app + DB on one box','r'],['big','Bigger server',280,210,'vertical: more CPU/RAM','y',2],
 ['lb','Load balancer',280,330,'',null,3],['a1','App 1',480,235,'',null,3],['a2','App 2',480,312,'',null,3],['a3','App 3',480,395,'autoscaled','g',4],
 ['db','Primary DB',680,260,'','b',3],['rep','Read replicas',680,360,'','b',5]],
 edges:[['u','s1'],{f:'u',t:'big',at:2},{f:'u',t:'lb',at:3},['lb','a1'],['lb','a2'],['lb','a3'],['a1','db'],['a2','db'],['a3','db'],{f:'db',t:'rep',dash:1}],
 steps:[
 {on:'s1',go:'u>s1',t:`Day 1: everything on <b>one server</b>. Simple, but it's a single point of failure and has a hard ceiling.`},
 {on:'s1',bad:'s1',t:`Traffic grows: CPU at 100%, the DB fights the app for RAM. Slowdowns and outages.`},
 {on:'big',go:'u>big',t:`<b>Vertical scaling (scale up):</b> buy a bigger machine. Easy and no code changes, but there's a hardware limit, it gets costly, and it's still one point of failure.`},
 {on:'lb a1 a2',go:'u>lb lb>a1 lb>a2',t:`<b>Horizontal scaling (scale out):</b> many smaller servers behind a load balancer. Requires <b>stateless</b> app servers.`},
 {on:'a3',go:'lb>a3',t:`<b>Autoscaling:</b> add or remove servers based on CPU or request rate. Pay for what you use, and survive server failures.`},
 {on:'db rep',go:'a1>db db>rep',t:`Now the <b>database</b> becomes the bottleneck. Next steps: caching, read replicas, then sharding (upcoming lessons).`}
]}],
learn:[
 {h:'Making scale-out possible',b:`<ul><li><b>Stateless services:</b> move sessions to Redis or JWTs, files to object storage (S3).</li><li><b>Separate tiers:</b> web, app, data scale independently.</li><li><b>Health checks</b> so the LB removes bad instances.</li><li><b>Idempotent operations</b> so retries are safe.</li></ul>`},
 {h:'Classic scaling ladder',b:`<ol><li>Single server</li><li>Separate DB server</li><li>Load balancer + multiple app servers</li><li>Cache (Redis) + CDN</li><li>DB read replicas</li><li>Async work via message queues</li><li>DB sharding / NoSQL for big data</li><li>Multi-region for latency and disaster recovery</li></ol>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I'd keep app servers stateless behind a load balancer with autoscaling, push static content to a CDN, add a cache layer, scale reads with replicas and move slow work to queues. Only when write volume or data size outgrows one primary would I shard."</p>`}
],
cmp:[{cols:['','Vertical (scale up)','Horizontal (scale out)'],rows:[['How','bigger machine','more machines'],['Limit','hardware ceiling','near-unlimited'],['Failure','single point of failure','redundancy'],['Complexity','low','LB, stateless design, distributed data'],['Cost curve','expensive at the top end','commodity, elastic'],['Good for','DBs early on, quick fixes','web/app tiers, large scale']]}],
quiz:[
 {q:`Main prerequisite for horizontal scaling of app servers?`,o:['Bigger CPUs','Stateless servers (shared session store)','NoSQL database','GraphQL'],a:1,x:`Any instance must be able to serve any request.`},
 {q:`Biggest drawback of vertical scaling?`,o:['Requires code changes','Hardware ceiling and single point of failure','Needs a load balancer','Slower than horizontal'],a:1,x:`You can only buy so big a machine, and it's still one box.`},
 {q:`After scaling app servers, what usually bottlenecks next?`,o:['DNS','The database','The CDN','TLS'],a:1,x:`Shared state concentrates load on the DB.`}
],
order:{q:`Order the classic scaling ladder`,items:['Single server','Separate database','Load balancer + many app servers','Cache + CDN','Read replicas','Sharding']},
cards:[[`How would you scale a web app from 1k to 10M users?`,`Separate the DB, make app servers stateless behind an autoscaling LB, add CDN and Redis caching, read replicas, queues for async work, then shard data and go multi-region. Measure at each step and fix the actual bottleneck.`]]
},

/* ---------------- LOAD BALANCERS ---------------- */
{id:'load-balancers',em:'⚖️',t:'Load Balancers',mins:15,d:`L4 vs L7, algorithms (round robin, least connections, consistent hash), health checks and sticky sessions.`,
anim:[{type:'flow',title:'Load balancing algorithms',h:380,nodes:[
 ['c','Clients',90,190],['lb','Load balancer',300,190,'L7: sees HTTP paths','p'],
 ['s1','Server A',560,70,'conns: 2'],['s2','Server B',560,190,'conns: 9'],['s3','Server C',560,310,'conns: 1']],
 edges:[['c','lb'],['lb','s1'],['lb','s2'],['lb','s3']],
 steps:[
 {on:'lb',go:'c>lb',t:`A load balancer spreads requests across healthy servers. It also gives you a single entry point.`},
 {on:'s1',go:'lb>s1',t:`<b>Round robin:</b> A → B → C → A… Simple, good when servers and requests are similar.`},
 {on:'s2',go:'lb>s2',t:`…B next. But B is already busy with 9 slow connections. Round robin doesn't know.`},
 {on:'s3',go:'lb>s3',t:`<b>Least connections:</b> send to the server with the fewest active connections (C). Better for uneven request durations, like websockets.`},
 {on:'s1 s2 s3',t:`<b>Weighted</b> variants give bigger servers more traffic. <b>IP / consistent hashing</b> sends the same client or key to the same server (cache affinity).`},
 {bad:'s2',lbl:{s2:'Server B ✗'},t:`<b>Health checks:</b> B fails <code>/health</code>, so the LB stops routing to it until it recovers. That's automatic failover.`}
]}],
learn:[
 {h:'L4 vs L7',b:`<ul><li><b>L4 (transport):</b> routes by IP and port with TCP/UDP. Very fast, protocol-agnostic, can't see URLs.</li><li><b>L7 (application):</b> understands HTTP: routes by path or header (<code>/api</code> → API pool, <code>/img</code> → media), TLS termination, auth, rate limiting, caching. Slightly more overhead.</li></ul>`},
 {h:'Practical concerns',b:`<ul><li><b>The LB is itself a single point of failure?</b> Run it redundantly (active-passive or managed: AWS ALB/NLB, GCP LB), plus DNS-level balancing across regions.</li><li><b>Sticky sessions:</b> pin a user to a server. Avoid it, because it breaks even load distribution and failover. Prefer stateless servers.</li><li><b>Connection draining</b> during deploys. <b>Global server load balancing</b> (GeoDNS / anycast) across regions.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I'd use a managed L7 load balancer for TLS termination and path-based routing, least-connections for uneven request times, active health checks for failover, and no sticky sessions because servers are stateless. Across regions, GeoDNS or anycast in front."</p>`}
],
cmp:[{cols:['Algorithm','How','Best when'],rows:[['Round robin','rotate in order','uniform servers & requests'],['Weighted RR','rotate by capacity','mixed server sizes'],['Least connections','fewest active conns','long or uneven requests'],['Least response time','fastest + fewest','latency-sensitive'],['IP hash / consistent hash','hash(client or key) → server','cache affinity, sticky routing']]},
 {t:'L4 vs L7',cols:['','L4','L7'],rows:[['Sees','IP, port','HTTP path, headers, cookies'],['Speed','fastest','slightly slower'],['Features','basic routing','TLS, path routing, auth, WAF'],['Example','AWS NLB','AWS ALB, NGINX, Envoy']]}],
quiz:[
 {q:`Route /api/* and /static/* to different server pools. Need…`,o:['L4 load balancer','L7 load balancer','DNS only','Sticky sessions'],a:1,x:`Only L7 understands HTTP paths.`},
 {q:`Requests vary from 10 ms to 30 s. Best algorithm?`,o:['Round robin','Least connections','Random','Static assignment'],a:1,x:`Accounts for current load rather than turn order.`},
 {q:`Why avoid sticky sessions?`,o:['They are illegal','Uneven load and lost sessions when a server dies','They slow DNS','They need L4'],a:1,x:`Keep state external so any server can serve anyone.`},
 {q:`How does an LB detect a dead server?`,o:['User complaints','Health checks','DNS TTL','TLS errors only'],a:1,x:`Periodic probes remove failing instances from rotation.`}
],
match:{pairs:[['Round robin','Rotate through servers'],['Least connections','Pick least busy'],['Consistent hashing','Same key → same server'],['Health check','Remove failing instances']]},
cards:[[`L4 vs L7 load balancer?`,`L4 routes on IP and port (fast, protocol-agnostic). L7 understands HTTP, so it can route by path or header, terminate TLS, and do auth, rate limiting and caching.`]]
},

/* ---------------- CACHING ---------------- */
{id:'caching',em:'⚡',t:'Caching',mins:20,d:`Cache-aside, write-through, write-back, eviction (LRU/LFU), TTLs, CDN, and cache stampede / invalidation.`,
anim:[{type:'flow',title:'Cache-aside (lazy loading)',h:340,nodes:[
 ['app','App server',140,170],['cache','Cache (Redis)',440,70,'in-memory, ~1 ms','g'],['db','Database',440,280,'~10 ms+','b']],
 edges:[{f:'app',t:'cache',bi:1},{f:'app',t:'db',bi:1}],
 steps:[
 {on:'app',t:`Request: <code>GET /product/42</code>.`},
 {on:'cache',go:'app>cache',t:`1. App checks the cache for key <code>product:42</code>.`},
 {bad:'cache',lbl:{cache:'MISS'},t:`2. <b>Cache miss.</b> It's not there yet.`},
 {on:'db',go:'app>db db>app',lbl:{cache:'Cache (Redis)'},t:`3. Read from the database.`},
 {on:'cache',go:'app>cache',lbl:{cache:'SET product:42 (TTL 10m)'},t:`4. Store the result in the cache <b>with a TTL</b>, then return it.`},
 {ok:'cache',go:'app>cache cache>app',lbl:{cache:'HIT'},t:`Next request: <b>cache hit</b> in ~1 ms, no DB load. Read-heavy apps often hit 90%+ ratios.`},
 {on:'db cache',lbl:{cache:'DEL product:42'},t:`On update: write the DB, then <b>delete (invalidate)</b> the cache key so the next read reloads fresh data.`}
]},
{type:'arr',title:'LRU eviction',frames:[
 {rows:[{lab:'Cache (capacity 4) · most recent →',a:['A','B','C','D']}],t:`Cache is full: A is least recently used, D most recent.`},
 {rows:[{lab:'GET B → move to most-recent',a:['A','C','D','B'],ok:'3'}],t:`Access B: it moves to the "most recent" end.`},
 {rows:[{lab:'PUT E → evict least recent (A)',a:['A','C','D','B'],bad:'0'}],t:`Insert E: no room, so <b>evict the least recently used</b>, which is A.`},
 {rows:[{lab:'After insert',a:['C','D','B','E'],ok:'3'}],t:`E is in. LRU is implemented with a <b>hash map + doubly linked list</b>: O(1) get and put. A classic DSA question too!`}
]}],
learn:[
 {h:'Write strategies',b:`<ul><li><b>Cache-aside:</b> the app manages the cache (read: check → miss → DB → set). The most common. The cache only holds what's read.</li><li><b>Read-through:</b> the cache library loads from the DB on a miss.</li><li><b>Write-through:</b> write to cache and DB synchronously. Fresh cache, slower writes.</li><li><b>Write-back (write-behind):</b> write to cache, flush to DB later. Fast writes, but data is lost if the cache dies.</li><li><b>Write-around:</b> write to DB only; the cache fills on read.</li></ul>`},
 {h:'Hard problems',b:`<ul><li><b>Invalidation:</b> TTLs plus delete-on-write. Accept bounded staleness.</li><li><b>Cache stampede (thundering herd):</b> a hot key expires and thousands of requests hit the DB. Fixes: request coalescing / locking, staggered (jittered) TTLs, refresh-ahead.</li><li><b>Hot keys:</b> replicate them or add a local in-process cache.</li><li><b>Cache penetration:</b> repeated lookups for keys that don't exist. Cache the "null" result or use a Bloom filter.</li></ul>`},
 {h:'Where caches live',b:`<p>Browser → CDN → API gateway → app in-memory → distributed cache (Redis / Memcached) → DB buffer pool. Cache as close to the user as correctness allows.</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"For read-heavy data I'd use cache-aside on Redis with TTLs and invalidate on write, LRU eviction, jittered TTLs plus request coalescing to prevent stampedes, and a CDN for static and public content. I'd state the staleness the product can tolerate."</p>`}
],
cmp:[{cols:['Strategy','Read path','Write path','Pros','Cons'],rows:[['Cache-aside','app checks cache, then DB','DB, then invalidate cache','simple, resilient','first read slow; brief staleness'],['Write-through','cache','cache + DB together','cache always fresh','slower writes'],['Write-back','cache','cache now, DB later','very fast writes','data loss risk'],['Write-around','cache, then DB','DB only','no cache pollution','recent writes miss']]},
 {t:'Redis vs Memcached',cols:['','Redis','Memcached'],rows:[['Data types','strings, hashes, lists, sets, sorted sets, streams','strings only'],['Persistence','optional (RDB/AOF)','none'],['Replication / cluster','yes','client-side sharding'],['Extras','pub/sub, Lua, TTL, rate limiting, leaderboards','simple, multithreaded']]}],
quiz:[
 {q:`A popular key expires and 10k requests hit the DB at once. This is…`,o:['Cache penetration','Cache stampede (thundering herd)','Write-back','Sharding'],a:1,x:`Fix with locking/coalescing, jittered TTLs or refresh-ahead.`},
 {q:`Fastest writes but risk of data loss if the cache crashes?`,o:['Write-through','Write-back','Cache-aside','Write-around'],a:1,x:`Writes are acknowledged before reaching durable storage.`},
 {q:`LRU evicts…`,o:['The most used item','The least recently used item','A random item','The largest item'],a:1,x:`Least Recently Used, implemented with a hashmap + doubly linked list.`},
 {q:`Attackers query random non-existent IDs, bypassing the cache. Fix?`,o:['Bigger cache','Cache null results / Bloom filter','Write-through','Remove TTL'],a:1,x:`That's cache penetration.`},
 {q:`With cache-aside, after updating the DB you should…`,o:['Do nothing','Invalidate (delete) the cache key','Flush the whole cache','Restart Redis'],a:1,x:`Delete-on-write keeps reads fresh.`}
],
order:{q:`Cache-aside read flow`,items:['Check cache','Miss','Read from DB','Write result to cache with TTL','Return response']},
match:{pairs:[['TTL','Auto-expire after time'],['LRU','Evict least recently used'],['Refresh-ahead','Reload hot keys before expiry'],['CDN','Edge cache near users']]},
cards:[[`How do you keep a cache consistent with the DB?`,`Cache-aside with delete-on-write plus TTLs as a safety net. Accept bounded staleness, or use write-through where freshness matters. For strict cases use versioned keys or skip caching that data.`]]
},

/* ---------------- DATABASES ---------------- */
{id:'databases',em:'🗄️',t:'Databases: SQL vs NoSQL & Indexing',mins:20,d:`Relational vs document, key-value, wide-column and graph stores, ACID vs BASE, and how B-tree indexes work.`,
anim:[{type:'flow',title:'How a B-tree index finds a row',h:360,nodes:[
 ['root','[ 40 | 80 ]',400,60,'root page','p'],['n1','[ 10 | 25 ]',170,180],['n2','[ 50 | 65 ]',400,180],['n3','[ 90 | 120 ]',630,180],
 ['l1','rows 50–64',300,300,'leaf → row pointers','g'],['l2','rows 65–79',500,300,'leaf']],
 edges:[['root','n1','<40'],['root','n2','40–80'],['root','n3','>80'],['n2','l1','50–64'],['n2','l2','≥65']],
 steps:[
 {t:`Query: <code>SELECT * FROM users WHERE id = 57</code>. Without an index the DB scans <b>every row</b>: O(n).`},
 {on:'root',t:`With a <b>B-tree index</b>, start at the root page: 57 is between 40 and 80.`},
 {on:'n2',go:'root>n2',t:`Follow the middle pointer: 57 is between 50 and 65.`},
 {on:'l1',go:'n2>l1',ok:'l1',t:`Reach the leaf holding 50–64 and jump straight to row 57. That's <b>O(log n)</b>: about 3–4 page reads even for millions of rows.`},
 {on:'l1 l2',t:`Leaves are linked in order, so <b>range queries</b> (<code>id BETWEEN 50 AND 70</code>) and ORDER BY are fast too.`},
 {on:'root n1 n2 n3',t:`Cost: every INSERT or UPDATE must also update the index. <b>Index what you query</b>, not everything.`}
]}],
learn:[
 {h:'SQL (relational)',b:`<ul><li>Tables, schemas, joins, <b>ACID</b> transactions (Atomicity, Consistency, Isolation, Durability).</li><li>Great for relationships, complex queries and money: orders, payments, users.</li><li>Postgres, MySQL. They scale reads with replicas; writes need sharding (Vitess, Citus) or distributed SQL (Spanner, CockroachDB).</li></ul>`},
 {h:'NoSQL families',b:`<ul><li><b>Key-value</b> (Redis, DynamoDB): get or put by key. Fastest. Sessions, carts, caches.</li><li><b>Document</b> (MongoDB): JSON documents, flexible schema. Catalogs, profiles.</li><li><b>Wide-column</b> (Cassandra, HBase): massive write throughput, partitioned by key. Chat messages, time-series, feeds.</li><li><b>Graph</b> (Neo4j): relationships first. Social graphs, recommendations, dependency maps.</li><li><b>Search</b> (Elasticsearch): full-text search. <b>Time-series</b> (InfluxDB, TimescaleDB): metrics.</li></ul>`},
 {h:'Indexing tips',b:`<ul><li>B-tree: equality and range. Hash index: equality only. Inverted index: full-text search.</li><li><b>Composite index</b> (a, b) serves queries on a, or a+b, not b alone (leftmost prefix rule).</li><li><b>Covering index</b> contains all the queried columns, so there's no table lookup.</li><li>Use EXPLAIN to see the query plan.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I default to Postgres for transactional data with clear relationships and ACID needs, indexed on the access patterns. I'd pick a wide-column store like Cassandra for huge write-heavy, key-partitioned data such as chat messages, and key-value stores for sessions and carts. The choice follows access patterns, consistency needs and scale."</p>`}
],
cmp:[{cols:['','SQL','NoSQL'],rows:[['Schema','fixed, enforced','flexible / schema-on-read'],['Transactions','ACID, multi-row','often single-item; BASE / eventual'],['Joins','✅ native','❌ denormalize instead'],['Scaling','vertical + replicas; sharding is hard','horizontal by design'],['Query','rich SQL','by key / limited'],['Use','payments, orders, inventory','feeds, chat, IoT, sessions, catalogs']]},
 {t:'Pick the store',cols:['Workload','Choose'],rows:[['Bank transfers','Postgres / MySQL (ACID)'],['Billions of chat messages','Cassandra / HBase / DynamoDB'],['Session store','Redis'],['Product search','Elasticsearch'],['Friends-of-friends','Neo4j / graph DB'],['Metrics','time-series DB']]}],
quiz:[
 {q:`An index on (country, city) helps which query most?`,o:['WHERE city = "Salem"','WHERE country = "IN" AND city = "Salem"','WHERE name = "x"','ORDER BY random()'],a:1,x:`Leftmost-prefix rule: (country) or (country, city), not city alone.`},
 {q:`Billions of writes/day, partitioned by user, simple lookups. Choose…`,o:['Single Postgres','Wide-column store (Cassandra)','Neo4j','SQLite'],a:1,x:`Wide-column stores are built for massive partitioned writes.`},
 {q:`Money transfers between accounts need…`,o:['Eventual consistency','ACID transactions','No indexes','A cache only'],a:1,x:`Atomic, isolated, durable transactions prevent lost or double money.`},
 {q:`Downside of adding many indexes?`,o:['Slower reads','Slower writes and more storage','Breaks SQL','No downside'],a:1,x:`Each write must update every index.`},
 {q:`B-tree lookup complexity?`,o:['O(1)','O(log n)','O(n)','O(n log n)'],a:1,x:`Balanced tree, so a few page reads.`}
],
match:{pairs:[['Redis','Key-value (sessions, cache)'],['MongoDB','Document store'],['Cassandra','Wide-column, write-heavy'],['Neo4j','Graph relationships']]},
cards:[[`SQL or NoSQL for X?`,`Start from access patterns and consistency. Relational and transactional with joins → SQL. Massive scale with simple key access or flexible schema → the right NoSQL family. Many systems use both (polyglot persistence).`]]
},

/* ---------------- REPLICATION & SHARDING ---------------- */
{id:'sharding',em:'🧩',t:'Replication, Sharding & Consistent Hashing',mins:20,d:`Leader-follower, multi-leader, sharding strategies, hot spots, and why consistent hashing minimizes reshuffling.`,
anim:[{type:'flow',title:'Replication: leader → followers',h:320,nodes:[
 ['w','Writes',90,90],['r','Reads',90,240],['ld','Leader (primary)',340,90,'','p'],['f1','Follower 1',600,60,'replica','b'],['f2','Follower 2',600,170,'replica','b'],['f3','Follower 3',600,280,'other region','b']],
 edges:[['w','ld'],['ld','f1'],['ld','f2'],['ld','f3'],{f:'r',t:'f2',dash:1},{f:'r',t:'f3',dash:1}],
 steps:[
 {on:'ld',go:'w>ld',t:`All <b>writes</b> go to the leader (primary).`},
 {on:'f1 f2 f3',go:'ld>f1 ld>f2 ld>f3',t:`The leader streams changes (WAL / binlog) to <b>followers</b>. Async is fast but followers can lag; sync is safe but slower.`},
 {on:'f2 f3',go:'r>f2 r>f3',t:`<b>Reads scale out</b> across followers. Watch <b>replication lag</b>: a user may not see their own update ("read-your-writes" issue). Route their own reads to the leader briefly.`},
 {bad:'ld',on:'f1',lbl:{f1:'New leader ★'},t:`Leader dies → <b>failover</b>: promote a follower. Risk: async replication can lose the last writes, and a <b>split brain</b> if two nodes both think they're leader.`}
]},
{type:'flow',title:'Consistent hashing ring',h:420,rings:[{x:400,y:210,r:265,ry:155,l:'hash ring 0 … 2³²'}],nodes:[
 ['A','Server A',400,55,'','p'],['B','Server B',665,210,'','p'],['C','Server C',400,365,'','p'],['D','Server D',135,210,'new!','g',4],
 ['k1','key "user:7"',600,90,'','y'],['k2','key "user:42"',560,320,'','y'],['k3','key "cart:9"',200,330,'','y'],['k4','key "img:3"',200,95,'','y']],
 edges:[{f:'k1',t:'B',l:'clockwise →'},{f:'k2',t:'C'},{f:'k3',t:'A',cv:-60,at:1},{f:'k4',t:'A'},{f:'k3',t:'D',at:4}],
 steps:[
 {t:`Naive sharding: <code>server = hash(key) % N</code>. Add 1 server (N → N+1) and almost <b>every key moves</b>, causing a cache wipe or massive data migration.`},
 {on:'A B C',t:`<b>Consistent hashing:</b> put servers on a ring (hash of server ID → position 0…2³²).`},
 {on:'k1 B k2 C',go:'k1>B k2>C',t:`Each key is hashed onto the ring too and belongs to the <b>first server clockwise</b>.`},
 {on:'k3 k4 A',go:'k3>A k4>A',t:`"cart:9" and "img:3" both walk clockwise to Server A.`},
 {on:'D k3',go:'k3>D',ok:'D',t:`Add Server D: only keys between C and D (here "cart:9") move to D. About <b>1/N of keys</b> move, not all of them.`},
 {on:'A B C D',t:`<b>Virtual nodes:</b> each server appears at many ring points to even out the load. Used by DynamoDB, Cassandra, CDNs and distributed caches.`}
]}],
learn:[
 {h:'Replication types',b:`<ul><li><b>Leader-follower:</b> simple, read scaling, failover. The most common.</li><li><b>Multi-leader:</b> writes in several regions. Needs conflict resolution (last-write-wins, CRDTs).</li><li><b>Leaderless</b> (Dynamo-style): write to W replicas, read from R, with <b>W + R &gt; N</b> for overlap. Tunable consistency.</li></ul>`},
 {h:'Sharding (partitioning) strategies',b:`<ul><li><b>Range-based:</b> by ranges like user_id 1–1M. Supports range scans; risk of hot ranges (recent timestamps).</li><li><b>Hash-based:</b> even spread, but range queries hit every shard.</li><li><b>Directory / lookup:</b> a service maps key → shard. Flexible, but it's an extra hop and a dependency.</li><li><b>Geo-based:</b> by region, for data residency.</li></ul>`},
 {h:'Sharding pain points',b:`<ul><li><b>Shard key choice</b> is everything: high cardinality, evenly spread, matches query patterns.</li><li><b>Hot spots / celebrity problem:</b> one huge key. Split it with key salting.</li><li>Cross-shard joins and transactions become hard (scatter-gather, 2PC, sagas).</li><li>Rebalancing as data grows, which is where consistent hashing helps.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"First I'd scale reads with replicas and handle lag via read-your-writes routing. When write volume or data size exceeds one primary, I'd shard on a high-cardinality key that matches the main access pattern, e.g. user_id, using consistent hashing with virtual nodes so adding capacity moves only about 1/N of the data. I'd call out hot keys and cross-shard queries explicitly."</p>`}
],
cmp:[{cols:['Strategy','Pros','Cons'],rows:[['Range','range scans, simple','hot spots on sequential keys'],['Hash (mod N)','even spread','re-shuffle everything on resize'],['Consistent hash','~1/N keys move on resize','more complex; needs vnodes for balance'],['Directory','flexible placement','lookup service = dependency']]},
 {t:'Replication',cols:['Mode','Latency','Durability','Note'],rows:[['Synchronous','higher','no data loss on failover','slowest replica limits writes'],['Asynchronous','low','may lose recent writes','replication lag'],['Semi-sync','medium','≥1 replica confirmed','common compromise']]}],
quiz:[
 {q:`hash(key) % N with N going 4 → 5 moves roughly…`,o:['20% of keys','Almost all keys','No keys','Only new keys'],a:1,x:`Modulo changes for most keys. Consistent hashing moves only ~1/N.`},
 {q:`A user updates their profile then sees the old version. Likely cause?`,o:['Sharding','Replication lag reading from a follower','Cache hit ratio too high','DNS TTL'],a:1,x:`Fix with read-your-writes: route the user's reads to the leader briefly.`},
 {q:`Virtual nodes in consistent hashing help…`,o:['Encrypt data','Balance load more evenly across servers','Speed up DNS','Avoid replication'],a:1,x:`Each server owns many small arcs, smoothing the distribution.`},
 {q:`Good shard key for a chat app's messages table?`,o:['message_text','conversation_id','created_at only','boolean is_read'],a:1,x:`High cardinality, and it matches the main query "messages in this conversation".`},
 {q:`In leaderless replication, strong reads need…`,o:['W + R > N','W = 0','R = 0','N = 1'],a:0,x:`Read and write quorums overlap in at least one up-to-date replica.`}
],
match:{pairs:[['Replica','Copy for reads & failover'],['Shard','Horizontal partition of data'],['Split brain','Two nodes think they are leader'],['Hot spot','One shard gets disproportionate load']]},
cards:[[`Explain consistent hashing.`,`Servers and keys are hashed onto a ring, and a key belongs to the next server clockwise. Adding or removing a server only moves the keys in its arc (~1/N). Virtual nodes balance the load.`],[`Replication vs sharding?`,`Replication copies the same data to many nodes for reads and availability. Sharding splits different data across nodes for write throughput and storage. Real systems do both.`]]
},

/* ---------------- CAP ---------------- */
{id:'cap',em:'🔺',t:'CAP, PACELC & Consistency Models',mins:15,d:`What you really give up during a network partition, and strong vs eventual consistency in practice.`,
anim:[{type:'flow',title:'A network partition forces a choice',h:340,nodes:[
 ['u1','User in Mumbai',100,80],['n1','Node A',300,170,'balance = 100'],['n2','Node B',560,170,'balance = 100'],['u2','User in Dallas',720,80]],
 edges:[{f:'n1',t:'n2',l:'replication',bi:1},['u1','n1'],['u2','n2']],
 steps:[
 {on:'n1 n2',go:'n1>n2 n2>n1',t:`Two replicas keep data in sync over the network.`},
 {bad:'n1 n2',t:`<b>Partition:</b> the link between them breaks (it will happen in distributed systems). P is not optional.`},
 {on:'n1',go:'u1>n1',lbl:{n1:'Node A: write -30'},t:`Mumbai withdraws 30 on Node A. Node B can't learn about it. Now choose…`},
 {on:'n2',go:'u2>n2',bad:'n2',lbl:{n2:'Node B: refuse ✗'},t:`<b>CP (consistency):</b> B refuses reads and writes until the partition heals. Correct but <i>unavailable</i>. Banks, inventory counts, leader election (ZooKeeper, etcd).`},
 {ok:'n2',go:'u2>n2',lbl:{n2:'Node B: shows 100'},t:`<b>AP (availability):</b> B answers with possibly stale data and reconciles later. Always up, but <i>eventually</i> consistent. Social feeds, likes, carts (Dynamo, Cassandra).`},
 {on:'n1 n2',lbl:{n1:'Node A',n2:'Node B'},t:`<b>PACELC:</b> if Partition, choose A or C; <b>Else</b> (normal operation), choose Latency or Consistency. Even without failures, strong consistency costs latency.`}
]}],
learn:[
 {h:'CAP correctly stated',b:`<p>In the presence of a network <b>Partition</b>, a distributed system must choose between <b>Consistency</b> (every read sees the latest write, or errors) and <b>Availability</b> (every request gets a non-error response). "CA" isn't a real option for distributed systems, since partitions happen.</p>`},
 {h:'Consistency models (strong → weak)',b:`<ul><li><b>Linearizable / strong:</b> behaves like a single copy. Highest latency.</li><li><b>Sequential / causal:</b> preserves order or cause-effect (a reply never appears before the message).</li><li><b>Read-your-writes, monotonic reads:</b> per-user guarantees, often all the UX needs.</li><li><b>Eventual:</b> replicas converge if writes stop. Fast and highly available.</li></ul>`},
 {h:'Pick per feature, not per system',b:`<ul><li>Payment balance, seat booking, inventory decrement → strong (CP).</li><li>Like counts, view counts, feeds, presence → eventual (AP).</li><li>The same product can mix both.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"Partitions are a given, so the real choice is consistency vs availability during one, and latency vs consistency otherwise (PACELC). I'd choose per feature: strong consistency for payments and inventory, eventual consistency for likes and feeds, plus read-your-writes so users always see their own changes."</p>`}
],
cmp:[{cols:['System','Leans','Why'],rows:[['Bank ledger / payments','CP','never show wrong balance'],['Ticket / seat booking','CP','no double-booking'],['Social likes / views','AP','approximate is fine'],['Shopping cart (Dynamo paper)','AP','always accept add-to-cart; merge later'],['ZooKeeper / etcd','CP','coordination needs one truth'],['Cassandra (default)','AP (tunable)','quorum settings shift it']]}],
quiz:[
 {q:`During a partition, a CP system will…`,o:['Return stale data','Refuse some requests to stay consistent','Ignore the partition','Lose all data'],a:1,x:`It sacrifices availability for correctness.`},
 {q:`Like counts on posts can best tolerate…`,o:['Strong consistency only','Eventual consistency','No replication','Two-phase commit'],a:1,x:`Approximate, converging counts are acceptable.`},
 {q:`PACELC adds that, even without partitions, you trade…`,o:['Security vs cost','Latency vs consistency','CPU vs memory','SQL vs NoSQL'],a:1,x:`Else: Latency or Consistency.`},
 {q:`Why is "CA" not realistic for distributed systems?`,o:['Too expensive','Network partitions will happen, so you must handle P','It is too slow','Requires NoSQL'],a:1,x:`You must tolerate partitions, so you choose C or A when one occurs.`}
],
match:{pairs:[['Strong consistency','Reads always see latest write'],['Eventual consistency','Replicas converge over time'],['Read-your-writes','User sees own updates'],['Partition tolerance','Works despite network splits']]},
cards:[[`Explain CAP with an example.`,`Two replicas lose connection. A user writes to one. Either the other refuses requests until the link heals (consistent, unavailable) or it serves possibly stale data (available, eventually consistent). Choose per feature: payments CP, likes AP.`]]
}
]});

APP.segments.push({name:'Communication & Architecture',em:'🔌',desc:'how services talk, fail and get sized',lessons:[
/* ---------------- QUEUES ---------------- */
{id:'queues',em:'📬',t:'Message Queues & Event Streaming',mins:20,d:`Async processing, Kafka vs RabbitMQ/SQS, pub/sub, consumer groups, delivery guarantees and backpressure.`,
anim:[{type:'flow',title:'Decoupling with a queue',h:380,nodes:[
 ['api','Order API',100,190,'responds in 50 ms','p'],['q','Queue / topic',340,190,'durable buffer','y'],
 ['c1','Email worker',600,70,'',''],['c2','Inventory worker',600,190],['c3','Analytics worker',600,310],['dlq','Dead-letter queue',340,330,'failed after N retries','r']],
 edges:[['api','q','OrderPlaced'],['q','c1'],['q','c2'],['q','c3'],{f:'q',t:'dlq',dash:1}],
 steps:[
 {on:'api',t:`Without a queue, the order API calls email, inventory and analytics <i>synchronously</i>. That's slow, and if one is down the whole order fails.`},
 {on:'q',go:'api>q',t:`<b>With a queue:</b> the API publishes an <code>OrderPlaced</code> event and returns immediately. The producer doesn't know or care who consumes.`},
 {on:'c1 c2 c3',go:'q>c1 q>c2 q>c3',t:`<b>Pub/sub:</b> each downstream service consumes at its own pace. Add new consumers without touching the producer.`},
 {on:'q',lbl:{q:'Queue: 50k backlog'},t:`Traffic spike? The queue <b>absorbs the burst</b> (load leveling). Workers autoscale on queue depth. That's backpressure handled.`},
 {bad:'c1',on:'dlq',go:'q>dlq',lbl:{q:'Queue / topic'},t:`Email worker keeps failing on a bad message → retry with backoff, then move it to a <b>dead-letter queue</b> for inspection instead of blocking everything.`},
 {ok:'c1 c2 c3',t:`Result: <b>loose coupling, resilience, smoothing of spikes</b>. The trade-off is eventual consistency and more moving parts.`}
]},
{type:'arr',title:'Kafka: partitions & consumer groups',frames:[
 {rows:[{lab:'Topic "orders" · partition 0',a:['o1','o4','o7','o10']},{lab:'partition 1',a:['o2','o5','o8','o11']},{lab:'partition 2',a:['o3','o6','o9','o12']}],t:`A Kafka <b>topic</b> is split into <b>partitions</b>: append-only logs. Messages with the same key (e.g. order_id) go to the same partition, so <b>order is preserved per key</b>.`},
 {rows:[{lab:'P0 → consumer A',a:['o1','o4','o7','o10'],p:{offset:2},ok:'0 1'},{lab:'P1 → consumer B',a:['o2','o5','o8','o11'],p:{offset:1},ok:'0'},{lab:'P2 → consumer C',a:['o3','o6','o9','o12'],p:{offset:3},ok:'0 1 2'}],t:`A <b>consumer group</b> splits partitions among its members: each partition goes to one consumer. Each consumer tracks its <b>offset</b> (read position).`},
 {rows:[{lab:'Replay: reset offset → 0',a:['o1','o4','o7','o10'],p:{offset:0},hl:'0 1 2 3'}],t:`Messages <b>stay</b> after being read (retention: days or forever). A new service or a bug fix can <b>replay</b> history. RabbitMQ/SQS delete on ack.`},
 {rows:[{lab:'Parallelism limit',a:['P0','P1','P2']},{lab:'Consumers in group',a:['A','B','C','D (idle)'],bad:'3'}],t:`Max parallelism = number of partitions. A 4th consumer on 3 partitions sits idle, so plan the partition count ahead.`}
]}],
learn:[
 {h:'Delivery guarantees',b:`<ul><li><b>At-most-once:</b> may lose messages, never duplicates.</li><li><b>At-least-once:</b> never loses, may duplicate. The common default. Make consumers <b>idempotent</b> (dedupe by message ID).</li><li><b>Exactly-once:</b> possible within Kafka transactions. End to end it's really "at-least-once + idempotency".</li></ul>`},
 {h:'Patterns',b:`<ul><li><b>Work queue:</b> competing consumers share tasks (image resizing).</li><li><b>Pub/sub fan-out:</b> each subscriber gets every event.</li><li><b>Event sourcing:</b> the log of events is the source of truth.</li><li><b>Outbox pattern:</b> write the DB row and an "outbox" event in one transaction; a relay publishes it. Avoids the "DB updated but event lost" problem.</li><li><b>Saga:</b> distributed transaction as a chain of events with compensating actions.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I'd decouple the write path from slow side effects with a durable queue: Kafka if we need high throughput, per-key ordering and replay, or SQS/RabbitMQ for simple task queues. Consumers are idempotent because delivery is at-least-once, failures go to a DLQ, workers autoscale on lag, and the outbox pattern keeps DB and events consistent."</p>`}
],
cmp:[{cols:['','Kafka','RabbitMQ','AWS SQS'],rows:[['Model','distributed log (pull)','broker with queues/exchanges (push)','managed queue (pull)'],['Retention','days → forever, replayable','until acked','up to 14 days, deleted on ack'],['Ordering','per partition','per queue (mostly)','FIFO queues only'],['Throughput','millions/sec','tens of thousands/sec','high, managed'],['Best for','event streaming, analytics, logs, CDC','task queues, complex routing','simple decoupling on AWS']]}],
quiz:[
 {q:`Why must consumers be idempotent with at-least-once delivery?`,o:['For speed','The same message may be delivered more than once','To save storage','Kafka requires it'],a:1,x:`Dedupe by ID so reprocessing has no extra effect.`},
 {q:`Kafka preserves ordering…`,o:['Globally across a topic','Within a partition (same key)','Never','Only with one consumer group'],a:1,x:`Use a message key so related events land in the same partition.`},
 {q:`A poison message crashes the worker repeatedly. Use…`,o:['Bigger instance','Dead-letter queue after N retries','Delete the queue','Synchronous calls'],a:1,x:`Isolate it for inspection and let other messages flow.`},
 {q:`You need to rebuild a new search index from last month's events. Choose…`,o:['SQS','Kafka (replay from offset)','Synchronous REST','Memcached'],a:1,x:`Kafka retains logs, so consumers can replay.`},
 {q:`DB row updated but the event publish failed. Pattern that prevents this?`,o:['Outbox pattern','Round robin','Sharding','LRU'],a:0,x:`Write the event to an outbox table in the same transaction, then relay it.`}
],
match:{pairs:[['Partition','Ordered append-only log shard'],['Offset','Consumer read position'],['DLQ','Parking lot for failing messages'],['Consumer group','Consumers sharing partitions']]},
cards:[[`Kafka vs RabbitMQ?`,`Kafka is a distributed, retained, replayable log with per-partition ordering and huge throughput, good for event streaming and CDC. RabbitMQ is a broker with flexible routing that deletes on ack, good for task queues and request routing.`]]
},

/* ---------------- API DESIGN ---------------- */
{id:'api-design',em:'🔗',t:'API Design: REST, GraphQL, gRPC & Real-time',mins:20,d:`Resource design, idempotency keys, pagination, versioning, plus polling vs long-polling vs SSE vs WebSockets.`,
anim:[{type:'flow',title:'Idempotency key saves a double charge',h:340,nodes:[
 ['c','Mobile client',100,170],['api','Payments API',360,170,'checks Idempotency-Key','p'],['store','Key store',360,300,'key → saved response','b'],['pay','Card processor',640,170]],
 edges:[{f:'c',t:'api',bi:1},{f:'api',t:'store',bi:1},['api','pay']],
 steps:[
 {on:'c',t:`Client sends <code>POST /payments</code> with header <code>Idempotency-Key: 8f2c…</code> (a UUID it generated).`},
 {on:'api store',go:'c>api api>store',t:`API checks: have I seen this key? No, so record it as "in progress".`},
 {on:'pay',go:'api>pay',t:`Charge the card. Save the response under the key.`},
 {bad:'c',t:`Network drops <b>before</b> the client receives the 201. The client doesn't know if it worked, so it retries.`},
 {ok:'api',go:'c>api api>store store>api api>c',t:`Same key → API returns the <b>saved response</b> without charging again. Retries become safe. Stripe and every payment API work this way.`}
]},
{type:'flow',title:'Real-time options',h:360,nodes:[
 ['cl','Client',100,180],['p','Short polling',400,50,'ask every N s; wasteful'],['lp','Long polling',400,135,'server holds request until data'],['sse','Server-Sent Events',400,225,'one-way server → client stream'],['ws','WebSocket',400,315,'full-duplex, persistent','g'],['srv','Server',690,180]],
 edges:[['cl','p'],['cl','lp'],['cl','sse'],{f:'cl',t:'ws',bi:1},['p','srv'],['lp','srv'],['sse','srv'],{f:'ws',t:'srv',bi:1}],
 steps:[
 {on:'p',go:'cl>p p>srv',t:`<b>Short polling:</b> "anything new?" every few seconds. Simple, but lots of empty responses and delayed updates.`},
 {on:'lp',go:'cl>lp lp>srv',t:`<b>Long polling:</b> the server holds the request open until there's data (or timeout), then the client immediately re-asks. Near real-time over plain HTTP.`},
 {on:'sse',go:'srv>sse sse>cl',t:`<b>SSE:</b> one HTTP connection, the server pushes a stream of events. Perfect for one-way feeds such as notifications, live scores and <b>LLM token streaming</b>.`},
 {on:'ws',go:'cl>ws ws>srv srv>ws ws>cl',t:`<b>WebSocket:</b> a persistent two-way connection. Chat, multiplayer, collaborative editing. Needs stateful connection servers and sticky routing.`}
]}],
learn:[
 {h:'REST design checklist',b:`<ul><li>Nouns for resources: <code>GET /users/42/orders</code>, <code>POST /orders</code>.</li><li>Correct verbs and status codes. <b>GET, PUT, DELETE are idempotent</b>; POST isn't, unless you add an idempotency key.</li><li><b>Pagination:</b> cursor-based (<code>?after=abc&limit=20</code>) is stable and fast for feeds; offset (<code>?page=3</code>) is simple but slow and shifts on inserts.</li><li><b>Versioning:</b> <code>/v1/</code> in the path or a header. Never break clients silently.</li><li>Filtering, sorting, consistent error format, rate-limit headers, auth (OAuth2 / JWT).</li></ul>`},
 {h:'When to use which',b:`<ul><li><b>REST:</b> public APIs, CRUD, cacheable over HTTP.</li><li><b>GraphQL:</b> many clients needing different shapes of nested data in one round trip. Watch N+1 queries and caching complexity.</li><li><b>gRPC:</b> internal service-to-service: Protobuf binary, HTTP/2, streaming, strict contracts. Fast.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"Public API: REST with resource-oriented URLs, cursor pagination, versioning and idempotency keys on POSTs that move money or create orders. Internally, gRPC for low-latency typed calls. For live updates, SSE when it's server-to-client only, WebSockets when it's bidirectional, like chat."</p>`}
],

/* ---------------- MICROSERVICES ---------------- */
{id:'microservices',em:'🧱',t:'Monolith vs Microservices',mins:15,d:`API gateway, service discovery, service mesh, data ownership and when NOT to split.`,
anim:[{type:'flow',title:'Microservices architecture',h:400,nodes:[
 ['cl','Clients',80,200],['gw','API gateway',250,200,'auth, rate limit, routing','p'],
 ['us','User svc',480,70],['os','Order svc',480,200],['ps','Payment svc',480,330],
 ['udb','User DB',690,70,'','b'],['odb','Order DB',690,200,'','b'],['pdb','Payment DB',690,330,'','b'],['bus','Event bus',250,340,'Kafka','y']],
 edges:[['cl','gw'],['gw','us'],['gw','os'],{f:'os',t:'ps',l:'gRPC'},['us','udb'],['os','odb'],['ps','pdb'],{f:'os',t:'bus',dash:1},{f:'bus',t:'us',dash:1,cv:-40}],
 steps:[
 {on:'cl gw',go:'cl>gw',t:`An <b>API gateway</b> is the single front door: authentication, rate limiting, request routing, and aggregation for clients.`},
 {on:'us os ps',go:'gw>us gw>os',t:`Each <b>service</b> owns one business capability and is deployed and scaled independently by its own team.`},
 {on:'udb odb pdb',go:'us>udb os>odb ps>pdb',t:`<b>Database per service:</b> no shared tables. Others go through the API or events, never the DB directly.`},
 {on:'ps',go:'os>ps',t:`Sync calls (REST/gRPC) for immediate needs. Each call adds latency and a failure point, so use timeouts, retries and circuit breakers.`},
 {on:'bus',go:'os>bus bus>us',t:`Async <b>events</b> (OrderPlaced) let other services react without tight coupling.`},
 {t:`Plus <b>service discovery</b> (Consul, Kubernetes DNS), a <b>service mesh</b> (Istio/Linkerd for mTLS, retries, telemetry), and distributed tracing (OpenTelemetry). Powerful, but it's operational overhead.`}
]}],
learn:[
 {h:'Honest trade-offs',b:`<ul><li><b>Monolith:</b> one deployable. Simple to build, test and debug; transactions are easy. Pain arrives with large teams (merge conflicts, slow deploys, all-or-nothing scaling).</li><li><b>Microservices:</b> team autonomy, independent deploy and scale, fault isolation, tech freedom. Costs: network latency, distributed data consistency (sagas), observability, infrastructure complexity.</li><li><b>Modular monolith:</b> clean internal module boundaries in one deployable. A great default that's easy to split later.</li></ul>`},
 {h:'Distributed data',b:`<ul><li>No cross-service ACID transactions. Use <b>sagas</b>: a sequence of local transactions with compensating actions (refund if shipping fails).</li><li><b>CQRS:</b> separate write model from read model (materialized views fed by events).</li><li>Accept eventual consistency between services.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I'd start with a modular monolith unless team size or scaling needs justify microservices. When splitting, I follow business capabilities with database-per-service, an API gateway in front, gRPC or REST for sync calls with timeouts and circuit breakers, events for async workflows, sagas instead of distributed transactions, and OpenTelemetry tracing across everything."</p>`}
],
cmp:[{cols:['','Monolith','Microservices'],rows:[['Deploy','all together','independently'],['Scaling','whole app','per service'],['Data','one DB, ACID','DB per service, eventual consistency'],['Latency','in-process calls','network hops'],['Debugging','stack trace','distributed tracing'],['Team fit','small teams','many autonomous teams']]}],
quiz:[
 {q:`An order needs payment + inventory + shipping across services. Consistency approach?`,o:['Distributed 2PC everywhere','Saga with compensating actions','Shared database','Ignore failures'],a:1,x:`Sagas coordinate local transactions and undo on failure.`},
 {q:`Main role of an API gateway?`,o:['Store data','Single entry point: auth, routing, rate limiting','Replace databases','Run ML models'],a:1,x:`It centralizes cross-cutting edge concerns.`},
 {q:`A 4-person startup building an MVP should usually start with…`,o:['30 microservices','A (modular) monolith','Service mesh first','Event sourcing everywhere'],a:1,x:`Microservices overhead isn't worth it early.`},
 {q:`Microservices should share a database?`,o:['Yes, always','No: database per service, communicate via APIs/events','Only for reads','Only in production'],a:1,x:`Shared DBs re-couple services.`}
],
match:{pairs:[['Service discovery','Find instances dynamically'],['Service mesh','mTLS, retries, telemetry sidecars'],['Saga','Distributed transaction via compensations'],['CQRS','Separate read & write models']]},
cards:[[`When would you NOT use microservices?`,`Small team, early product, unclear domain boundaries, or no platform or observability maturity. A modular monolith gives most of the benefits with far less operational cost.`]]
},

/* ---------------- RELIABILITY ---------------- */
{id:'reliability',em:'🛟',t:'Reliability: Retries, Circuit Breakers & SLOs',mins:20,d:`Timeouts, exponential backoff with jitter, circuit breakers, bulkheads, redundancy, and SLIs/SLOs/error budgets.`,
anim:[{type:'flow',title:'Circuit breaker states',h:340,nodes:[
 ['cl','CLOSED',150,90,'requests flow normally','g'],['op','OPEN',650,90,'fail fast, no calls','r'],['ho','HALF-OPEN',400,280,'let a few test calls through','y']],
 edges:[{f:'cl',t:'op',l:'error rate > 50%'},{f:'op',t:'ho',l:'after 30 s'},{f:'ho',t:'cl',l:'tests succeed'},{f:'ho',t:'op',l:'test fails',dash:1,cv:-40}],
 steps:[
 {on:'cl',t:`<b>Closed:</b> normal operation. The breaker counts failures from the downstream service (say, Payments).`},
 {on:'op',go:'cl>op',t:`Failures exceed a threshold → <b>trip open</b>. Calls fail immediately (or use a fallback) instead of waiting on timeouts, which protects threads and the struggling service.`},
 {on:'ho',go:'op>ho',t:`After a cool-down, go <b>half-open</b>: allow a few trial requests.`},
 {ok:'cl',go:'ho>cl',t:`Trials succeed → close again. Normal traffic resumes.`},
 {bad:'op',go:'ho>op',t:`Trials fail → back to open. This stops <b>cascading failures</b>, where one slow dependency exhausts every caller's resources.`}
]},
{type:'arr',title:'Exponential backoff with jitter',frames:[
 {rows:[{lab:'Retry attempt',a:[1,2,3,4,5]},{lab:'Base delay (s) = 2^n',a:[1,2,4,8,16],hl:'0 1 2 3 4'}],t:`Retry immediately and you hammer a struggling service. <b>Exponential backoff</b> doubles the wait each attempt.`},
 {rows:[{lab:'Client A delays',a:[1,2,4,8,16]},{lab:'Client B delays',a:[1,2,4,8,16],bad:'0 1 2 3 4'}],t:`But if 10k clients failed at the same moment, they all retry in sync: a <b>thundering herd</b> at 1 s, 2 s, 4 s…`},
 {rows:[{lab:'Client A (jittered)',a:[0.7,1.3,3.1,6.2,13.9],ok:'0 1 2 3 4'},{lab:'Client B (jittered)',a:[0.2,1.8,2.4,7.7,9.5],ok:'0 1 2 3 4'}],t:`<b>Jitter:</b> randomize each delay (e.g. random between 0 and 2^n). Retries spread out and the service can recover.`},
 {rows:[{lab:'Rules',a:['timeouts on every call','cap max retries','only retry idempotent ops','retry budget'],noix:1}],t:`Always pair retries with <b>timeouts</b>, a max attempt count, idempotency, and a retry budget, so retries don't amplify an outage.`}
]}],
learn:[
 {h:'Resilience toolkit',b:`<ul><li><b>Timeouts</b> everywhere (no infinite waits).</li><li><b>Retries</b> with exponential backoff + jitter, only for transient errors and idempotent ops.</li><li><b>Circuit breakers</b> to fail fast on unhealthy dependencies.</li><li><b>Bulkheads:</b> isolate resource pools so one slow dependency can't sink everything.</li><li><b>Fallbacks / graceful degradation:</b> cached data, default recommendations, a "try later" queue.</li><li><b>Redundancy:</b> multiple instances, AZs and regions. Avoid single points of failure.</li><li><b>Load shedding & rate limiting</b> to protect yourself under overload.</li></ul>`},
 {h:'SLI / SLO / SLA',b:`<ul><li><b>SLI</b> (indicator): a measured metric, e.g. % of requests under 300 ms, success rate.</li><li><b>SLO</b> (objective): internal target, e.g. 99.9% success over 30 days.</li><li><b>SLA</b> (agreement): contractual promise with penalties, looser than the SLO.</li><li><b>Error budget</b> = 100% − SLO. 99.9% allows ~43 min of downtime a month. Spend it on releases; freeze risky changes when it's exhausted.</li></ul>`},
 {h:'Availability math',b:`<p>99.9% ≈ 8.8 h/year. 99.99% ≈ 53 min/year. Services in <b>series</b> multiply (0.999 × 0.999 ≈ 99.8%); <b>redundant</b> parallel copies improve availability: 1 − (0.01)² = 99.99%.</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"Every remote call gets a timeout, bounded retries with exponential backoff and jitter for idempotent operations, and a circuit breaker with a fallback. I'd isolate critical paths with bulkheads, run across availability zones, and define SLIs/SLOs with error budgets that drive alerting and release decisions."</p>`}
],
cmp:[{cols:['Pattern','Prevents','Example'],rows:[['Timeout','threads stuck forever','2 s on payment call'],['Retry + backoff + jitter','transient failures; herds','3 tries: ~1 s, ~2 s, ~4 s randomized'],['Circuit breaker','cascading failures','stop calling failing recommender'],['Bulkhead','resource exhaustion spreading','separate thread pool per dependency'],['Fallback','hard failures for users','show cached prices'],['Load shedding','total collapse under overload','drop low-priority requests (503)']]}],
quiz:[
 {q:`Why add jitter to exponential backoff?`,o:['Make retries faster','Avoid synchronized retry storms','Encrypt traffic','Reduce timeouts'],a:1,x:`Randomization spreads the retries out.`},
 {q:`A circuit breaker in OPEN state…`,o:['Sends all traffic','Fails fast without calling the dependency','Restarts the service','Doubles timeouts'],a:1,x:`It protects caller and callee while the dependency recovers.`},
 {q:`SLO of 99.9% monthly allows roughly…`,o:['4 min downtime','43 min downtime','7 hours downtime','1 day downtime'],a:1,x:`0.1% of ~43,200 minutes ≈ 43 minutes.`},
 {q:`Two services in series, each 99.9% available. Combined ≈`,o:['99.99%','99.9%','99.8%','99%'],a:2,x:`0.999 × 0.999 ≈ 0.998.`},
 {q:`Which operations are safe to retry automatically?`,o:['Any POST','Idempotent operations (or POST with idempotency key)','None','Only DELETEs'],a:1,x:`Retrying non-idempotent ops can duplicate effects.`}
],
order:{q:`Circuit breaker lifecycle`,items:['Closed: normal calls','Failures exceed threshold','Open: fail fast','Cool-down → half-open trial calls','Success → closed again']},
match:{pairs:[['SLI','Measured metric (e.g. success rate)'],['SLO','Internal target for the SLI'],['SLA','Contract with penalties'],['Error budget','Allowed unreliability (100% − SLO)']]},
cards:[[`How do you stop one slow service from taking down everything?`,`Timeouts, a circuit breaker with fallback, bulkheaded resource pools, bounded retries with jittered backoff, and load shedding, plus alerting on SLO burn rate.`]]
},

{type:'flow',title:'45-minute interview structure',h:340,nodes:[
 ['r','1 · Requirements',110,80,'5 min: functional + non-functional','p'],['e','2 · Estimates',360,80,'3 min: QPS, storage','y'],['a','3 · API & data model',610,80,'5 min','b'],
 ['h','4 · High-level design',610,240,'10 min: boxes & arrows','g'],['d','5 · Deep dives',360,240,'15 min: bottlenecks','r'],['w','6 · Wrap-up',110,240,'5 min: trade-offs, failure, scale','p']],
 edges:[['r','e'],['e','a'],['a','h'],['h','d'],['d','w']],
 steps:[
 {on:'r',t:`<b>Requirements:</b> who uses it, core features (pick 3), scale, latency, consistency, availability. <i>Ask</i>, don't assume.`},
 {on:'e',go:'r>e',t:`<b>Estimates:</b> QPS (read vs write), storage, bandwidth. These justify your choices later.`},
 {on:'a',go:'e>a',t:`<b>API & data model:</b> 3–5 endpoints and the main entities and keys.`},
 {on:'h',go:'a>h',t:`<b>High-level design:</b> client → LB → services → cache/DB/queue. Get a working end-to-end design first.`},
 {on:'d',go:'h>d',t:`<b>Deep dives:</b> the hardest parts (fan-out, hot keys, consistency, sharding). Let the interviewer steer.`},
 {on:'w',go:'d>w',t:`<b>Wrap-up:</b> bottlenecks, failure modes, monitoring, what you'd do at 10× scale. Name trade-offs explicitly.`}
]}],
learn:[
 {h:'Numbers to keep in your pocket',b:`<ul><li>1 day ≈ 86,400 s ≈ <b>10⁵ s</b> · 1 month ≈ 2.5M s · 1 year ≈ 3×10⁷ s</li><li>1M/day ≈ 12/s · 100M/day ≈ 1.2k/s · 1B/day ≈ 12k/s</li><li>A single well-tuned DB: ~1k–10k simple QPS. Redis: ~100k ops/s per node.</li><li>A modern server: tens of thousands of HTTP req/s for simple endpoints.</li></ul>`},
 {h:'What interviewers score',b:`<ul><li>Clarifying requirements before designing.</li><li>A clear, working high-level design.</li><li>Identifying bottlenecks yourself and going deep.</li><li><b>Trade-off reasoning</b> ("I chose X over Y because…").</li><li>Communication: think out loud, check in, manage time.</li></ul>`},
 {k:'pitfall',h:'Common mistakes',b:`<ul><li>Jumping into the database choice in minute one.</li><li>Over-engineering (Kafka + microservices for 100 users).</li><li>Never mentioning failure, monitoring or trade-offs.</li><li>Silent drawing. Narrate your thinking.</li></ul>`},
 {k:'say',h:'Opening line that works',b:`<p>"Before designing, let me clarify the scope: who are the users, which features are must-haves, and what scale and latency are we targeting? Then I'll do quick estimates, sketch the API and data model, draw a high-level design, and we can go deep on the parts you care most about."</p>`}
],
quiz:[
 {q:`100M requests/day is roughly…`,o:['12 QPS','~1,200 QPS','~12,000 QPS','~120,000 QPS'],a:1,x:`100M ÷ 10⁵ ≈ 1,000 (≈1,157).`},
 {q:`First thing to do in a system design interview?`,o:['Pick a database','Clarify requirements and scale','Draw microservices','Write code'],a:1,x:`Requirements drive every later decision.`},
 {q:`10M new 1 KB records/day for 5 years ≈`,o:['~18 GB','~18 TB','~180 TB','~1.8 PB'],a:1,x:`10 GB/day × 1825 days ≈ 18 TB.`},
 {q:`Read:write of 100:1 suggests prioritizing…`,o:['Write-optimized LSM only','Caching / read replicas / precomputation','Fewer indexes','Synchronous replication'],a:1,x:`Optimize the dominant path.`}
],
order:{q:`Order the 45-minute framework`,items:['Clarify requirements','Back-of-envelope estimates','API & data model','High-level design','Deep dives','Wrap-up: trade-offs & failure modes']},
