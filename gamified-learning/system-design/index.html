/* ---------------- URL SHORTENER ---------------- */
{id:'url-shortener',em:'🔗',t:'Design a URL Shortener (bit.ly)',mins:25,d:`Key generation, base62, a 100:1 read-heavy path, 301 vs 302 redirects, caching and analytics.`,
anim:[{type:'flow',title:'Create & redirect paths',h:420,nodes:[
 ['u','User',80,200],['lb','LB',220,200],['api','Shortener API',400,125,'POST /urls','p'],['kgs','Key generator',400,38,'pre-made unique IDs','y'],
 ['rd','Redirect service',400,290,'GET /{code}','p'],['cache','Cache',620,200,'code → long URL (hot 20%)','g'],['db','KV / NoSQL DB',620,350,'code PK → url, owner, expiry','b'],['an','Click events → Kafka',620,60,'analytics async','b']],
 edges:[['u','lb'],['lb','api'],{f:'api',t:'kgs',bi:1},{f:'api',t:'db',cv:-60},['lb','rd'],{f:'rd',t:'cache',bi:1},{f:'rd',t:'db',bi:1},{f:'rd',t:'an',dash:1,cv:60}],
 steps:[
 {k:'Requirements',t:`Shorten a long URL → <code>sho.rt/aZ3x9Q</code>, redirect fast, optional custom alias and expiry, click analytics. Assume 100M new URLs/month and <b>100:1 reads to writes</b>.`},
 {k:'Estimates',t:`Writes ≈ 100M / 2.5M s ≈ <b>40/s</b>. Reads ≈ <b>4k/s</b> (peaks ~20k). 5 years ≈ 6B URLs × ~500 B ≈ <b>3 TB</b>. 7 base62 chars = 62⁷ ≈ <b>3.5 trillion</b> codes, plenty.`},
 {k:'Create',on:'api kgs',go:'u>lb lb>api api>kgs',t:`<b>Key generation:</b> a key-generation service hands out pre-generated unique IDs (or a counter / Snowflake ID → <b>base62</b> encode). No collisions and no "check if exists" loop.`},
 {k:'Create',on:'db',go:'api>db',t:`Store <code>code → long_url, owner, created, expiry</code> in a KV / NoSQL store. Simple lookups by primary key, easy to shard by code.`},
 {k:'Redirect',on:'rd cache',go:'u>lb lb>rd rd>cache cache>rd',ok:'cache',t:`Redirect path: check the <b>cache</b> first. 20% of links get ~80% of the traffic, so the hit ratio is high.`},
 {k:'Redirect',on:'db',go:'rd>db db>rd',t:`Miss → DB → populate cache → respond <b>301</b> (permanent, browsers cache it, less load) or <b>302</b> (temporary, every click hits us, better analytics).`},
 {k:'Analytics',on:'an',go:'rd>an',t:`Emit click events asynchronously to Kafka → stream processing → analytics store. Never slow the redirect for analytics.`}
]}],
learn:[

],

{id:'rate-limiter',em:'🚦',t:'Design a Rate Limiter',mins:20,d:`Token bucket, leaky bucket, fixed and sliding windows, and distributed limiting with Redis.`,

 {rows:[{lab:'Burst of 3 requests',a:['○','○','○','●'],dim:'0 1 2',ok:'3'}],v:{tokens:1,'allowed':3,'t':'0.1 s'},t:`A burst of 3 requests: each takes a token → allowed. <b>Bursts up to capacity are fine.</b>`},
 {rows:[{lab:'2 more requests',a:['○','○','○','○'],dim:'0 1 2 3'}],v:{tokens:0,'allowed':1,'rejected':'1 → 429','t':'0.2 s'},t:`Next request takes the last token. The one after finds the bucket empty → <b>HTTP 429</b> with a <code>Retry-After</code> header.`},
 {rows:[{lab:'2 seconds later (refill)',a:['●','●','○','○'],ok:'0 1'}],v:{tokens:2,'t':'2.2 s'},t:`Refill is computed lazily: tokens = min(cap, tokens + elapsed × rate). Store just <b>(tokens, last_refill_ts)</b> per key.`},
 {rows:[{lab:'Sliding window log (alt)',a:['12:00:01','12:00:20','12:00:45','12:01:02 ✗'],hl:'0 1 2',bad:'3'}],v:{limit:'3 / 60 s'},t:`Alternative: <b>sliding window</b>, which counts requests in the last 60 s. Precise, but the log costs memory. A sliding window <i>counter</i> approximates it cheaply.`}
]},
{type:'flow',title:'Distributed rate limiting',h:340,nodes:[
 ['c','Clients',90,170],['gw','API gateway',300,170,'limiter middleware','p'],['r','Redis cluster',540,80,'atomic Lua: check + decrement','g'],['svc','Backend services',540,260],['cfg','Rules config',300,300,'free 100/min, pro 1000/min','y']],
 edges:[['c','gw'],{f:'gw',t:'r',bi:1},['gw','svc'],{f:'cfg',t:'gw',dash:1}],
 steps:[
 {on:'gw',go:'c>gw',t:`Enforce limits at the <b>edge</b> (API gateway or middleware) before requests consume backend resources.`},
 {on:'r',go:'gw>r r>gw',t:`Many gateway instances must share counters, so keep them in <b>Redis</b>. Use an atomic Lua script (or INCR + EXPIRE) so check-and-decrement can't race.`},
 {on:'cfg',go:'cfg>gw',t:`Rules per user tier, endpoint and IP live in config and are cached locally in the gateway.`},
 {ok:'svc',go:'gw>svc',t:`Allowed → forward. Denied → 429 plus <code>X-RateLimit-Remaining</code> headers. If Redis is down, decide <b>fail-open</b> (availability) or <b>fail-closed</b> (protection).`}
]}],
learn:[
 {h:'Requirements to clarify',b:`<ul><li>Limit by what? User ID, API key, IP, endpoint.</li><li>Hard or soft limits? Bursts allowed?</li><li>Distributed across many servers or regions? Latency budget (must add &lt;1–2 ms).</li><li>Behaviour on limiter failure: fail open or fail closed.</li></ul>`},
 {h:'Scaling details',b:`<ul><li>Shard Redis by key. Local in-memory pre-checks for very hot keys.</li><li>Multi-region: per-region limits or async global sync (approximate is usually fine).</li><li>Return standard headers so clients can back off politely.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I'd use a token bucket per API key since it allows controlled bursts, stored as (tokens, last_refill) in Redis and updated atomically via Lua at the API gateway. Rules are per tier and endpoint. Responses carry 429 with Retry-After and rate-limit headers, and if Redis fails I'd fail open for normal endpoints but fail closed for expensive or abuse-prone ones."</p>`}
],
cmp:[{cols:['Algorithm','Bursts','Memory','Accuracy','Notes'],rows:[['Token bucket','✅ up to capacity','tiny (2 values)','good','most popular (AWS, Stripe)'],['Leaky bucket','❌ smooths to constant rate','queue','good','traffic shaping'],['Fixed window counter','⚠️ 2× burst at window edges','tiny','edge spikes','simplest'],['Sliding window log','✅','high (timestamps)','exact','costly at scale'],['Sliding window counter','✅','tiny','approximate, good','great trade-off']]}],
quiz:[
 {q:`Which algorithm naturally allows short bursts?`,o:['Leaky bucket','Token bucket','Fixed window','None'],a:1,x:`Accumulated tokens can be spent in a burst.`},
 {q:`Fixed-window counters can allow up to 2× the limit because…`,o:['Clock skew','Requests cluster at the end of one window and the start of the next','Redis is slow','Tokens refill'],a:1,x:`Boundary bursts. Sliding windows fix this.`},
 {q:`Why use a Lua script in Redis?`,o:['Prettier code','Atomic check-and-update across concurrent requests','Encryption','Persistence'],a:1,x:`Prevents race conditions between read and write.`},
 {q:`Correct response when rate limited?`,o:['500','404','429 with Retry-After','200 with empty body'],a:2,x:`429 Too Many Requests tells clients to back off.`}
],
match:{pairs:[['Token bucket','Refill tokens, spend per request'],['Leaky bucket','Process at constant rate'],['Sliding window log','Store timestamps, count recent'],['Fail-open','Allow traffic if limiter is down']]},
cards:[[`Design a distributed rate limiter.`,`Token bucket per key in Redis (tokens, timestamp), atomic Lua updates at the gateway, config-driven rules per tier and endpoint, 429 + headers, local caching for hot keys, an explicit fail-open/closed policy, and monitoring of rejections.`]]
},

/* ---------------- CHAT APP ---------------- */
{id:'chat-app',em:'💬',t:'Design a Chat App (WhatsApp)',mins:25,d:`WebSocket gateways, message routing, delivery receipts, offline push, ordering and storage at scale.`,
anim:[{type:'flow',title:'Sending a message from A to B',h:430,nodes:[
 ['a','Alice (phone)',80,80],['ws1','WS gateway 1',260,80,'holds Alice conn','p'],['chat','Chat service',460,180,'validate, ID, persist','p'],['pres','Session registry',260,250,'user → gateway (Redis)','y'],
 ['db','Message store',460,340,'Cassandra by conv_id','b'],['ws2','WS gateway 2',660,80,'holds Bob conn','p'],['b','Bob (phone)',720,190],['push','Push service',660,340,'APNs / FCM','r']],
 edges:[{f:'a',t:'ws1',bi:1},['ws1','chat'],{f:'chat',t:'pres',bi:1},['chat','db'],['chat','ws2'],{f:'ws2',t:'b',bi:1},{f:'chat',t:'push',dash:1}],
 steps:[
 {on:'a ws1',go:'a>ws1',t:`Each online client keeps a persistent <b>WebSocket</b> to a gateway server (millions of connections spread over many gateways).`},
 {on:'chat',go:'ws1>chat',t:`The gateway forwards to the <b>chat service</b>: authenticate, assign a message ID (time-sortable, e.g. Snowflake), dedupe by client message ID.`},
 {on:'db',go:'chat>db',lbl:{a:'Alice ✓'},t:`<b>Persist first</b> (Cassandra/HBase partitioned by conversation_id, sorted by message_id), then ack Alice with one tick: "sent".`},
 {on:'pres',go:'chat>pres pres>chat',t:`Look up where Bob is connected in the <b>session registry</b>: Bob → gateway 2.`},
 {on:'ws2 b',go:'chat>ws2 ws2>b',lbl:{a:'Alice ✓✓'},t:`Route to gateway 2 → Bob. Bob's app acks → "delivered" (two ticks) flows back to Alice. "Read" works the same way.`},
 {on:'push',go:'chat>push',bad:'b',t:`Bob offline? Store it and send a <b>push notification</b>. When Bob reconnects, he syncs everything after his last seen message_id.`}
]}],
learn:[
 {h:'Requirements & numbers',b:`<ul><li>1:1 and group chat, online presence, delivery and read receipts, offline delivery, media, multi-device.</li><li>Say 500M DAU × 40 msgs ≈ 20B msgs/day ≈ <b>230k msgs/s</b>; ~100 B each ≈ 2 TB/day of text.</li><li>Low latency (&lt;200 ms), messages never lost, ordered within a conversation.</li></ul>`},
 {h:'Deep dives',b:`<ul><li><b>Connections:</b> WebSocket gateways are stateful, so you need a registry (user → gateway) and graceful reconnect with resume from the last message_id.</li><li><b>Ordering:</b> per-conversation sequence numbers or time-sortable IDs. Clients sort and dedupe.</li><li><b>Group chat:</b> small groups fan out on write to each member; very large groups or channels use pull or fan-out via queues.</li><li><b>Media:</b> upload to object storage via pre-signed URL and send only the reference in the message. CDN for downloads.</li><li><b>E2E encryption</b> (Signal protocol): the server routes ciphertext it can't read.</li><li><b>Presence:</b> heartbeats with TTL in Redis; publish changes only to interested contacts.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"Clients hold WebSockets to a fleet of gateways, with a Redis registry mapping user to gateway. The chat service assigns time-sortable IDs, persists to Cassandra partitioned by conversation, acks the sender, then routes to the recipient's gateway or falls back to push notifications. Receipts are just small messages back. Reconnecting clients sync from their last message ID, media goes via object storage and CDN, and group fan-out depends on group size."</p>`}
],
cmp:[{cols:['Choice','Option','Why'],rows:[['Transport','WebSocket','bidirectional, low latency, server push'],['Message store','Cassandra / HBase','huge write volume, partition by conversation, range by time'],['Session registry','Redis','fast user → gateway lookup with TTL'],['IDs','Snowflake / per-conv sequence','ordering + uniqueness'],['Offline','Push (APNs/FCM) + sync on reconnect','reliable delivery'],['Media','S3 + CDN','offload bytes from chat path']]}],
quiz:[
 {q:`How does the system know which server holds Bob's connection?`,o:['Broadcast to all servers','Session registry (user → gateway) in Redis','DNS lookup','Ask Bob'],a:1,x:`A fast lookup table updated on connect and disconnect.`},
 {q:`Best partition key for messages?`,o:['message_text','conversation_id','sender_country','timestamp only'],a:1,x:`Messages of one conversation are read together in time order.`},
 {q:`When should the server ack "sent" to Alice?`,o:['Before persisting','After durably persisting the message','After Bob reads it','Never'],a:1,x:`Persist first so an ack never means a lost message.`},
 {q:`Sending a 20 MB video in chat?`,o:['Through the WebSocket','Upload to object storage, send a reference','Store in Cassandra','Email it'],a:1,x:`Keep heavy bytes off the real-time path.`}
],
order:{q:`Message flow, A → B`,items:['A sends over WebSocket','Chat service assigns ID & persists','Ack "sent" to A','Look up B gateway in registry','Deliver to B (or push if offline)','B acks → "delivered" to A']},
cards:[[`How do you guarantee no lost messages in chat?`,`Persist before acking the sender, client-generated message IDs for idempotent retries, per-conversation ordering, delivery acks from the recipient, push for offline users, and sync from the last-seen ID on reconnect.`]]
},

/* ---------------- NEWS FEED ---------------- */
{id:'news-feed',em:'📰',t:'Design a News Feed (Instagram / X)',mins:25,d:`Fan-out on write vs read, the celebrity problem, hybrid feeds, ranking and feed caches.`,
anim:[{type:'flow',title:'Fan-out on write vs read',h:420,nodes:[
 ['p','Priya posts',90,80,'500 followers','p'],['fs','Fan-out service',300,80,'',''],['f1','Feed cache: follower 1',560,40,'',''],['f2','Feed cache: follower 2',560,110],['f3','… 500 feeds',560,180],
 ['cel','Celebrity posts',90,300,'80M followers','r'],['pull','At read time: merge',360,330,'cached feed + celeb posts','y'],['u','Follower opens app',620,330,'','g']],
 edges:[['p','fs'],['fs','f1'],['fs','f2'],['fs','f3'],{f:'cel',t:'pull',dash:1},['pull','u'],{f:'f3',t:'pull',dash:1}],
 steps:[
 {on:'p',t:`Priya (500 followers) posts a photo.`},
 {on:'fs f1 f2 f3',go:'p>fs fs>f1 fs>f2 fs>f3',t:`<b>Fan-out on write (push):</b> immediately insert the post ID into each follower's precomputed <b>feed cache</b> (Redis list). Reads become a single fast lookup.`},
 {on:'cel',bad:'cel',t:`But a celebrity with <b>80M followers</b> would mean 80M writes per post: slow, wasteful, a hot spot. That's the <b>celebrity problem</b>.`},
 {on:'pull',go:'cel>pull',t:`<b>Fan-out on read (pull)</b> for celebrities: don't push. At read time fetch their recent posts and merge.`},
 {ok:'u',go:'f3>pull pull>u',t:`<b>Hybrid:</b> push for normal users, pull for celebrities, merged and <b>ranked</b> (recency, affinity, engagement) when the user opens the app.`}
]}],
learn:[
 {h:'Core components',b:`<ul><li><b>Post service:</b> stores posts (sharded DB) and media in object storage + CDN.</li><li><b>Social graph service:</b> who follows whom (graph DB or sharded adjacency tables).</li><li><b>Fan-out workers:</b> consume "PostCreated" from Kafka, write to follower feed caches.</li><li><b>Feed service:</b> reads feed cache (post IDs), hydrates post and user details from caches, ranks, paginates with cursors.</li><li><b>Ranking:</b> starts chronological; ML ranking uses features like affinity, engagement and freshness.</li></ul>`},
 {h:'Details that impress',b:`<ul><li>Store only post IDs in feeds (small) and keep the most recent ~500–1000.</li><li>Skip fan-out to inactive users and compute their feeds on demand.</li><li>Counts (likes/views) are eventually consistent, batched counters.</li><li>Deleted or edited posts: filter at hydration time.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"It's extremely read-heavy, so I precompute feeds with fan-out on write via Kafka workers into Redis feed lists of post IDs, except for high-follower accounts, which are pulled and merged at read time: a hybrid model. The feed service hydrates IDs from caches, ranks and paginates with cursors. Media is served from CDN, and counters are eventually consistent."</p>`}
],
cmp:[{cols:['','Fan-out on write (push)','Fan-out on read (pull)'],rows:[['Read latency','⚡ very fast','slower (gather + merge)'],['Write cost','high (× followers)','low'],['Celebrity','❌ explosion','✅ fine'],['Inactive users','wasted work','no waste'],['Freshness','instant','computed on read']]}],
quiz:[
 {q:`Main problem with pure fan-out on write?`,o:['Slow reads','Celebrities with millions of followers cause massive write amplification','No caching','Ordering'],a:1,x:`One post → millions of feed writes.`},
 {q:`Typical production approach?`,o:['Pure push','Pure pull','Hybrid: push for most, pull for celebrities','No feed'],a:2,x:`Combine the strengths of both.`},
 {q:`What is stored in each user's feed cache?`,o:['Full post JSON with images','Post IDs (then hydrate)','Follower lists','Raw videos'],a:1,x:`IDs keep feeds small; details come from shared caches.`},
 {q:`Feed pagination should use…`,o:['Offset pages','Cursors (last seen post ID / score)','Random','No pagination'],a:1,x:`Stable as new posts arrive.`}
],
order:{q:`Hybrid feed read path`,items:['User opens app','Read precomputed feed IDs from cache','Fetch recent posts of followed celebrities','Merge & rank','Hydrate post details, return page with cursor']},
cards:[[`Push vs pull feeds?`,`Push precomputes feeds on write for fast reads but explodes for celebrities. Pull computes at read time, cheap writes but slow reads. Hybrid: push for regular users, pull and merge for celebrities.`]]
},

/* ---------------- NOTIFICATIONS ---------------- */
{id:'notifications',em:'🔔',t:'Design a Notification System',mins:20,d:`Multi-channel (push, SMS, email, in-app), preferences, templates, priorities, retries and dedupe.`,
anim:[{type:'flow',title:'Notification pipeline',h:400,nodes:[
 ['src','Services',90,200,'billing, orders, alerts'],['api','Notification API',280,200,'validate, idempotency key','p'],['pref','Preferences & rate caps',280,70,'opt-outs, quiet hours','y'],
 ['q1','Priority queue',500,90,'OTP, security alerts','r'],['q2','Bulk queue',500,310,'marketing, digests','b'],
 ['w','Channel workers',690,200,'push / SMS / email / in-app','g'],['log','Delivery log',500,200,'status, retries, dedupe','b']],
 edges:[['src','api'],{f:'api',t:'pref',bi:1},['api','q1'],['api','q2'],['q1','w'],['q2','w'],{f:'w',t:'log',bi:1}],
 steps:[
 {on:'src api',go:'src>api',t:`Any service calls one <b>Notification API</b> with (user, type, data, idempotency key). No service talks to Twilio or APNs directly.`},
 {on:'pref',go:'api>pref pref>api',t:`Check <b>user preferences</b> (channel opt-outs, quiet hours, language) and <b>frequency caps</b>, then render the <b>template</b>.`},
 {on:'q1 q2',go:'api>q1 api>q2',t:`Enqueue by <b>priority</b>: an OTP must not wait behind 10M marketing emails. Separate queues or topics per priority and channel.`},
 {on:'w',go:'q1>w q2>w',t:`<b>Channel workers</b> call providers (APNs, FCM, Twilio, SES) with rate limits per provider, retries with backoff, and failover to a second provider.`},
 {on:'log',go:'w>log',t:`Record every attempt in a <b>delivery log</b>: dedupe by idempotency key, track status (sent, delivered, opened), drive retries and analytics.`}
]}],
learn:[
 {h:'Key design points',b:`<ul><li><b>At-least-once</b> delivery from queues + <b>dedupe</b> by notification ID, so users don't get the same OTP twice.</li><li>Priority isolation, per-provider rate limiting and circuit breakers.</li><li>Templates with localization. Batching into digests for low-priority messages.</li><li>Device token management (invalid tokens from APNs/FCM get cleaned up).</li><li>Scheduling (send at 9 am local) via a delayed queue or scheduler.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"A central notification service validates requests with idempotency keys, applies preferences, quiet hours and caps, renders templates, and enqueues into priority-separated queues per channel. Workers send via providers with rate limiting, retries and failover, while a delivery log handles dedupe, status tracking and analytics."</p>`}
],
cmp:[{cols:['Channel','Latency','Cost','Use'],rows:[['Push (APNs/FCM)','seconds','~free','engagement, alerts'],['SMS','seconds','$$ per msg','OTP, critical'],['Email','seconds–minutes','cheap','receipts, digests'],['In-app','real-time when open','free','activity feed']]}],
quiz:[
 {q:`Why separate priority queues?`,o:['Cheaper storage','So urgent messages (OTP) are not delayed behind bulk campaigns','Required by APNs','For encryption'],a:1,x:`Priority isolation keeps critical latency low.`},
 {q:`User received the same alert 3 times after retries. Missing piece?`,o:['Bigger queue','Deduplication via idempotency/notification ID','More workers','Shorter templates'],a:1,x:`At-least-once delivery needs dedupe.`},
 {q:`SMS provider is down. Good design?`,o:['Drop messages','Retry with backoff, fail over to a secondary provider','Crash the service','Send email silently instead always'],a:1,x:`Circuit breaker + failover keeps delivery going.`}
],
order:{q:`Order the notification pipeline`,items:['Service calls Notification API','Check preferences & caps','Render template','Enqueue by priority/channel','Worker sends via provider','Log status, retry on failure']},
cards:[[`Design a notification system.`,`Central API with idempotency, preferences, caps and templates, priority queues per channel, workers with provider rate limits, retries and failover, delivery log for dedupe and status, scheduling and analytics.`]]
},

/* ---------------- VIDEO STREAMING ---------------- */
{id:'youtube',em:'🎬',t:'Design Video Streaming (YouTube)',mins:25,d:`Upload pipeline, transcoding DAG, adaptive bitrate streaming (HLS/DASH), CDN and metadata.`,
anim:[{type:'flow',title:'Upload → process → stream',h:420,nodes:[
 ['cr','Creator',80,80],['up','Upload service',260,80,'pre-signed URL, resumable','p'],['raw','Raw storage',470,80,'S3 / blob','b'],['tq','Transcode queue',470,200,'','y'],
 ['tw','Transcoding workers',680,200,'240p…4K, chunks, thumbnails','p'],['enc','Encoded segments',680,320,'HLS / DASH','b'],['cdn','CDN edges',470,340,'cache popular videos','g'],['v','Viewer',220,340,'adaptive bitrate player'],['meta','Metadata DB',260,200,'title, status, URLs','b']],
 edges:[['cr','up'],['up','raw'],['up','meta'],['raw','tq'],['tq','tw'],['tw','enc'],['enc','cdn'],{f:'cdn',t:'v',bi:1}],
 steps:[
 {on:'cr up',go:'cr>up',t:`Creator uploads via a <b>pre-signed URL</b> straight to blob storage, chunked and resumable, so huge files never pass through app servers.`},
 {on:'raw meta',go:'up>raw up>meta',t:`Raw file lands in object storage. Metadata row status = "processing".`},
 {on:'tq tw',go:'raw>tq tq>tw',t:`An event triggers the <b>transcoding pipeline</b> (a DAG): split into chunks → encode in parallel into many resolutions and codecs → thumbnails, captions, content checks.`},
 {on:'enc',go:'tw>enc',t:`Output: small <b>segments</b> (2–10 s) per resolution plus a manifest (HLS .m3u8 / DASH .mpd). Status → "ready".`},
 {on:'cdn',go:'enc>cdn',t:`Segments are served from a <b>CDN</b>. Popular videos get cached at edges near viewers; the long tail is served from origin.`},
 {on:'v',go:'cdn>v v>cdn',t:`<b>Adaptive bitrate:</b> the player measures bandwidth and picks the next segment's quality: 1080p on Wi-Fi, 360p on a weak 4G signal, without stopping.`}
]}],
learn:[
 {h:'Requirements & scale',b:`<ul><li>Upload, transcode, stream smoothly worldwide. Search, comments, recommendations are secondary.</li><li>Read-heavy (views ≫ uploads). Bandwidth is the dominant cost, so the CDN is the hero.</li><li>Storage: each video is stored in multiple renditions, often 2–5× the source size.</li></ul>`},
 {h:'Deep dives',b:`<ul><li><b>Transcoding at scale:</b> split into GOP-aligned chunks, process in parallel on a worker fleet (or spot instances), coordinate via a DAG or workflow engine, retry failed chunks.</li><li><b>Cost:</b> encode popular videos in more formats (AV1/VP9) and the long tail in fewer. Move cold content to cheaper storage tiers.</li><li><b>View counts:</b> aggregated asynchronously (Kafka → stream processing), eventually consistent.</li><li><b>Live streaming:</b> similar segments but generated in real time, with lower latency targets.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"Uploads go directly to object storage via resumable pre-signed URLs. An event kicks off a parallel transcoding DAG that produces HLS/DASH segments at multiple bitrates plus thumbnails. Metadata lives in a DB, segments are served through a CDN, and players use adaptive bitrate. Views and analytics are processed asynchronously."</p>`}
],
cmp:[{cols:['Concern','Solution'],rows:[['Large uploads','pre-signed URLs, chunked resumable upload'],['Many devices / networks','multiple renditions + adaptive bitrate (HLS/DASH)'],['Global latency & bandwidth','CDN edge caching'],['Processing time','parallel chunked transcoding DAG'],['Storage cost','tiered storage, fewer renditions for cold videos'],['Counts & analytics','async stream processing']]}],
quiz:[
 {q:`Why upload directly to object storage with a pre-signed URL?`,o:['Encryption only','Keeps huge files off app servers; scalable and resumable','Required by CDN','Faster transcoding'],a:1,x:`App servers only issue the URL.`},
 {q:`Adaptive bitrate streaming means…`,o:['One fixed quality','The player switches segment quality based on bandwidth','Server compresses on the fly per user','Audio only'],a:1,x:`Segments exist at several bitrates; the player chooses per segment.`},
 {q:`Dominant infrastructure cost for video platforms?`,o:['CPU for APIs','Bandwidth / egress (hence CDNs)','DNS','Auth'],a:1,x:`Serving bytes worldwide is the big bill.`},
 {q:`How is transcoding sped up?`,o:['Bigger single server','Split video into chunks, encode in parallel','Skip encoding','Lower resolution only'],a:1,x:`Chunk-level parallelism across a worker fleet.`}
],
order:{q:`Video lifecycle`,items:['Resumable upload via pre-signed URL','Raw file stored in blob storage','Transcoding DAG creates renditions & segments','Manifest + segments published','CDN serves segments','Player adapts bitrate']},
cards:[[`Design YouTube in 60 seconds.`,`Pre-signed resumable uploads to blob storage, an event-driven parallel transcoding DAG producing HLS/DASH renditions and thumbnails, metadata DB, CDN distribution with adaptive bitrate playback, async view counting and recommendations. Optimize egress and storage tiers for cost.`]]
}
]});

/* System Design v2: "Start Here" section */
(function(){
const sdIntro={id:'sd-intro',em:'🧭',t:'What is System Design?',mins:15,d:`What the interview actually asks, the map of every building block in this app, and the vocabulary (latency, throughput, availability…) you will use in every answer.`,
intro:{one:`<b>System design</b> is planning how the pieces of a software system (servers, databases, caches, queues) fit together so that it works for <b>many users</b>: fast, reliable, and able to grow.`,
 ana:`<p>Coding is building one great room. System design is planning the whole building: where the entrances go, how many lifts, where water and power run, and what happens if one lift breaks during rush hour.</p>`,
 why:`<ul><li>Most mid-level and senior interviews include a system design round (often 45–60 minutes).</li><li>There's no single right answer. They judge how you reason about trade-offs.</li></ul>`,
 terms:[['High-level design (HLD)','The big boxes and arrows: services, databases, queues'],['Low-level design (LLD)','Classes, APIs and data models inside one component'],['Functional requirements','What the system must do (send a message, upload a video)'],['Non-functional requirements','How well it must do it (fast, always up, secure, scalable)'],['Trade-off','Gaining one quality by giving up another']],
 map:['Get a one-line tour of every building block you\'ll learn','Separate functional from non-functional requirements','Learn the 6 quality words used in every answer']},
anim:[{type:'flow',title:'The map: a typical web system',h:420,nodes:[
 ['u','Users',80,200,'phones, browsers'],['dns','DNS',230,70,'name → IP','y'],['cdn','CDN',230,330,'static files nearby','g'],['lb','Load balancer',390,200,'spreads traffic'],
 ['app','App servers',560,200,'your code, many copies','p'],['cache','Cache',560,70,'fast memory copy','g'],['db','Database',710,200,'source of truth','b'],['q','Queue',520,340,'background work','y'],['w','Workers',695,340,'emails, videos']],
 edges:[['u','dns'],['u','cdn'],['u','lb'],['lb','app'],{f:'app',t:'cache',bi:1},{f:'app',t:'db',bi:1},['app','q'],['q','w']],
 steps:[
 {on:'u',t:`Here is almost every system you'll design. This app teaches each box in its own lesson. First, a one-line tour.`},
 {on:'dns',go:'u>dns',t:`<b>DNS</b>: the internet's phone book, turning <code>app.com</code> into a server's IP address.`},
 {on:'cdn',go:'u>cdn',t:`<b>CDN</b>: copies of images, videos and JS stored in data centres near users, so they load fast.`},
 {on:'lb',go:'u>lb',t:`<b>Load balancer</b>: the receptionist spreading incoming requests across many servers.`},
 {on:'app',go:'lb>app',t:`<b>App servers</b>: run your backend code. We run many identical copies so we can handle more users.`},
 {on:'cache',go:'app>cache',t:`<b>Cache</b>: keeps popular data in memory so we don't hit the database every time (~1 ms vs ~10 ms).`},
 {on:'db',go:'app>db',t:`<b>Database</b>: where data permanently lives. Choosing and scaling it is often the hardest part.`},
 {on:'q w',go:'app>q q>w',t:`<b>Queue + workers</b>: slow jobs (sending emails, processing videos) happen in the background so users don't wait.`}
]},
{type:'arr',title:'Requirements for "Design WhatsApp"',frames:[
 {rows:[{lab:'functional (what it does)',a:['send 1:1 message','group chats','delivered / read ticks','media sharing'],noix:1,ok:'0 1 2 3'}],t:`<b>Functional requirements</b> = features. In an interview, agree on 3–4 core ones and explicitly park the rest.`},
 {rows:[{lab:'non-functional (how well)',a:['latency < 200 ms','never lose messages','500M daily users','end-to-end encrypted'],noix:1,hl:'0 1 2 3'}],t:`<b>Non-functional requirements</b> = qualities: speed, reliability, scale, security. These drive the architecture far more than features do.`},
 {rows:[{lab:'trade-off',a:['strong consistency','vs','low latency + availability'],noix:1,hl:'0',ok:'2'}],t:`Every design is a set of <b>trade-offs</b>. Saying "I choose X over Y because…" is what interviewers listen for.`}
]}],
learn:[
 {h:'The 6 quality words (use them in every answer)',b:`<ul><li><b>Latency:</b> how long one request takes (ms).</li><li><b>Throughput:</b> how many requests per second (QPS) the system handles.</li><li><b>Availability:</b> % of time it works (99.9% ≈ 43 min down a month).</li><li><b>Scalability:</b> can it handle 10× more users by adding machines?</li><li><b>Consistency:</b> does everyone see the latest data immediately?</li><li><b>Durability:</b> once saved, data is never lost.</li></ul>`},
 {h:'What interviewers evaluate',b:`<ol><li>Do you clarify requirements before drawing?</li><li>Can you produce a working end-to-end design?</li><li>Do you find the bottlenecks yourself and go deep?</li><li>Do you explain trade-offs and failure handling?</li><li>Do you communicate clearly and manage time?</li></ol>`},
 {h:'Suggested path through this app',b:`<p>Client/server basics → how a request travels → scaling → load balancers → caching → databases → replication & sharding → CAP → queues → APIs → microservices → reliability → estimation → then the 6 classic design rounds.</p>`},

],

],

const cs101={id:'client-server',em:'🖥️',t:'Clients, Servers, APIs & Databases 101',mins:20,d:`What actually happens between your phone and a backend: IP addresses, ports, HTTP requests and responses, JSON, APIs and where data is stored.`,
intro:{one:`Almost every app works the same way: a <b>client</b> (phone app, browser) sends a <b>request</b> over the internet to a <b>server</b>, which runs code, reads or writes a <b>database</b>, and sends back a <b>response</b>.`,
 ana:`<p>A restaurant: you (the client) give your order to a waiter using the menu (the API). The kitchen (the server) cooks using ingredients from the storeroom (the database), and the waiter brings back your plate (the response).</p>`,
 why:`<ul><li>Every system design question assumes you know this vocabulary cold.</li><li>APIs and databases appear in every single design.</li></ul>`,
 terms:[['Client','The app or browser that sends requests'],['Server','A computer that runs backend code and answers requests'],['IP address','A machine\'s address on the network, e.g. 142.250.1.1'],['Port','A numbered "door" on a machine for a specific service (443 = HTTPS)'],['HTTP','The language clients and servers use for requests and responses'],['API','The set of URLs and rules a server offers to clients'],['JSON','The common text format for data: {"name": "Karthik"}'],['Database','Software that stores data permanently and lets you query it']],
 map:['Follow one request from phone to database and back','Read a real HTTP request and response','See what an API endpoint is','Learn the basics of how databases store data']},
anim:[{type:'flow',title:'One request, start to finish',h:360,nodes:[
 ['c','Client (phone app)',100,180],['net','Internet',290,180,'routers & cables'],['s','Server 34.12.8.9 : 443',500,180,'runs your backend code','p'],['db','Database',700,180,'tables of data','b']],
 edges:[{f:'c',t:'net',bi:1},{f:'net',t:'s',bi:1},{f:'s',t:'db',bi:1}],
 steps:[
 {on:'c',t:`You open your profile in an app. The app needs your data from the company's computers.`},
 {on:'net s',go:'c>net net>s',t:`It sends an <b>HTTP request</b> over the internet to the server's <b>IP address</b> (34.12.8.9) on <b>port 443</b> (the standard HTTPS door).`},
 {on:'s',t:`The <b>server</b> is just a computer (usually in a cloud data centre) running your backend code. It checks who you are and what you asked for.`},
 {on:'db',go:'s>db db>s',t:`It queries the <b>database</b>: "give me user 42's profile". The database finds the row and returns it.`},
 {ok:'c',go:'s>net net>c',t:`The server sends back an <b>HTTP response</b> with status <code>200 OK</code> and your data as <b>JSON</b>. The app renders it. Usually all in under ~200 ms.`}
]},
{type:'arr',title:'Inside an HTTP request and response',frames:[
 {rows:[{lab:'request line',a:['GET','/api/users/42','HTTP/1.1'],noix:1,hl:'0 1'}],t:`A request starts with a <b>method</b> (GET = read) and a <b>path</b> (which resource).`},
 {rows:[{lab:'request headers',a:['Host: api.app.com','Authorization: Bearer eyJ…','Accept: application/json'],noix:1,hl:'1'}],t:`<b>Headers</b> carry extra info: which site, who you are (an auth token), what format you want back.`},
 {rows:[{lab:'POST body (JSON)',a:['{"name": "Karthik", "city": "Bangalore"}'],noix:1,ok:'0'}],t:`For creating or updating (POST/PUT), the request also has a <b>body</b>, usually JSON.`},
 {rows:[{lab:'response',a:['200 OK','Content-Type: application/json','{"id": 42, "name": "Karthik"}'],noix:1,ok:'0 2'}],t:`The response has a <b>status code</b> (200 OK, 404 Not Found, 500 Server Error), headers and a body. Simple text going back and forth.`}
]},
{type:'flow',title:'What an API is',h:330,nodes:[
 ['m','Mobile app',100,70],['w','Website',100,170],['p','Partner system',100,270],['api','Your API',370,170,'the menu of allowed requests','p'],
 ['e1','GET /users/42',640,70,'read a user'],['e2','POST /orders',640,170,'create an order'],['e3','DELETE /orders/7',640,270,'cancel an order']],
 edges:[['m','api'],['w','api'],['p','api'],['api','e1'],['api','e2'],['api','e3']],
 steps:[
 {on:'m w p',t:`Many different clients need the same data and actions.`},
 {on:'api',go:'m>api w>api p>api',t:`An <b>API</b> (Application Programming Interface) is the <b>menu</b> your server offers: the exact requests it accepts and what each returns. Clients don't touch the database directly.`},
 {on:'e1 e2 e3',go:'api>e1 api>e2 api>e3',t:`Each item is an <b>endpoint</b>: a method + path. A REST API uses nouns for resources (/users, /orders) and HTTP methods for actions (GET read, POST create, PUT update, DELETE remove).`}
]},
{type:'arr',title:'How a database stores data',frames:[
 {g:[['id','name','city'],[1,'Asha','Chennai'],[2,'Karthik','Bangalore'],[3,'Ravi','Salem']],hl:'0,0 0,1 0,2',t:`A relational database stores data in <b>tables</b>: <b>columns</b> are fields (id, name, city) and <b>rows</b> are records.`},
 {g:[['id','name','city'],[1,'Asha','Chennai'],[2,'Karthik','Bangalore'],[3,'Ravi','Salem']],ok:'1,0 2,0 3,0',t:`The <b>primary key</b> (id) uniquely identifies each row. Other tables point to it (orders.user_id → users.id).`},
 {g:[['id','name','city'],[1,'Asha','Chennai'],[2,'Karthik','Bangalore'],[3,'Ravi','Salem']],ok:'2,0 2,1 2,2',v:{SQL:'SELECT * FROM users WHERE id = 2'},t:`You ask for data with a <b>query</b>. The database finds and returns the matching row. Later lessons cover indexes (making this fast) and SQL vs NoSQL.`}
]}],
learn:[
 {h:'HTTP methods and status codes (must know)',b:`<ul><li><b>GET</b> read · <b>POST</b> create · <b>PUT/PATCH</b> update · <b>DELETE</b> remove.</li><li><b>2xx</b> success (200 OK, 201 Created) · <b>3xx</b> redirect · <b>4xx</b> client mistake (400 bad request, 401 not logged in, 403 forbidden, 404 not found, 429 too many requests) · <b>5xx</b> server failure (500, 503).</li></ul>`},
 {h:'A tiny backend, so it feels real (Python / FastAPI)',code:`from fastapi import FastAPI
app = FastAPI()

USERS = {42: {"id": 42, "name": "Karthik"}}   # stand-in for a database

@app.get("/users/{user_id}")                  # an API endpoint
def get_user(user_id: int):
    return USERS.get(user_id, {"error": "not found"})   # -> JSON response`},
 {h:'Networking in 4 lines',b:`<ul><li><b>IP address:</b> which machine. <b>Port:</b> which program on it (80 HTTP, 443 HTTPS, 5432 Postgres).</li><li><b>DNS</b> turns names into IPs.</li><li><b>TCP</b>: reliable, ordered delivery (web, APIs). <b>UDP</b>: fast, no guarantees (video calls, games).</li><li><b>HTTPS</b> = HTTP encrypted with TLS.</li></ul>`},
 {h:'Stateless servers',b:`<p>Each request carries everything the server needs (like an auth token), so any server copy can handle any request. This one idea is what makes scaling out easy (Scaling lesson).</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"Clients call our REST API over HTTPS. Stateless app servers authenticate the request, read or write the database, and return JSON with the right status code. Because the servers are stateless, we can run many of them behind a load balancer."</p>`}
],
cmp:[{cols:['','TCP','UDP'],rows:[['Delivery','guaranteed, in order','best effort'],['Speed','slightly slower (handshakes, retries)','faster'],['Used for','web, APIs, databases, email','video calls, gaming, DNS']]},
 {t:'Who does what',cols:['Part','Role','Example'],rows:[['Client','asks','phone app, browser'],['API','defines what can be asked','GET /users/42'],['Server','runs logic','Python FastAPI, Java Spring'],['Database','stores data permanently','Postgres, MongoDB']]}],

],

/* System Design v2: plain-English basics for every lesson + extra concept scenes */
APP.intro=Object.assign(APP.intro||{},{
'web-basics':{one:`When you open a website, your request passes through <b>DNS</b>, a <b>CDN</b>, a <b>load balancer</b>, an <b>app server</b>, a <b>cache</b> and a <b>database</b>. Knowing that path is the foundation of every design.`,
 ana:`<p>Posting a letter: look up the address (DNS), drop it at the nearest post office (CDN / load balancer), it's routed to the right department (server), which checks its files (cache/DB) and replies.</p>`,
 why:`<ul><li>"What happens when you type a URL?" is a classic opener.</li><li>Every later design builds on this request path.</li></ul>`,
 terms:[['DNS','Turns domain names into IP addresses'],['TLS','Encryption that makes HTTP into HTTPS'],['CDN','Servers near users that cache static files'],['Latency','Time for one request to complete']],
 map:['Follow a request through every box','Learn the latency numbers that matter','Know the HTTP status codes'],pre:['client-server']},
'scaling':{one:`<b>Scaling</b> means handling more users. You can buy a <b>bigger</b> server (vertical) or add <b>more</b> servers (horizontal); big systems scale horizontally.`,
 ana:`<p>A busy café can hire one super-fast barista (vertical, with a limit) or open more counters with more baristas (horizontal, which can keep growing).</p>`,
 why:`<ul><li>The core question of every design: "what happens at 10× or 100× traffic?"</li></ul>`,
 terms:[['Vertical scaling','Bigger machine (more CPU / RAM)'],['Horizontal scaling','More machines sharing the work'],['Stateless','Server keeps no user data between requests'],['Autoscaling','Add or remove servers automatically based on load'],['Bottleneck','The part that limits the whole system']],
 map:['Watch a system grow from 1 server to many','Compare vertical and horizontal scaling','Learn the classic scaling ladder'],pre:['client-server']},
'load-balancers':{one:`A <b>load balancer</b> sits in front of many servers and spreads incoming requests across them, skipping any server that is unhealthy.`,
 ana:`<p>The receptionist at a busy clinic sending each patient to whichever doctor is free, and never to a doctor who has gone home sick.</p>`,
 why:`<ul><li>Needed as soon as you have more than one server, which is every design.</li></ul>`,
 terms:[['Round robin','Take turns: A, B, C, A…'],['Least connections','Send to the least busy server'],['Health check','Regular "are you alive?" ping'],['L4 / L7','Routes by IP/port vs understands HTTP paths'],['Sticky session','Pin a user to one server (usually avoid)']],
 map:['Compare balancing algorithms visually','See health checks remove a dead server','Know L4 vs L7'],pre:['scaling']},
'caching':{one:`A <b>cache</b> keeps a copy of frequently used data somewhere much faster (usually memory) so you don't redo slow work, like querying the database, every time.`,
 ana:`<p>Keeping your most-used tools on your desk instead of walking to the storeroom each time. The storeroom (database) is the truth; the desk (cache) is a fast copy that can go stale.</p>`,
 why:`<ul><li>The single biggest performance lever in most designs.</li><li>Brings tricky questions: staleness, invalidation, stampedes.</li></ul>`,
 terms:[['Cache hit / miss','Found in cache / had to go to the source'],['TTL','Time-to-live: auto-expire after N seconds'],['Eviction (LRU)','When full, remove the least recently used item'],['Invalidation','Removing stale cache entries after data changes'],['Redis','The most popular in-memory cache']],
 map:['Watch cache-aside handle a miss and then a hit','See LRU eviction','Learn write strategies and their trade-offs'],pre:['client-server']},
'databases':{one:`A <b>database</b> stores data permanently. <b>SQL</b> databases use tables with strict structure and transactions; <b>NoSQL</b> databases trade some of that for flexibility and easy horizontal scale. <b>Indexes</b> make lookups fast.`,
 ana:`<p>SQL is a well-organised filing cabinet with labelled folders and strict rules. NoSQL is a set of flexible boxes you can keep adding anywhere. An index is the book's index at the back: jump straight to the page.</p>`,
 why:`<ul><li>"Which database and why?" appears in every design round.</li></ul>`,
 terms:[['Table / row / column','How SQL stores records'],['Primary key','Unique ID of a row'],['Index','Extra structure that makes lookups fast (B-tree)'],['Transaction / ACID','All-or-nothing, consistent, isolated, durable writes'],['NoSQL','Key-value, document, wide-column or graph stores']],
 map:['Refresh tables, rows and keys','Watch a B-tree index find a row','Choose SQL vs NoSQL by workload'],pre:['client-server']},
'sharding':{one:`<b>Replication</b> keeps copies of the same data on several machines (for reads and backup). <b>Sharding</b> splits different data across machines (for size and write load). <b>Consistent hashing</b> decides which machine owns which data.`,
 ana:`<p>Replication: photocopies of the same phone book in every branch office. Sharding: splitting the phone book into A–H, I–P and Q–Z volumes kept in different offices.</p>`,
 why:`<ul><li>How every large system scales its data layer.</li></ul>`,
 terms:[['Leader / follower','Writes go to the leader; followers copy it'],['Replication lag','Followers being slightly behind'],['Shard','One horizontal slice of the data'],['Shard key','The field that decides a row\'s shard'],['Consistent hashing','Placement that moves little data when servers change']],
 map:['Watch leader-follower replication and failover','See consistent hashing add a server','Pick a good shard key'],pre:['databases']},
'cap':{one:`The <b>CAP theorem</b>: if the network between your database copies breaks, you must choose to stay <b>consistent</b> (refuse some requests) or stay <b>available</b> (possibly serve stale data).`,
 ana:`<p>Two bank branches lose their phone line. Either both stop withdrawals until the line returns (consistent), or both keep serving customers and reconcile later (available).</p>`,
 why:`<ul><li>Interviewers expect you to choose consistency per feature (payments vs likes).</li></ul>`,
 terms:[['Consistency','Everyone reads the latest write'],['Availability','Every request gets a response'],['Partition','Network split between nodes'],['Eventual consistency','Copies agree after a short while']],
 map:['Watch a partition force the choice','Learn PACELC','Choose per feature'],pre:['sharding']},
'queues':{one:`A <b>message queue</b> lets one part of a system drop off work ("send this email") and immediately move on, while other workers pick it up and do it in the background.`,
 ana:`<p>A restaurant ticket rail: the waiter clips the order and goes back to customers; cooks take tickets at their own pace. A rush just makes the rail longer, and nothing is lost.</p>`,
 why:`<ul><li>Decoupling, absorbing traffic spikes and background jobs are in almost every design.</li></ul>`,
 terms:[['Producer / consumer','Who adds messages / who processes them'],['Topic / queue','The named channel holding messages'],['Async','The caller doesn\'t wait for the work to finish'],['Dead-letter queue','Where repeatedly failing messages go'],['Kafka / RabbitMQ / SQS','Popular queue and streaming systems']],
 map:['See sync vs async calls','Watch a queue decouple services','Understand Kafka partitions and consumer groups'],pre:['client-server']},
'api-design':{one:`<b>API design</b> is deciding the endpoints, data formats and rules clients use to talk to your service, so they're clear, safe to retry, efficient, and able to evolve.`,
 ana:`<p>Designing a restaurant menu: clear item names, prices, what happens if you order twice by accident, and how to add new dishes without confusing regulars.</p>`,
 why:`<ul><li>The "API" step appears in every design answer.</li><li>Real-time choices (WebSockets vs SSE) come up in chat and notification designs.</li></ul>`,
 terms:[['REST','Resource URLs + HTTP methods'],['GraphQL','Client asks for exactly the fields it needs'],['gRPC','Fast binary service-to-service calls'],['Idempotency','Repeating a request has no extra effect'],['Pagination','Returning results page by page']],
 map:['See an idempotency key prevent a double charge','Compare polling, SSE and WebSockets','Compare REST, GraphQL and gRPC'],pre:['client-server']},
'microservices':{one:`A <b>monolith</b> is one big application deployed as a unit. <b>Microservices</b> split it into small independent services, each owning one business area and its own data, talking over the network.`,
 ana:`<p>One big department store (monolith) vs a mall of specialist shops (microservices): the shops open and renovate independently, but you need corridors, signs and security between them.</p>`,
 why:`<ul><li>"Monolith or microservices?" is a frequent trade-off question.</li></ul>`,
 terms:[['Service','Independently deployable component'],['API gateway','The single front door for clients'],['Service discovery','How services find each other'],['Saga','Multi-service transaction with compensating steps']],
 map:['Walk through a microservices architecture','Know when NOT to split','Handle data across services'],pre:['api-design','queues']},
'reliability':{one:`<b>Reliability</b> means the system keeps working when parts fail: timeouts, smart retries, circuit breakers and redundancy contain failures, and SLOs define "working".`,
 ana:`<p>A building's fuses and fire doors: when one circuit fails, the fuse cuts it off so the whole building doesn't go dark.</p>`,
 why:`<ul><li>"What happens if X fails?" is asked in every design round.</li></ul>`,
 terms:[['Timeout','Give up waiting after N ms'],['Retry with backoff','Try again, waiting longer each time'],['Circuit breaker','Stop calling a failing service for a while'],['SLO','Internal reliability target (e.g. 99.9%)'],['Error budget','Allowed failure: 100% − SLO']],
 map:['Watch a circuit breaker change state','See why retries need jitter','Learn SLI / SLO / SLA'],pre:['microservices']},
'estimation':{one:`<b>Back-of-the-envelope estimation</b> is quick rough maths (requests per second, storage, bandwidth) to size a system. Plus the step-by-step structure for a 45-minute design interview.`,
 ana:`<p>Before planning a wedding you estimate guests, food and hall size. Not exact, but enough to know whether you need a hall for 100 or 1,000.</p>`,
 why:`<ul><li>Interviewers expect quick estimates early, and they justify your later choices.</li></ul>`,
 terms:[['QPS','Queries (requests) per second'],['DAU','Daily active users'],['Peak','Busiest moment, often 2–3× average'],['Read:write ratio','How read-heavy the system is']],
 map:['Estimate a Twitter-like app step by step','Memorise the key numbers','Learn the 45-minute structure'],pre:['sd-intro']},
'url-shortener':{one:`Design a service like bit.ly: turn long URLs into short codes and redirect anyone who opens the short link, at huge read volume.`,
 ana:`<p>A cloakroom ticket for links: hand in a long URL, get a short ticket; anyone with the ticket is sent straight to the original.</p>`,
 why:`<ul><li>The classic first design question: small, but covers IDs, caching, databases and scale.</li></ul>`,
 terms:[['Short code','e.g. aZ3x9Q, the unique key'],['Base62','Encoding with 0–9, a–z, A–Z'],['301 / 302','Permanent / temporary redirect'],['Read-heavy','Far more reads than writes']],
 map:['Walk through create and redirect paths','Choose a key-generation method','Decide 301 vs 302'],pre:['caching','databases','estimation']},
'rate-limiter':{one:`A <b>rate limiter</b> caps how many requests a user or client can make in a time window (e.g. 100 per minute) to protect the system from abuse and overload.`,
 ana:`<p>A nightclub bouncer with a clicker: only so many people in per minute; the rest wait outside.</p>`,
 why:`<ul><li>Common standalone question and a building block of every public API.</li></ul>`,
 terms:[['Token bucket','Tokens refill steadily; each request spends one'],['Sliding window','Count requests in the last N seconds'],['429','"Too Many Requests" status code'],['Fail-open / closed','Allow / block traffic if the limiter itself fails']],
 map:['Watch a token bucket allow bursts then block','Make it distributed with Redis','Compare algorithms'],pre:['caching','api-design']},
'chat-app':{one:`Design a messaging app like WhatsApp: real-time delivery, online/offline users, sent/delivered/read ticks, group chats, and never losing a message.`,
 ana:`<p>A postal system where couriers hold an open line to every recipient who's home, and leave a note in the mailbox (push notification) for anyone who's out.</p>`,
 why:`<ul><li>One of the most-asked designs; tests real-time connections, storage and ordering.</li></ul>`,
 terms:[['WebSocket','Persistent two-way connection'],['Session registry','Which server each user is connected to'],['Fan-out','Delivering one message to many recipients'],['Push notification','OS-level alert when the app is closed']],
 map:['Follow one message from A to B','Handle offline users and receipts','Pick storage and IDs'],pre:['api-design','databases','queues']},
'news-feed':{one:`Design a social feed like Instagram or X: when you open the app, show recent posts from people you follow, ranked, in milliseconds.`,
 ana:`<p>A newspaper delivery service: for most readers, papers are pre-packed overnight (fan-out on write); for papers with millions of readers, you collect them at the counter when you arrive (fan-out on read).</p>`,
 why:`<ul><li>Classic trade-off question: push vs pull, and the celebrity problem.</li></ul>`,
 terms:[['Fan-out on write','Push new posts into followers\' feeds immediately'],['Fan-out on read','Build the feed when the user opens it'],['Celebrity problem','Accounts with millions of followers'],['Hydration','Turning post IDs into full post data']],
 map:['Compare push and pull feeds','Solve the celebrity problem with a hybrid','Design the read path'],pre:['caching','queues']},
'notifications':{one:`Design a system that sends notifications through push, SMS, email and in-app channels: respecting user preferences, prioritising urgent messages, retrying failures and never double-sending.`,
 ana:`<p>A post office sorting room: urgent letters go in the express bin, bulk mail in another, every letter is logged, and failed deliveries are retried or returned.</p>`,
 why:`<ul><li>A common design question that exercises queues, retries, idempotency and third-party providers.</li></ul>`,
 terms:[['Channel','Push, SMS, email, in-app'],['Provider','External sender like APNs, FCM, Twilio, SES'],['Priority queue','Urgent messages processed first'],['Deduplication','Never send the same notification twice']],

<script>/* LearnQuest engine — vanilla JS, no deps */
(function(){
'use strict';
const A = window.APP;
const $ = (s,el=document)=>el.querySelector(s);

    if(A.pre&&A.pre[l.id]) l.anim=[].concat(A.pre[l.id],l.anim||[]);
    (l.probs||[]).forEach(p=>{ if(A.probx&&A.probx[p.lc||p.n]) Object.assign(p,A.probx[p.lc||p.n]); if(p.trace&&A.sync) applySync(p.trace,A.sync['p'+(p.lc||p.n)]); });
  }));
})();
const LESSONS=[]; A.segments.forEach((s,si)=>s.lessons.forEach(l=>{l.seg=si;l.n=LESSONS.length+1;LESSONS.push(l)}));
const byId = id=>LESSONS.find(l=>l.id===id);

/* ---------- state ---------- */

const lvl=()=>{const L=Math.floor(S.xp/250);return{n:L+1,name:LV_NAMES[Math.min(L,LV_NAMES.length-1)],pct:(S.xp%250)/2.5}};
function streak(){
  const set=new Set(S.days); let d=new Date(), n=0;
  if(!set.has(todayKey(d))) d.setDate(d.getDate()-1);
  while(set.has(todayKey(d))){n++;d.setDate(d.getDate()-1)}

}
function markDay(){const k=todayKey(); if(!S.days.includes(k)){S.days.push(k);}}

const nextLesson=()=>LESSONS.find(l=>!S.done[l.id]);

/* ---------- top bar ---------- */
const root=document.getElementById('app');
document.body.insertAdjacentHTML('afterbegin',`<div class="top"><div class="in">
 <div class="brand" id="brand"><div class="logo">${A.emoji}</div><span class="nm">${esc(A.name)}</span></div>

$('#brand').onclick=()=>go('');

const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function timerClick(){

  modal(`<h3 style="margin-top:0">⏱ Focus block</h3><p class="sub">One block = one track. Do AI, System Design and DSA as separate blocks.</p>

   (box,close)=>$$('[data-m]',box).forEach(b=>b.onclick=()=>{const m=+b.dataset.m;close();if(m){timer={left:m*60,total:m*60,run:true,h:null};tick();renderTop();}}));
}
function tick(){
  clearTimeout(timer.h);
  timer.h=setTimeout(()=>{ if(!timer.run) return; timer.left--;
    if(timer.left<=0){timer={left:0,total:0,run:false,h:null};S.focus=(S.focus||0)+1;gainXP(20);confetti(80);
      modal(`<div style="text-align:center"><div style="font-size:3rem">🏁</div><h3>Focus block complete!</h3><p class="sub">+20 XP. Take a 2-minute break, then start the next track.</p><button class="btn" data-x>Nice</button></div>`,(b,c)=>$('[data-x]',b).onclick=c);}
    else tick(); renderTop(); },1000);
}
function modal(html,bind){
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="card">${html}</div>`;
  const close=()=>m.remove(); m.addEventListener('click',e=>{if(e.target===m)close()});
  document.body.appendChild(m); bind&&bind(m,close);
}

/* ---------- routing ---------- */
function go(h){ if(location.hash.slice(1)===h) route(); else location.hash=h; }
window.addEventListener('hashchange',route);
let cleanup=[];
function route(){
  cleanup.forEach(f=>f()); cleanup=[];
  const h=location.hash.slice(1);
  window.scrollTo(0,0);
  if(h.startsWith('l-')&&byId(h.slice(2))) return lessonView(byId(h.slice(2)));
  if(h.startsWith('boss-')) return bossView(h.slice(5));
  if(h==='plan') return homeView('plan');
  homeView();
}

/* ---------- 30-day plan ---------- */
function buildPlan(){
  const items=[]; A.segments.forEach((s,si)=>{s.lessons.forEach(l=>items.push({k:'l',l}));items.push({k:'b',si})});
  const days=[];
  if(items.length<=30){ items.forEach(it=>days.push([it])); }
  else { const per=items.length/30; let acc=0; for(let d=0;d<30;d++){const n=Math.round((d+1)*per)-Math.round(d*per); days.push(items.slice(acc,acc+n)); acc+=n;} }
  const extra=['all','cards'];let e=0; while(days.length<30){days.push([{k:extra[e%2]==='all'?'b':'c',si:'all'}]);e++}
  return days;
}
const PLAN=buildPlan();
function itemLabel(it){ if(it.k==='l') return it.l.em+' '+it.l.t; if(it.k==='c') return '🃏 Flashcard sprint (all topics)'; return '👾 Boss battle: '+(it.si==='all'?'Everything':A.segments[it.si].name); }
function itemHref(it){ if(it.k==='l') return 'l-'+it.l.id; if(it.k==='c') return 'boss-cards'; return 'boss-'+it.si; }
function itemDone(it){ if(it.k==='l') return !!S.done[it.l.id]; if(it.k==='c') return !!S.boss.cards; return !!S.boss[it.si]; }

/* ---------- home ---------- */
function homeView(focus){
  const nl=nextLesson(); const st=streak(); const L=lvl();
  const doneN=Object.keys(S.done).length;
  const studied=S.days.length + (S.days.includes(todayKey())?0:1);
  const week=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {on:S.days.includes(todayKey(d)),l:'SMTWTFS'[d.getDay()]}});
  let html=`<div class="h1">${A.emoji} ${esc(A.name)}</div><p class="sub">${A.tagline}</p>
  <div class="mission">
   <div class="card big"><div class="kick">Day ${Math.min(studied,30)} of 30 · Today's mission</div>
    ${nl?`<div class="mtitle">${nl.em} ${esc(nl.t)}</div><div class="sub" style="margin:0">${nl.d}</div>
    <div class="blocks"><span class="on">🎬 Watch</span><span class="on">📖 Learn</span>${nl.probs?'<span class="on">🧩 Problems</span>':''}<span class="on">🎮 Play</span></div>
    <div class="row"><button class="btn" id="startNext">Start lesson ${nl.n} →</button><button class="btn ghost" id="startTimer">⏱ Start ${nl.mins||15}-min block</button></div>`
    :`<div class="mtitle">🏆 All lessons complete!</div><p class="sub">Keep the streak alive with boss battles and flashcard sprints.</p><button class="btn" onclick="location.hash='boss-all'">Final boss →</button>`}
   </div>
   <div class="card"><div class="kick">Your progress</div>
    <div style="font-size:1.4rem;font-weight:700;margin:6px 0">⭐ Level ${L.n} · ${L.name}</div>
    <div class="qprog"><i style="width:${L.pct}%"></i></div>
    <div class="row" style="gap:16px;color:var(--mut);font-size:.9rem"><span>🔥 <b>${st}</b> day streak</span><span>✅ <b>${doneN}/${LESSONS.length}</b> lessons</span><span>🏁 <b>${S.focus||0}</b> focus blocks</span></div>
    <div class="weekdots">${week.map(w=>`<i class="${w.on?'on':''}">${w.l}</i>`).join('')}</div>
   </div>
  </div>`;
  A.segments.forEach((s,si)=>{
    const dn=s.lessons.filter(l=>S.done[l.id]).length;
    html+=`<div class="seg"><div class="seg-h"><h3>${s.em||''} ${esc(s.name)}</h3><span class="c">${dn}/${s.lessons.length} · ${s.desc||''}</span>
      <button class="btn sm ghost" style="margin-left:auto" onclick="location.hash='boss-${si}'">👾 Boss${S.boss[si]?' ✓':''}</button></div><div class="path">`;
    s.lessons.forEach(l=>{const d=S.done[l.id];
      html+=`<button class="node ${d?'done':''} ${nl===l?'next':''}" data-l="${l.id}"><div class="st">${d?'⭐'.repeat(d)+'<span style="opacity:.25">'+'⭐'.repeat(3-d)+'</span>':''}</div>
      <div class="em">${l.em}</div><div class="n">LESSON ${l.n}</div><div class="tt">${esc(l.t)}</div><div class="ds">${l.d}</div></button>`});
    html+=`</div></div>`;
  });
  html+=`<div class="sec-t" id="plan">🗓️ 30-day plan <span class="c" style="color:var(--dim);font-size:.85rem;font-weight:500">one block a day, ~${A.mins||15} min</span></div><div class="plan">`;
  PLAN.forEach((d,i)=>{const ok=d.every(itemDone); const boss=d.some(it=>it.k!=='l');
    html+=`<div class="pday ${ok?'ok':''} ${boss?'boss':''}" data-h="${itemHref(d[0])}"><div class="d">DAY ${i+1} ${ok?'✓':''}</div>${d.map(it=>`<div class="t">${esc(itemLabel(it))}</div>`).join('')}</div>`});
  html+=`</div><div class="foot">${A.footer||''}<br>Progress is saved in this browser. <a href="#" id="reset">Reset progress</a></div>`;
  root.innerHTML=`<div class="wrap pane">${html}</div>`;
  $$('[data-l]').forEach(b=>b.onclick=()=>go('l-'+b.dataset.l));

  const sn=$('#startNext'); if(sn) sn.onclick=()=>go('l-'+nl.id);
  const stt=$('#startTimer'); if(stt) stt.onclick=()=>{timer={left:(nl.mins||15)*60,total:(nl.mins||15)*60,run:true,h:null};tick();renderTop();go('l-'+nl.id)};
  $('#reset').onclick=e=>{e.preventDefault();modal(`<h3 style="margin-top:0">Reset all progress?</h3><p class="sub">XP, streak and stars for this app will be cleared.</p><div class="row"><button class="btn" data-y style="background:var(--bad)">Reset</button><button class="btn ghost" data-n>Cancel</button></div>`,(b,c)=>{$('[data-n]',b).onclick=c;$('[data-y]',b).onclick=()=>{S={xp:0,done:{},days:[],boss:{},focus:0};save();c();renderTop();route();}})};
  if(focus==='plan') setTimeout(()=>$('#plan').scrollIntoView({behavior:'smooth'}),50);
}

/* ---------- code highlight ---------- */
const KW=new Set('def return if elif else for while in not and or is None True False class import from as with try except finally raise lambda yield pass break continue global nonlocal del assert async await'.split(' '));
const BI=new Set('len range print min max sum sorted enumerate zip map filter list dict set tuple int str float abs any all reversed heapq collections deque defaultdict Counter float inf self append pop popleft appendleft heappush heappop heapify bisect_left bisect_right ord chr'.split(' '));
function hl(code){
  const re=/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
  let out='',last=0,m,prev='';
  while((m=re.exec(code))){ out+=esc(code.slice(last,m.index)); last=re.lastIndex;
    if(m[1]) out+=`<span class="cm">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="st">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="nu">${m[3]}</span>`;
    else { const w=m[4]; if(KW.has(w)) out+=`<span class="kw">${w}</span>`; else if(prev==='def'||prev==='class') out+=`<span class="fnn">${w}</span>`; else if(BI.has(w)) out+=`<span class="bi">${w}</span>`; else out+=w; prev=w; continue;}
    prev='';
  }
  return out+esc(code.slice(last));
}
function codeBlock(code){
  const id='c'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{const b=document.getElementById(id); if(b) b.onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>{b.textContent='Copied ✓'},()=>{b.textContent='Select & copy'})}catch(e){b.textContent='Select & copy'}}},0);
  return `<div class="code"><button class="btn sm ghost cp" id="${id}">Copy</button><pre>${hl(code.replace(/^\n+|\s+$/g,''))}</pre></div>`;
}

/* ---------- animation player ---------- */
function normFlow(sc){
  const nodes=(sc.nodes||[]).map(n=>Array.isArray(n)?{id:n[0],l:n[1],x:n[2],y:n[3],s:n[4]||'',c:n[5]||'',at:n[6]||0}:Object.assign({s:'',c:'',at:0},n));
  nodes.forEach(n=>{ n.lines=wrapTxt(n.s); n.w=n.w||Math.max(64,String(n.l).length*8.6+28,Math.max(0,...n.lines.map(x=>x.length))*6.3+24); n.h=n.h||(n.lines.length?40+n.lines.length*14:44); });
  const edges=(sc.edges||[]).map(e=>Array.isArray(e)?{f:e[0],t:e[1],l:e[2]||'',at:e[3]}:e);
  const NM={};nodes.forEach(n=>NM[n.id]=n);
  return {nodes,edges,zones:sc.zones||[],rings:sc.rings||[],H:sc.h||400,NM};
}
function wrapTxt(t,max=24){ t=String(t||''); if(!t) return []; const w=t.split(' '); const out=[]; let cur='';
  w.forEach(x=>{ if(cur&&(cur+' '+x).length>max){out.push(cur);cur=x} else cur=cur?cur+' '+x:x }); if(cur) out.push(cur); return out; }
function subSVG(n,txt){ const L=wrapTxt(txt); const top=n.y-(18+L.length*14)/2; return L.map((x,i)=>`<tspan x="${n.x}" y="${top+25+i*14}">${esc(x)}</tspan>`).join(''); }
function clip(n,dx,dy){ const ax=Math.abs(dx)||1e-6, ay=Math.abs(dy)||1e-6; const t=Math.min((n.w/2+4)/ax,(n.h/2+4)/ay); return [n.x+dx*t,n.y+dy*t]; }
function seg(a,b){ const dx=b.x-a.x,dy=b.y-a.y; const p=clip(a,dx,dy), q=clip(b,-dx,-dy); return [p,q]; }
function geo(a,b,cv){ // returns {d (svg path), pt(t), mid}
  if(!cv){ const [p,q]=seg(a,b); return {d:`M${p[0]},${p[1]} L${q[0]},${q[1]}`,pt:t=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t],mid:[(p[0]+q[0])/2,(p[1]+q[1])/2]}; }
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1; const c=[mx-dy/L*cv,my+dx/L*cv];
  const p=clip(a,c[0]-a.x,c[1]-a.y), q=clip(b,c[0]-b.x,c[1]-b.y);
  const pt=t=>[(1-t)*(1-t)*p[0]+2*(1-t)*t*c[0]+t*t*q[0],(1-t)*(1-t)*p[1]+2*(1-t)*t*c[1]+t*t*q[1]];
  return {d:`M${p[0]},${p[1]} Q${c[0]},${c[1]} ${q[0]},${q[1]}`,pt,mid:pt(.5)}; }

function Player(mount,scenes,opts={}){
  scenes=Array.isArray(scenes)?scenes:[scenes];
  let touched=false, prevSig='', si=0, i=0, playing=false, tmo=null, spd=1, seen=new Set(), alive=true, pkTok=0;
  const onAllSeen=opts.onAllSeen||(()=>{});
  mount.innerHTML=`${scenes.length>1?`<div class="row" style="margin-bottom:10px" data-tabs>${scenes.map((s,k)=>`<button class="btn sm ${k?'ghost':''}" data-sc="${k}">${k+1}. ${esc(s.title||'Scene')}</button>`).join('')}</div>`:''}
   <div class="stage"><div class="stage-h"><b data-tt></b><span data-cnt></span></div><div data-vis></div>
   <div class="cap"><div class="k" data-k></div><div class="tx" data-cap></div></div>
   <div class="ctrls"><button class="ib" data-prev title="Previous (←)">◀</button><button class="ib" data-play title="Play/Pause (space)">▶</button><button class="ib" data-next title="Next (→)">▶|</button>
   <div class="dots" data-dots></div><button class="spd" data-spd>1x</button><button class="spd" data-rs title="Restart">↺</button></div></div>`;
  const vis=$('[data-vis]',mount);
  $$('[data-sc]',mount).forEach(b=>b.onclick=()=>{setScene(+b.dataset.sc)});
  $('[data-prev]',mount).onclick=()=>{touched=true;stop();show(i-1)};
  $('[data-next]',mount).onclick=()=>{touched=true;stop();show(i+1)};
  $('[data-play]',mount).onclick=()=>playing?stop():play();
  $('[data-rs]',mount).onclick=()=>{show(0);play()};
  $('[data-spd]',mount).onclick=e=>{spd=spd===1?1.5:spd===1.5?0.7:1;e.target.textContent=(spd===0.7?'0.7':spd)+'x'};
  let sc, steps, flow;
  function setScene(k){
    si=k; sc=scenes[k]; stop();
    $$('[data-sc]',mount).forEach((b,j)=>b.classList.toggle('ghost',j!==k));

function quizGame(mount,qs,done,opt={}){
  let k=0,score=0,lives=opt.lives||0,combo=0,xp=0;
  qs=qs.map(q=>{const order=shuffle(q.o.map((_,j)=>j)); return Object.assign({},q,{o:order.map(j=>q.o[j]),a:order.indexOf(q.a)})});
  function draw(){
    const q=qs[k];
    mount.innerHTML=`<div class="qbox pane"><div class="qmeta"><span>${opt.title||'Quiz'} · ${k+1}/${qs.length}</span><span>${lives?`<span class="hearts">${'❤️'.repeat(lives)}${'🖤'.repeat((opt.lives||0)-lives)}</span> `:''}${combo>=2?`<span class="combo">🔥 x${combo}</span>`:''}</span></div>
     <div class="qprog"><i style="width:${k/qs.length*100}%"></i></div><div class="qq">${q.q}</div>
     <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-o="${j}"><span class="k">${'ABCDEF'[j]}</span><span>${o}</span></button>`).join('')}</div><div data-ex></div></div>`;
    $$('[data-o]',mount).forEach(b=>b.onclick=ev=>{
      const j=+b.dataset.o, good=j===q.a;
      $$('[data-o]',mount).forEach(x=>{x.classList.add('off'); if(+x.dataset.o===q.a) x.classList.add('ok')});
      if(good){score++;combo++;const g=10*(opt.combo&&combo>=3?2:1);xp+=g;gainXP(g,ev);} else {b.classList.add('bad');combo=0;if(lives)lives--;}
      $('[data-ex]',mount).innerHTML=`<div class="expl ${good?'g':'r'}"><b>${good?'✅ Correct!':'❌ Not quite.'}</b> ${q.x||''}</div>
        <div class="navrow"><span></span><button class="btn" data-nx>${k<qs.length-1&&!(opt.lives&&lives<=0)?'Next →':'Finish'}</button></div>`;
      $('[data-nx]',mount).onclick=()=>{ if(opt.lives&&lives<=0) return done(score,qs.length,xp,true); k++; if(k<qs.length) draw(); else done(score,qs.length,xp,false); };
      $('[data-nx]',mount).scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  }
  draw();
}

        ${p.ex?`<div class="pstep"><div class="pk">🔎 Examples</div>${p.ex.map(e=>`<div class="ex"><div><span>Input</span><code>${esc(e[0])}</code></div><div><span>Output</span><code>${esc(e[1])}</code></div>${e[2]?`<div class="why">${e[2]}</div>`:''}</div>`).join('')}</div>`:''}
        ${p.ask?`<div class="pstep"><div class="pk">🤔 What is it really asking?</div><div>${p.ask}</div></div>`:''}
        ${p.brute?`<div class="pstep brute"><div class="pk">🐢 Brute force (the obvious way)</div><div>${p.brute[0]}</div><div class="cx">⏱ ${p.brute[1]||''}</div></div>`:''}
        <div class="pstep smart"><div class="pk">💡 The smart way</div><div>${p.idea}</div>${p.steps?`<ol class="steps">${p.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}</div>
        ${p.trace?`<div class="pk" style="margin:14px 0 6px">🎬 Watch it run</div><div data-tr="${pi}"></div>`:''}
        <details class="rev"><summary>🧠 Tried it? Reveal the Python solution</summary>${codeBlock(p.code)}<div class="cx">⏱ ${p.cx||''}</div></details></div>`).join('')+nav();
      l.probs.forEach((p,pi)=>{ if(p.trace) players.push(Player($(`[data-tr="${pi}"]`,pn),Object.assign({type:'arr',title:'Trace: '+p.n},p.trace),{autoplay:false})); });
    }
    else if(k==='play'){ runPlay(pn); return; }
    bindNav();
  }
  function runPlay(pn){
    const seq=[]; if(l.quiz) seq.push('quiz'); if(l.order) seq.push('order'); if(l.match) seq.push('match');
    let qs={s:0,n:0}; let ix=0;
    const next=()=>{ if(ix>=seq.length) return finish(); const g=seq[ix++];
      if(g==='quiz') quizGame(pn,l.quiz,(s,n)=>{qs={s,n};next()});
      else if(g==='order') orderGame(pn,l.order,next);
      else matchGame(pn,l.match,next); };
    function finish(){
      const ratio=qs.n?qs.s/qs.n:1; const stars=ratio>=.99?3:ratio>=.6?2:1;
      const first=!S.done[l.id]; S.done[l.id]=Math.max(S.done[l.id]||0,stars); gainXP(first?25:10); save(); confetti(stars*30);
      const nx=LESSONS[LESSONS.indexOf(l)+1];
      pn.innerHTML=`<div class="done-scr card"><div class="big">${stars===3?'🏆':stars===2?'🎉':'💪'}</div><h2 style="margin:6px 0">Lesson complete!</h2>
       <div class="stars">${'⭐'.repeat(stars)}<span style="opacity:.2">${'⭐'.repeat(3-stars)}</span></div>
       <p class="sub">Quiz: ${qs.s}/${qs.n} correct · +${S.xp-earned} XP this lesson${first?' (incl. +25 first-clear bonus)':''}</p>
       <div class="row" style="justify-content:center">${nx?`<button class="btn" data-nl>Next: ${nx.em} ${esc(nx.t)} →</button>`:''}<button class="btn ghost" data-rp>↺ Replay games</button><button class="btn ghost" data-mp>🏠 Map</button></div></div>`;
      const b=$('[data-nl]',pn); if(b) b.onclick=()=>go('l-'+nx.id); $('[data-rp]',pn).onclick=()=>{ix=0;next()}; $('[data-mp]',pn).onclick=()=>go('');
    }
    next();
  }
  show(0);
}

/* ---------- boss ---------- */
function bossView(key){
  let pool=[], title='';
  if(key==='cards'){
    const cards=LESSONS.flatMap(l=>(l.cards||[]).map(c=>c));
    root.innerHTML=`<div class="wrap pane"><div class="crumbs"><a data-home>🏠 Map</a> › Flashcard sprint</div><div class="h1">🃏 Flashcard sprint</div><p class="sub">Every interview card across the track, shuffled. Say each answer out loud before flipping.</p>${flashcards(shuffle(cards).slice(0,24))}
      <div class="navrow"><button class="btn ghost" data-home2>← Map</button><button class="btn" data-dn>Mark sprint done ✓</button></div></div>`;
    $('[data-home]').onclick=$('[data-home2]').onclick=()=>go('');
    $('[data-dn]').onclick=ev=>{if(!S.boss.cards){S.boss.cards=1;gainXP(30,ev);confetti()} save(); go('');};
    return;
  }
  if(key==='all'){ pool=LESSONS.flatMap(l=>l.quiz||[]); title='Final boss: everything'; }
  else { const s=A.segments[+key]; if(!s) return go(''); pool=s.lessons.flatMap(l=>l.quiz||[]); title='Boss: '+s.name; }
  const qs=shuffle(pool).slice(0,12);
  root.innerHTML=`<div class="wrap"><div class="crumbs"><a data-home>🏠 Map</a> › ${esc(title)}</div><div class="h1">👾 ${esc(title)}</div><p class="sub">12 random questions · 3 lives · 3 in a row = double XP</p><div data-g></div></div>`;
  $('[data-home]').onclick=()=>go('');
  quizGame($('[data-g]'),qs,(s,n,xp,dead)=>{
    const win=!dead&&s/n>=.7; if(win){S.boss[key]=Math.max(S.boss[key]||0,s); gainXP(40); confetti(120);} save();
    $('[data-g]').innerHTML=`<div class="done-scr card"><div class="big">${win?'🏆':dead?'💀':'😤'}</div><h2>${win?'Boss defeated!':dead?'Out of lives':'So close!'}</h2><p class="sub">${s}/${n} correct${win?' · +40 XP bonus':' · need 70% to win'}</p>
     <div class="row" style="justify-content:center"><button class="btn" data-rt>↺ Fight again</button><button class="btn ghost" data-mp>🏠 Map</button></div></div>`;
    $('[data-rt]').onclick=()=>route(); $('[data-mp]').onclick=()=>go('');
  },{lives:3,combo:true,title:'Boss'});
}

renderTop(); route();
})();
</script></body></html>
