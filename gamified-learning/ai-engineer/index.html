<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Engineer Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0b1020; --bg2:#121a33; --card:#162042; --card2:#1c2852; --line:#2a3768;
  --tx:#e8ecff; --mut:#9aa6d1; --dim:#6b77a6;
  --acc:#8b5cf6; --acc2:#22d3ee; --ok:#22c55e; --bad:#ef4444; --warn:#f59e0b; --gold:#fbbf24;
  --r:16px; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Space Grotesk','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.55}
body{background:radial-gradient(1200px 600px at 10% -10%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 60%),radial-gradient(900px 500px at 110% 10%,color-mix(in srgb,var(--acc2) 14%,transparent),transparent 60%),var(--bg);min-height:100vh}
button{font-family:inherit;cursor:pointer}
a{color:var(--acc2)}
code{font-family:var(--mono);font-size:.88em;background:#0d1430;border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:#c4d0ff}
b,strong{color:#fff}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px 80px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .in{max-width:1040px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem;cursor:pointer;user-select:none}
.brand .logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));font-size:18px;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 45%,transparent)}
.stats{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}
.pill.timer{cursor:pointer}
.pill.timer.run{border-color:var(--acc2);color:var(--acc2)}
.lvlbar{width:70px;height:6px;background:#0d1430;border-radius:9px;overflow:hidden}
.lvlbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .6s}

/* cards / generic */
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px}
.h1{font-size:clamp(1.6rem,3.6vw,2.4rem);font-weight:700;line-height:1.15;margin:26px 0 6px;letter-spacing:-.01em}
.sub{color:var(--mut);margin:0 0 18px}
.sec-t{font-size:1.15rem;font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:.98rem;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 60%,var(--acc2)));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent);transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line);color:var(--tx)}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:999px;background:color-mix(in srgb,var(--acc) 22%,transparent);color:color-mix(in srgb,var(--acc) 40%,#fff);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}
.tag.e{background:#14532d55;color:#86efac;border-color:#22c55e55}
.tag.m{background:#78350f55;color:#fcd34d;border-color:#f59e0b55}
.tag.h{background:#7f1d1d55;color:#fca5a5;border-color:#ef444455}

/* home: mission */
.mission{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
@media(max-width:760px){.mission{grid-template-columns:1fr}}
.mission .big{position:relative;overflow:hidden}
.mission .big:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 40%,transparent),transparent 70%)}
.kick{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--acc2)}
.mtitle{font-size:1.5rem;font-weight:700;margin:6px 0 4px}
.blocks{display:flex;gap:8px;margin:14px 0}
.blocks span{pointer-events:none;flex:1;font-size:.78rem;text-align:center;padding:8px 4px;border-radius:10px;background:#0d1430;border:1px solid var(--line);color:var(--mut)}
.blocks span.on{border-color:var(--acc);color:#fff;background:color-mix(in srgb,var(--acc) 18%,#0d1430)}
.weekdots{display:flex;gap:6px;margin-top:10px}
.weekdots i{width:28px;height:28px;border-radius:8px;background:#0d1430;border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:.7rem;color:var(--dim)}
.weekdots i.on{background:linear-gradient(135deg,var(--warn),#f97316);color:#fff;border-color:transparent}

/* path map */
.seg{margin:26px 0 8px}
.seg-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.seg-h h3{margin:0;font-size:1.05rem}
.seg-h .c{color:var(--dim);font-size:.85rem}
.path{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.node{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 14px 12px;color:var(--tx);transition:transform .15s,border-color .15s,box-shadow .15s}
.node:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 10px 26px color-mix(in srgb,var(--acc) 22%,transparent)}
.node .em{font-size:1.6rem;line-height:1}
.node .n{font-size:.72rem;color:var(--dim);font-weight:700;letter-spacing:.06em}
.node .tt{font-weight:700;margin:6px 0 2px;font-size:.98rem;line-height:1.25}
.node .ds{font-size:.8rem;color:var(--mut);line-height:1.35}
.node .st{position:absolute;top:12px;right:12px;font-size:.85rem;letter-spacing:1px}
.node.done{border-color:color-mix(in srgb,var(--ok) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 10%,var(--card)),var(--card))}
.node.next{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 40%,transparent),0 0 30px color-mix(in srgb,var(--acc) 30%,transparent);animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent),0 0 40px color-mix(in srgb,var(--acc) 35%,transparent)}}

/* lesson */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;color:var(--mut);font-size:.9rem;margin-top:18px}
.crumbs a{cursor:pointer;color:var(--mut);text-decoration:none}
.crumbs a:hover{color:#fff}
.stepper{display:flex;gap:6px;margin:16px 0 18px;overflow-x:auto;padding-bottom:4px}
.stepper button{flex:1;min-width:92px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:9px 8px;font-weight:700;font-size:.85rem;white-space:nowrap}
.stepper button.on{background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 55%,var(--acc2)));color:#fff;border-color:transparent}
.stepper button.ok{color:#86efac;border-color:#22c55e66}
.pane{animation:fadeup .35s ease}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}

/* stage (animation) */
.stage{background:radial-gradient(800px 300px at 50% 0%,color-mix(in srgb,var(--acc) 12%,transparent),transparent 70%),#0a0f22;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage-h{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--mut);gap:10px}
.stage-h b{color:#fff;font-size:.92rem}
.stage svg{display:block;width:100%;height:auto}
[data-vis]{overflow-x:auto}
@media(max-width:700px){.stage svg{min-width:640px}}
.cap{min-height:84px;padding:14px 18px;border-top:1px solid var(--line);background:#0c1228;font-size:1rem}
.cap .k{font-size:.72rem;font-weight:700;color:var(--acc2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.cap .tx{animation:fadeup .35s ease}
.ctrls{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.ctrls .dots{display:flex;gap:5px;flex:1;flex-wrap:wrap;justify-content:center}
.ctrls .dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer;transition:all .2s}
.ctrls .dots i.on{background:var(--acc2);transform:scale(1.35)}
.ctrls .dots i.seen{background:color-mix(in srgb,var(--acc) 70%,var(--line))}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:#fff;font-size:1rem;display:grid;place-items:center}
.ib:hover{border-color:var(--acc)}
.spd{font-size:.78rem;color:var(--mut);border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 8px}

/* flow svg */
.fn rect{fill:#141d3d;stroke:#34437c;stroke-width:1.5;transition:all .35s}
.fn text{fill:#cdd6ff;font-family:var(--sans);font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.fn text.s{font-size:11px;fill:#8d99c8;font-weight:500}
.fn{transition:opacity .4s,transform .4s;transform-box:fill-box;transform-origin:center}
.fn.hid{opacity:0;transform:scale(.6)}
.fn.on rect{fill:color-mix(in srgb,var(--acc) 35%,#141d3d);stroke:var(--acc2);stroke-width:2.5;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--acc2) 70%,transparent))}
.fn.on text{fill:#fff}
.fn.c-g rect{stroke:#22c55e}.fn.c-r rect{stroke:#ef4444}.fn.c-y rect{stroke:#f59e0b}.fn.c-p rect{stroke:#a78bfa}.fn.c-b rect{stroke:#38bdf8}
.fn.c-g.on rect{fill:#14532d;stroke:#4ade80}.fn.c-r.on rect{fill:#7f1d1d;stroke:#f87171}.fn.c-y.on rect{fill:#78350f;stroke:#fbbf24}
.fn.okk rect{fill:#14532d;stroke:#4ade80;filter:drop-shadow(0 0 10px #22c55e99)}
.fn.badd rect{fill:#7f1d1d;stroke:#f87171;filter:drop-shadow(0 0 10px #ef444499)}
.fe{stroke:#3a4a85;stroke-width:2;fill:none;transition:all .35s}
.fe.on{stroke:var(--acc2);stroke-width:3}
.fe.dash{stroke-dasharray:6 5}
.fel{fill:#8d99c8;font-size:11px;font-family:var(--sans);text-anchor:middle}
.fe-g{transition:opacity .4s}
.fe-g.hid{opacity:0}
.pk{fill:var(--gold);filter:drop-shadow(0 0 6px var(--gold))}
.zone rect{fill:none;stroke:#2c3a72;stroke-dasharray:5 6;stroke-width:1.5}
.zone text{fill:#6b77a6;font-size:11px;font-family:var(--sans);font-weight:700;letter-spacing:.08em}

/* array tracer */
.arr{padding:26px 14px 18px;overflow-x:auto}
.arr-row{display:flex;gap:6px;justify-content:center;min-width:max-content;margin:0 auto}
.cell{position:relative;min-width:50px;height:52px;padding:0 8px;border-radius:10px;background:#141d3d;border:2px solid #34437c;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1.05rem;color:#dbe3ff;transition:all .35s}
.cell .ix{position:absolute;top:-19px;font-size:.66rem;color:var(--dim);font-weight:500}
.cell.hl{background:#78350f;border-color:#fbbf24;color:#fff;transform:translateY(-4px)}
.cell.ok{background:#14532d;border-color:#4ade80;color:#fff}
.cell.bad{background:#7f1d1d;border-color:#f87171;color:#fff}
.cell.dim{opacity:.3}
.cell.win{background:color-mix(in srgb,var(--acc) 30%,#141d3d);border-color:var(--acc)}
.cell.hl.win{background:#78350f}
.cell.emp{background:transparent;border-style:dashed;color:var(--dim)}
.ptrs{display:flex;gap:6px;justify-content:center;min-width:max-content;margin:6px auto 0}
.ptrs div{min-width:50px;padding:0 8px;text-align:center;font-family:var(--mono);font-size:.72rem;font-weight:700;color:var(--acc2);line-height:1.25;min-height:16px;visibility:hidden}
.grid-arr .arr-row{margin-bottom:6px}
.grid-arr .cell{min-width:44px;height:44px;font-size:.92rem}
.vars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.vars span{font-family:var(--mono);font-size:.85rem;background:#0d1430;border:1px solid var(--line);border-radius:8px;padding:4px 10px;color:#c4d0ff}
.vars span b{color:var(--gold)}
.lbl-row{text-align:center;font-size:.75rem;color:var(--dim);margin:14px 0 22px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}

/* learn */
.learn{display:grid;gap:14px}
.lc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.lc h4{margin:0 0 8px;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.lc p{margin:6px 0;color:#d3daf7}
.lc ul{margin:6px 0;padding-left:20px;color:#d3daf7}
.lc li{margin:4px 0}
.say{border-left:4px solid var(--gold);background:linear-gradient(90deg,#fbbf2412,transparent);border-radius:0 14px 14px 0;padding:14px 18px}
.say h4{color:var(--gold)}
.analogy{border-left:4px solid var(--acc2);background:linear-gradient(90deg,color-mix(in srgb,var(--acc2) 10%,transparent),transparent)}
.pitfall{border-left:4px solid var(--bad);background:linear-gradient(90deg,#ef444410,transparent)}

/* compare table */
.tblw{overflow-x:auto;border-radius:14px;border:1px solid var(--line);margin-bottom:16px}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;font-size:.92rem}
table.cmp th{background:color-mix(in srgb,var(--acc) 20%,var(--card));text-align:left;padding:11px 14px;font-size:.85rem}
table.cmp td{padding:10px 14px;border-top:1px solid var(--line);vertical-align:top;color:#d3daf7}
table.cmp td:first-child{font-weight:700;color:#fff;white-space:nowrap}
table.cmp tr:hover td{background:#ffffff06}
.cmp-t{font-weight:700;margin:6px 0 8px;color:var(--mut);font-size:.9rem}

/* quiz */
.qbox{max-width:760px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.85rem;margin-bottom:10px}
.qprog{height:8px;background:#0d1430;border-radius:9px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.qq{font-size:1.2rem;font-weight:700;margin:0 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:13px 16px;font-size:1rem;display:flex;gap:12px;align-items:flex-start;transition:all .15s}
.opt:hover{border-color:var(--acc)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:#0d1430;display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--mut)}
.opt.ok{border-color:var(--ok);background:#14532d66}
.opt.bad{border-color:var(--bad);background:#7f1d1d66;animation:shake .4s}
.opt.off{opacity:.55;pointer-events:none}
.expl{margin-top:14px;padding:14px 16px;border-radius:12px;background:#0d1430;border:1px solid var(--line);animation:fadeup .3s}
.expl.g{border-color:#22c55e66}.expl.r{border-color:#ef444466}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hearts{letter-spacing:2px}
.combo{color:var(--gold);font-weight:700}

/* order game */
.slots{display:grid;gap:8px;margin:14px 0}
.slot{min-height:46px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:8px 14px;color:var(--dim)}
.slot.f{border-style:solid;border-color:var(--ok);color:#fff;background:#14532d44;animation:fadeup .3s}
.slot .n{font-weight:700;color:var(--acc2);width:22px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card2);color:var(--tx);border-radius:12px;padding:9px 14px;font-size:.95rem;text-align:left}
.chip:hover{border-color:var(--acc)}
.chip.bad{border-color:var(--bad);animation:shake .4s}
.chip.used{display:none}
/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:8px;align-content:start}
.mi{border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 13px;font-size:.92rem;text-align:left;transition:all .15s}
.mi.sel{border-color:var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,var(--card))}
.mi.done{border-color:var(--ok);background:#14532d55;opacity:.7;pointer-events:none}
.mi.bad{border-color:var(--bad);animation:shake .4s}

/* code */
.code{position:relative;background:#070b1a;border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:.85rem;line-height:1.6;color:#d6deff}
.code .cp{position:absolute;top:8px;right:8px}
.kw{color:#c792ea}.st{color:#c3e88d}.cm{color:#6b77a6;font-style:italic}.nu{color:#f78c6c}.fnn{color:#82aaff}.bi{color:#ffcb6b}
.prob{margin-bottom:18px}
.prob-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.prob-h h4{margin:0;font-size:1.08rem}
.cx{font-family:var(--mono);font-size:.8rem;color:var(--mut)}
details.rev{margin-top:8px}
details.rev summary{cursor:pointer;font-weight:700;color:var(--acc2);padding:6px 0}

/* done */
.done-scr{text-align:center;padding:40px 20px}
.done-scr .big{font-size:4rem;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.stars{font-size:2.2rem;letter-spacing:6px;margin:8px 0}
.xpfly{position:fixed;z-index:99;font-weight:800;color:var(--gold);font-size:1.2rem;pointer-events:none;animation:fly 1s ease-out forwards;text-shadow:0 2px 10px #000}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.conf{position:fixed;top:-10px;width:9px;height:14px;z-index:98;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* plan table */
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pday{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:.82rem;cursor:pointer}
.pday:hover{border-color:var(--acc)}
.pday .d{font-weight:700;color:var(--acc2);font-size:.75rem;letter-spacing:.06em}
.pday .t{color:#dfe5ff;margin-top:2px;line-height:1.3}
.pday.ok{border-color:#22c55e77}
.pday.boss{background:linear-gradient(135deg,#7f1d1d55,var(--card))}

/* flashcards */
.flip{perspective:1000px;cursor:pointer;min-height:180px}
.flip .in{position:relative;width:100%;min-height:180px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line)}
.flip .fa{background:linear-gradient(135deg,var(--card2),var(--card));font-weight:700;font-size:1.1rem}
.flip .fb{background:linear-gradient(135deg,#123,#0d1430);transform:rotateY(180deg);font-size:.95rem;color:#d3daf7;overflow:auto}
.hint{color:var(--dim);font-size:.8rem;margin-top:8px}

.modal{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:20px;animation:fadeup .2s}
.modal .card{max-width:440px;width:100%}
.foot{color:var(--dim);font-size:.8rem;text-align:center;margin-top:50px}
@media(max-width:600px){
  .top .in{padding:8px 12px}.brand span.nm,.pill .nm{display:none}.pill{padding:4px 9px;font-size:.8rem}.lvlbar{display:none}
  .match{grid-template-columns:1fr 1fr}.mi{font-size:.82rem;padding:9px}

/* ---------------- TOKENS ---------------- */
{id:'tokens',em:'🔤',t:'Tokens & Tokenization',mins:15,d:`How text becomes numbers, why "1 token ≈ ¾ word", and why tokens decide cost, latency and limits.`,
anim:[{type:'arr',title:'Text → Tokens → IDs',frames:[
 {rows:[{lab:'Raw text',a:['"I love unbelievable tokenizers!"'],noix:1}],t:`An LLM never sees letters or words. A <b>tokenizer</b> first chops the text into pieces called <b>tokens</b>.`},
 {rows:[{lab:'Raw text',a:['"I love unbelievable tokenizers!"'],noix:1},{lab:'Tokens (BPE)',a:['I',' love',' un','believ','able',' token','izers','!'],hl:'2 3 4'}],t:`Common words stay whole (<code> love</code>). Rarer words split into frequent sub-pieces: <code> un</code> + <code>believ</code> + <code>able</code>. The leading space is <i>part of</i> the token.`},
 {rows:[{lab:'Tokens',a:['I',' love',' un','believ','able',' token','izers','!']},{lab:'Token IDs (illustrative)',a:[40,3021,653,32927,481,4037,12509,0],hl:'0 1 2 3 4 5 6 7'}],t:`Each token maps to an integer ID in a fixed <b>vocabulary</b> (roughly 32k–200k entries). These integers are all the model ever sees.`},

 {rows:[{lab:'Tokens',a:['I',' love',' un','believ','able',' token','izers','!']}],v:{'tokens':8,'words':4,'rule of thumb':'1 token ≈ 4 chars ≈ 0.75 words'},t:`Rule of thumb for English: <b>1 token ≈ 4 characters ≈ ¾ of a word</b>, so 1,000 tokens is about 750 words. Code and non-English text usually take <i>more</i> tokens per word.`}
]},
{type:'flow',title:'Context window & cost',h:380,nodes:[

 ['win','Context window',380,180,'input + output ≤ limit','p'],['llm','LLM',580,180],['out','Output tokens',700,300,'billed higher','y']],
 edges:[['sys','win'],['hist','win'],['docs','win'],['user','win'],['win','llm','prefill'],['llm','out','decode']],
 steps:[
 {on:'sys hist docs user',t:`Everything you send is tokens: system prompt, chat history, retrieved chunks and the question.`},
 {on:'win',go:'sys>win hist>win docs>win user>win',t:`All of it must fit in the <b>context window</b>, the maximum number of tokens per request (input + output).`},
 {on:'llm',go:'win>llm',t:`<b>Prefill:</b> the model reads all input tokens in parallel. This sets the time to first token.`},
 {on:'out',go:'llm>out',t:`<b>Decode:</b> output is generated <i>one token at a time</i>. That's why streaming works, and why long answers take longer.`},

 {on:'win out',lbl:{hist:'Chat history'},t:`<b>Cost = input tokens × input price + output tokens × output price.</b> Output tokens usually cost several times more, so keep answers tight.`}

learn:[
 {h:'What a token is',b:`<p>A token is a chunk of text from the model's fixed vocabulary: a whole word, part of a word, a space plus a word, punctuation or bytes. The model predicts the <b>next token</b>, never the next word.</p>`},
 {h:'How BPE (Byte-Pair Encoding) builds the vocabulary',b:`<ul><li>Start with single bytes or characters as the vocabulary.</li><li>Count every adjacent pair in a huge corpus and <b>merge the most frequent pair</b> into a new token (e.g. <code>t</code>+<code>h</code> → <code>th</code>).</li><li>Repeat until the vocabulary reaches its target size.</li><li>Result: common words become one token, rare words become several, and nothing is ever "unknown".</li></ul>`},
 {h:'Why interviewers care',b:`<ul><li><b>Cost & latency</b> scale with tokens, especially output tokens.</li><li><b>Context limits</b> are measured in tokens, which drives chunk size in RAG and history trimming.</li><li><b>Quirks:</b> letter counting ("how many r's in strawberry") and arithmetic are hard because the model sees chunks, not characters.</li><li><b>Languages:</b> Hindi, Tamil and many other languages can take 2–4× more tokens than English for the same meaning, so they cost more and fill the window faster.</li></ul>`},
 {h:'Special tokens & chat templates',b:`<p>Models use reserved tokens to mark structure: beginning and end of text, and role markers for <code>system</code> / <code>user</code> / <code>assistant</code>. The chat API wraps your messages in this template for you. Generation stops at an <b>end-of-sequence (EOS)</b> token or at <code>max_tokens</code>.</p>`},
 {k:'analogy',h:'Analogy',b:`<p>Think LEGO: the tokenizer has a fixed box of bricks. Common shapes come pre-built ("the", " love"); unusual shapes get built from smaller bricks. The model only ever plays with brick numbers.</p>`},
 {k:'pitfall',h:'Common mistakes',b:`<ul><li>Assuming word count = token count.</li><li>Comparing token counts across vendors. Each model family has its <b>own tokenizer</b>, so the same text gives different counts.</li><li>Forgetting that output tokens count against the context window too.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"LLMs operate on subword tokens produced by a tokenizer like BPE. Each token maps to an ID, then to an embedding vector. Tokens drive cost, latency and context limits. In RAG that's why I size chunks in tokens and budget the window: system prompt, retrieved context, history, and headroom for the answer."</p>`}
],
cmp:[{t:'Tokenization strategies',cols:['Strategy','Unit','Vocab size','Pros','Cons'],rows:[

]}],

 {q:`Why do LLMs struggle to count the letters in "strawberry"?`,o:['They have no memory','They see subword tokens, not characters','Temperature is too high','The context window is too small'],a:1,x:`The word arrives as 1–3 tokens, so individual letters aren't directly visible.`},
 {q:`What does BPE repeatedly merge while building its vocabulary?`,o:['The rarest characters','The most frequent adjacent pair','Whole sentences','Random pairs'],a:1,x:`BPE greedily merges the most frequent adjacent symbol pair until it hits the target vocab size.`},
 {q:`Which usually costs more per token?`,o:['Input tokens','Output tokens','Both cost the same','System prompt tokens'],a:1,x:`Output (generated) tokens are typically priced several times higher than input tokens.`},
 {q:`Your chatbot fails on long conversations. Best first fix?`,o:['Raise temperature','Trim or summarize history to fit the token budget','Switch to character tokenization','Remove the system prompt'],a:1,x:`History is eating the context window, so budget it with sliding windows, summaries or retrieval.`}
],

match:{q:`Match the term to its meaning`,pairs:[['Vocabulary','Fixed set of all known tokens'],['Context window','Max tokens per request (in + out)'],['EOS token','Signals the model to stop'],['Prefill','Processing all input tokens in parallel']]},

/* ---------------- EMBEDDINGS ---------------- */
{id:'embeddings',em:'🧭',t:'Embeddings & Similarity',mins:15,d:`Meaning as coordinates: how vectors power semantic search, and cosine vs dot vs euclidean.`,
anim:[{type:'flow',title:'Meaning becomes geometry',h:400,nodes:[
 ['king','king',150,80,'','p'],['queen','queen',290,80,'','p'],['man','man',150,170],['woman','woman',290,170],
 ['dog','dog',560,90,'','b'],['puppy','puppy',680,140,'','b',3],['cat','cat',560,190,'','b'],
 ['car','car',520,330,'','y'],['truck','truck',660,330,'','y']],
 edges:[{f:'king',t:'queen',l:'+female',at:4,dash:1},{f:'man',t:'woman',l:'+female',at:4,dash:1},{f:'puppy',t:'dog',l:'cos 0.91',at:3}],
 zones:[{x:60,y:30,w:330,h:190,l:'ROYALTY / PEOPLE'},{x:470,y:40,w:300,h:200,l:'ANIMALS'},{x:440,y:280,w:310,h:100,l:'VEHICLES'}],
 steps:[
 {t:`An <b>embedding model</b> turns text into a vector, a list of e.g. 768–3072 numbers. Here we squash it to 2D so you can see it.`},
 {on:'dog cat',t:`Texts with similar <b>meaning</b> land close together. "dog" and "cat" share an animals neighbourhood…`},
 {on:'car truck',t:`…while "car" and "truck" sit far away in a vehicles region. Distance = semantic difference.`},
 {on:'puppy dog',go:'puppy>dog',t:`A new query, "puppy", gets embedded too. The nearest stored vector is "dog" (cosine 0.91). That lookup <b>is</b> semantic search.`},
 {on:'king queen man woman',t:`Directions carry meaning: king − man + woman ≈ queen. The same "+female" offset appears in both pairs.`},
 {on:'puppy',t:`In RAG you embed every chunk once, store the vectors, then embed each question and fetch its nearest neighbours.`}
]},
{type:'arr',title:'Cosine similarity, step by step',frames:[
 {rows:[{lab:'Vector A ("dog")',a:[0.9,0.1,0.4]},{lab:'Vector B ("puppy")',a:[0.8,0.2,0.5]}],t:`Two embeddings (tiny 3-dimensional ones for the demo).`},
 {rows:[{lab:'A × B (element-wise)',a:[0.72,0.02,0.20],hl:'0 1 2'}],v:{'A·B (dot)':0.94},t:`<b>Dot product:</b> multiply matching positions and add them up: 0.72 + 0.02 + 0.20 = 0.94.`},
 {rows:[{lab:'Vector A',a:[0.9,0.1,0.4]},{lab:'Vector B',a:[0.8,0.2,0.5]}],v:{'|A|':0.99,'|B|':0.96},t:`<b>Magnitudes:</b> |A| = √(0.81+0.01+0.16) ≈ 0.99, |B| = √(0.64+0.04+0.25) ≈ 0.96.`},
 {rows:[{lab:'Result',a:['cos = 0.94 / (0.99 × 0.96) ≈ 0.99'],ok:'0',noix:1}],v:{range:'-1 … 1','1':'same direction'},t:`<b>Cosine = dot / (|A|·|B|) ≈ 0.99</b>, so the two are nearly identical in meaning. Cosine compares <i>direction</i> and ignores length.`},
 {rows:[{lab:'Normalized vectors',a:['|A| = 1','|B| = 1'],noix:1}],t:`Many embedding models output <b>unit-length</b> vectors. Then cosine equals the dot product, which is cheaper, so vector DBs often just use the dot product.`}
]}],
learn:[
 {h:'What an embedding is',b:`<p>A dense vector that captures meaning. Models like OpenAI <code>text-embedding-3</code>, Cohere Embed, BGE, E5 or Sentence-Transformers are trained so that texts with similar meaning get similar vectors.</p>`},
 {h:'Where you use them',b:`<ul><li><b>Semantic search / RAG retrieval:</b> nearest neighbours to the query vector.</li><li><b>Clustering & dedup:</b> group similar tickets and logs.</li><li><b>Classification:</b> train a cheap classifier on embeddings.</li><li><b>Semantic cache:</b> reuse an answer if a new question is close enough to an old one.</li><li><b>Recommendations / anomaly detection.</b></li></ul>`},
 {h:'Choosing an embedding model',b:`<ul><li><b>Dimensions:</b> more dims can capture more nuance but cost more storage and search time. Some models (Matryoshka) let you truncate dimensions.</li><li><b>Domain fit:</b> check retrieval benchmarks (e.g. the MTEB leaderboard), then test on <i>your</i> data.</li><li><b>Max input tokens:</b> limits chunk size.</li><li><b>Golden rule:</b> query and documents must use the <b>same</b> model. If you change the model you must re-embed everything.</li></ul>`},
 {k:'analogy',h:'Analogy',b:`<p>A giant library where books are shelved by <i>meaning</i>, not title. To find answers you walk to where your question would be shelved and grab the nearby books.</p>`},
 {k:'pitfall',h:'Common mistakes',b:`<ul><li>Mixing embedding models between indexing and querying.</li><li>Expecting embeddings to match exact IDs or error codes. Dense vectors blur exact tokens, so use <b>hybrid search</b> with BM25.</li><li>Embedding chunks that are too long, which averages away the meaning.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"Embeddings map text to vectors where semantic similarity becomes geometric closeness, usually measured with cosine. In RAG I embed chunks offline into a vector index, embed the query at runtime and do approximate nearest-neighbour search. Because dense retrieval misses exact keywords like error codes, I pair it with BM25 in a hybrid setup."</p>`}
],
cmp:[{t:'Similarity metrics',cols:['Metric','Formula idea','Range','Use when'],rows:[
 ['Cosine','angle between vectors','-1 to 1','default for text; ignores length'],
 ['Dot product','sum of products','unbounded','vectors already normalized (then = cosine), fastest'],
 ['Euclidean (L2)','straight-line distance','0 to ∞','some image / older models; magnitude matters'],
]},{t:'Sparse vs dense',cols:['','Sparse (BM25 / TF-IDF)','Dense (embeddings)'],rows:[
 ['Captures','exact keywords','meaning / synonyms'],['"reset pwd" ↔ "change password"','❌ miss','✅ match'],['Error code "E-4012"','✅ exact hit','⚠️ often fuzzy'],['Cost','cheap, no GPU','needs embedding model']]}],
quiz:[
 {q:`Cosine similarity measures…`,o:['Vector length','The angle (direction) between vectors','Number of shared words','Token count'],a:1,x:`Cosine ignores magnitude and only compares direction.`},
 {q:`You switch to a new embedding model. What must you do?`,o:['Nothing','Re-embed all stored documents','Only re-embed new queries','Raise top-k'],a:1,x:`Vectors from different models live in different spaces, so you can't mix them.`},
 {q:`Users search exact error codes like "E-4012" and dense retrieval misses. Best fix?`,o:['Bigger embedding model','Hybrid search: BM25 + dense','Lower temperature','Larger chunks'],a:1,x:`Sparse keyword search nails exact tokens. Combine it with dense retrieval.`},
 {q:`If all vectors are normalized to length 1, cosine similarity equals…`,o:['Euclidean distance','Dot product','Zero','Jaccard'],a:1,x:`cos = A·B / (|A||B|) = A·B when both lengths are 1.`},
 {q:`Which is NOT a typical use of embeddings?`,o:['Semantic cache','Clustering tickets','Generating the final answer text','RAG retrieval'],a:2,x:`Embeddings represent text. Generation is the LLM's job.`}
],
match:{q:`Match the use case to the technique`,pairs:[['Find docs by meaning','Dense embeddings'],['Find exact SKU / error code','BM25 keyword search'],['Reuse answers to similar questions','Semantic cache'],['Group similar incidents','Clustering on embeddings']]},
cards:[[`Explain embeddings to a non-technical manager.`,`They turn text into coordinates so that things that mean the same thing end up close together. Search then becomes "find the nearest points".`],[`Cosine vs dot product?`,`Cosine measures the angle and ignores length. Dot product includes magnitude. With normalized vectors they're identical, and dot is cheaper.`]]
},

/* ---------------- TRANSFORMERS ---------------- */
{id:'attention',em:'🔦',t:'Transformers & Self-Attention',mins:20,d:`Q, K, V, multi-head attention and the autoregressive loop, explained visually.`,
anim:[{type:'flow',title:'Self-attention: what does "it" refer to?',h:300,nodes:[
 ['t1','The',70,110],['t2','animal',165,110,'','p'],['t3',"didn't",265,110],['t4','cross',355,110],['t5','the',435,110],['t6','street',525,110,'','y'],['t7','because',625,110],['t8','it',725,110,'','b'],
 ['ctx','new vector for "it"',400,230,'≈ 0.7·animal + 0.1·street + …','g',4]],
 edges:[{f:'t8',t:'t2',l:'0.70',at:3,cv:70},{f:'t8',t:'t6',l:'0.10',at:3,cv:40},{f:'t8',t:'ctx',at:4},{f:'t2',t:'ctx',at:4,dash:1}],
 steps:[
 {t:`Sentence: "The animal didn't cross the street because <b>it</b> was tired." To understand "it", the model must look at the other tokens.`},
 {on:'t8',t:`For token "it" the model builds a <b>Query (Q)</b>: "what am I looking for?". Every token also has a <b>Key (K)</b>, "what do I contain?", and a <b>Value (V)</b>, "what do I pass on?"`},
 {on:'t8 t2 t6',t:`Score = Q("it") · K(each token). Softmax turns the scores into weights that sum to 1.`},
 {on:'t2',go:'t8>t2 t8>t6',t:`"animal" gets weight <b>0.70</b> and "street" only 0.10. The model "attends" mostly to animal.`},
 {on:'ctx',go:'t2>ctx t8>ctx',t:`New representation of "it" = weighted sum of all the <b>Values</b>. Now "it" carries the meaning of "animal".`},
 {on:'t1 t2 t3 t4 t5 t6 t7 t8',t:`This happens for <b>every token in parallel</b>, in many "heads" (multi-head: one tracks grammar, one coreference…) and across dozens of layers.`}
]},
{type:'flow',title:'The generation loop',h:400,nodes:[
 ['in','"The sky is"',100,70],['emb','Embeddings + positions',125,170],['blk','Transformer blocks ×N',352,170,'attention → feed-forward','p'],
 ['sm','Softmax over vocab',560,170],['pick','Sample: " blue"',700,280,'','y'],['app','Append & repeat',352,320,'"The sky is blue"','g']],
 edges:[['in','emb'],['emb','blk'],['blk','sm'],['sm','pick'],['pick','app'],{f:'app',t:'blk',l:'loop',dash:1}],
 steps:[
 {on:'in',t:`Input tokens: "The sky is".`},
 {on:'emb',go:'in>emb',t:`Each token becomes an embedding plus <b>positional information</b>, because attention alone doesn't know word order.`},
 {on:'blk',go:'emb>blk',t:`It flows through N stacked blocks, each one <b>self-attention</b> (mix information across tokens) then a <b>feed-forward network</b> (process each token).`},
 {on:'sm',go:'blk>sm',t:`The last position's vector is projected onto the whole vocabulary, and <b>softmax</b> gives a probability for every possible next token.`},
 {on:'pick',go:'sm>pick',t:`One token is <b>sampled</b> (temperature, top-p…). Here: " blue".`},
 {on:'app',go:'pick>app app>blk',t:`It's appended and the loop repeats: <b>autoregressive</b> generation, one token per step until EOS or max_tokens. The <b>KV cache</b> stores past keys and values so old tokens aren't recomputed.`}
]}],
learn:[
 {h:'Why transformers won',b:`<p>RNNs read text one word at a time, which is slow and forgets long-range context. Transformers use <b>self-attention</b> so every token can look at every other token <b>in parallel</b>. That made training on massive GPU clusters practical.</p>`},
 {h:'Q, K, V in one breath',b:`<p>Each token's vector is multiplied by three learned matrices to get Q, K and V. Attention = softmax(QKᵀ / √d) · V. The √d scaling keeps the softmax from saturating. A <b>causal mask</b> stops a token from looking at future tokens during generation.</p>`},
 {h:'Architectures',b:`<ul><li><b>Decoder-only</b> (GPT, Claude, Llama): next-token generation, the basis of chat LLMs.</li><li><b>Encoder-only</b> (BERT): reads both directions, used for classification, embeddings and rerankers.</li><li><b>Encoder-decoder</b> (T5, original Transformer): translation and summarization.</li></ul>`},
 {h:'Practical consequences',b:`<ul><li>Attention cost grows roughly <b>quadratically</b> with sequence length, which is why long context is expensive.</li><li>The <b>KV cache</b> makes decoding fast but eats GPU memory, and that limits concurrency in serving.</li><li><b>"Lost in the middle":</b> models attend best to the start and end of long contexts, so put key info there.</li></ul>`},
 {k:'analogy',h:'Analogy',b:`<p>A room of people (tokens). Each person shouts a question (Q). Everyone holds up a name tag (K). You listen most to people whose tag matches your question and take their information (V).</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"A decoder-only transformer embeds tokens with positional info and passes them through stacked self-attention and feed-forward layers. Attention lets each token weigh every other token via Q·K similarity and mix their values. Generation is autoregressive with a KV cache, which is why latency splits into prefill and per-token decode."</p>`}
],
cmp:[{t:'Model families',cols:['Type','Sees','Great for','Examples'],rows:[
 ['Decoder-only','left context (causal)','chat, generation, agents','GPT, Claude, Llama, Mistral'],
 ['Encoder-only','both directions','embeddings, classification, rerankers','BERT, RoBERTa, cross-encoders'],
 ['Encoder-decoder','input fully, output causal','translation, summarization','T5, BART']]}],
quiz:[
 {q:`In attention, what is compared against the Query to compute weights?`,o:['Values','Keys','Positions','Logits'],a:1,x:`weights = softmax(Q·Kᵀ/√d). The weights then mix the Values.`},
 {q:`Why do transformers need positional encodings?`,o:['To save memory','Attention by itself has no notion of word order','To tokenize text','For sampling'],a:1,x:`Without positions, "dog bites man" and "man bites dog" look identical to attention.`},
 {q:`What does the KV cache speed up?`,o:['Tokenization','Training',`Decoding: past keys and values aren't recomputed`,'Embedding lookup'],a:2,x:`Each new token reuses cached K/V of previous tokens.`},
 {q:`BERT-style encoders are most often used in RAG as…`,o:['The chat generator','Embedding models and rerankers','Tokenizers','Vector databases'],a:1,x:`Bidirectional encoders are great at representing or scoring text.`},
 {q:`Key facts placed in the middle of a very long prompt are sometimes ignored. This is called…`,o:['Hallucination','Lost in the middle','Overfitting','Prompt injection'],a:1,x:`Models attend most reliably to the beginning and end of long contexts.`}
],
order:{q:`Order one step of generation`,items:['Tokens + positional info','Self-attention mixes context','Feed-forward per token','Softmax over vocabulary','Sample next token & append']},
match:{pairs:[['Query','What this token is looking for'],['Key','What each token offers to match'],['Value','Information that gets mixed in'],['Causal mask','Blocks looking at future tokens']]},
cards:[[`Explain self-attention in 30 seconds.`,`Each token creates a query and compares it with every token's key. Softmax gives weights, and the token's new vector is the weighted sum of the values. That's how context like coreference gets resolved, in parallel across heads and layers.`],[`Why is long context expensive?`,`Attention compares every token with every other token, so compute grows roughly n². The KV cache also grows linearly with length, eating GPU memory.`]]
},

/* ---------------- SAMPLING ---------------- */
{id:'sampling',em:'🎲',t:'Decoding: Temperature, Top-k, Top-p',mins:15,d:`How the next token is chosen, and how to tune for creativity vs determinism.`,
anim:[{type:'arr',title:'Choosing the next token',frames:[
 {rows:[{lab:'Next-token candidates after "The weather today is"',a:['sunny','cloudy','rainy','cold','purple']},{lab:'Probability',a:['0.45','0.25','0.15','0.10','0.05']}],t:`The model outputs a probability for <b>every</b> token in the vocabulary. Here are the top 5.`},
 {rows:[{lab:'Greedy decoding',a:['sunny','cloudy','rainy','cold','purple'],ok:'0',dim:'1 2 3 4'},{lab:'Probability',a:['0.45','0.25','0.15','0.10','0.05']}],t:`<b>Greedy:</b> always pick the highest. Deterministic, but it can be bland or repetitive.`},
 {rows:[{lab:'Temperature 0.2 (sharpen)',a:['sunny','cloudy','rainy','cold','purple'],hl:'0'},{lab:'New probability',a:['0.86','0.11','0.03','0.00','0.00']}],t:`<b>Low temperature</b> divides the logits by a small number, so the distribution gets peakier and the top token dominates. Use it for extraction, code, classification.`},
 {rows:[{lab:'Temperature 1.5 (flatten)',a:['sunny','cloudy','rainy','cold','purple'],hl:'0 1 2 3 4'},{lab:'New probability',a:['0.31','0.24','0.19','0.15','0.11']}],t:`<b>High temperature</b> flattens it: more variety, and more nonsense ("purple" now 11%). Good for brainstorming, risky for facts.`},
 {rows:[{lab:'Top-k = 3',a:['sunny','cloudy','rainy','cold','purple'],ok:'0 1 2',dim:'3 4'},{lab:'Renormalized',a:['0.53','0.29','0.18','—','—']}],t:`<b>Top-k:</b> keep only the k most likely tokens, renormalize, then sample.`},
 {rows:[{lab:'Top-p = 0.85 (nucleus)',a:['sunny','cloudy','rainy','cold','purple'],ok:'0 1 2',dim:'3 4'},{lab:'Cumulative',a:['0.45','0.70','0.85 ✓','0.95','1.00']}],t:`<b>Top-p:</b> keep the smallest set whose cumulative probability reaches p. The set size adapts: small when the model is confident, larger when it's unsure.`}
]}],
learn:[
 {h:'The knobs',b:`<ul><li><b>temperature</b>: 0 ≈ deterministic, 0.7 balanced, above 1 wild.</li><li><b>top_p</b>: nucleus sampling, typically 0.9–1.0.</li><li><b>top_k</b>: hard cap on candidates (not exposed by every API).</li><li><b>max_tokens</b>: output length cap. Also a cost and latency guard.</li><li><b>stop sequences</b>: strings that end generation early.</li><li><b>frequency / presence penalties</b>: discourage repetition.</li></ul>`},
 {h:'Practical defaults',b:`<ul><li>Structured extraction, SQL, tool calls, classification: <b>temperature 0–0.2</b>.</li><li>RAG answers: <b>0–0.3</b> to stay faithful to the context.</li><li>Creative writing and brainstorming: <b>0.7–1.0</b>.</li><li>Usually tune <i>either</i> temperature <i>or</i> top_p, not both aggressively.</li></ul>`},
 {k:'pitfall',h:'Gotcha: temperature 0 ≠ perfectly reproducible',b:`<p>Even at temperature 0, outputs can vary slightly because of GPU floating-point non-determinism and batching. For tests, use evals with tolerance, not exact string matches.</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"The model outputs a distribution over the vocabulary. Temperature rescales it, and top-k or top-p truncate it before sampling. For agents and extraction I run near-zero temperature for consistency. For ideation I raise it. I always set max_tokens and stop sequences for cost control."</p>`}
],
cmp:[{cols:['Method','How it picks','Deterministic?','Best for'],rows:[
 ['Greedy','argmax','yes (mostly)','short factual outputs'],['Temperature','rescales logits','no (unless 0)','global creativity dial'],['Top-k','top k candidates','no','simple cap on weirdness'],['Top-p (nucleus)','smallest set ≥ p mass','no','adaptive, the common default'],['Beam search','tracks several best sequences','yes','translation; rare in chat']]}],
quiz:[
 {q:`An agent emitting JSON tool calls keeps producing invalid JSON. First knob to turn?`,o:['Raise temperature to 1.2','Lower temperature toward 0','Raise top_k','Remove max_tokens'],a:1,x:`Lower randomness means more consistent structure. Also use structured output or JSON mode.`},
 {q:`Top-p = 0.9 means…`,o:['Keep 90% of tokens','Keep the smallest set of tokens whose probabilities sum to ≥ 0.9','Use 90% temperature','Pick a token with p ≥ 0.9'],a:1,x:`Nucleus sampling keeps the cumulative 90% probability mass.`},
 {q:`High temperature makes the distribution…`,o:['Sharper','Flatter','Unchanged','Empty'],a:1,x:`Dividing logits by T > 1 flattens it, which increases randomness.`},
 {q:`Which parameter directly caps cost per response?`,o:['top_p','temperature','max_tokens','presence_penalty'],a:2,x:`max_tokens bounds output length and therefore output cost.`}
],
match:{pairs:[['temperature 0','Extraction / classification'],['temperature 0.9','Brainstorming taglines'],['stop sequence','End output at a marker'],['max_tokens','Cap response length & cost']]},
cards:[[`Temperature vs top-p?`,`Temperature reshapes the whole distribution (sharper or flatter). Top-p truncates it to the smallest set covering p of the probability mass. Tune one primarily.`]]

/* ---------------- PROMPTING ---------------- */
{id:'prompting',em:'✍️',t:'Prompt Engineering',mins:15,d:`System prompts, few-shot, chain-of-thought, structured output and prompt templates.`,
anim:[{type:'flow',title:'Anatomy of a production prompt',h:420,nodes:[
 ['role','1. Role & rules',130,60,'system prompt'],['ctx','2. Context',130,140,'retrieved docs, user data'],['ex','3. Examples',130,220,'few-shot pairs'],['task','4. Task',130,300,'clear instruction'],['fmt','5. Output format',130,380,'JSON schema'],
 ['llm','LLM',450,220,'','p'],['out','{"severity":"P2",…}',660,220,'valid, parseable','g']],
 edges:[['role','llm'],['ctx','llm'],['ex','llm'],['task','llm'],['fmt','llm'],['llm','out']],
 steps:[
 {on:'role',t:`<b>Role & rules</b> (system prompt): who the model is, what it must and mustn't do, tone. Example: "You are an SRE triage assistant. Only use the provided logs."`},
 {on:'ctx',t:`<b>Context:</b> the facts it needs, such as retrieved docs or the ticket. Wrap them in clear delimiters like <code>&lt;logs&gt;…&lt;/logs&gt;</code>.`},
 {on:'ex',t:`<b>Few-shot examples:</b> 2–5 input → output pairs showing exactly what good looks like. This is the strongest lever for format and style.`},
 {on:'task',t:`<b>Task:</b> one clear instruction. Ask for steps or reasoning when the problem is complex (chain-of-thought).`},
 {on:'fmt',t:`<b>Output format:</b> specify a JSON schema, or use the API's <b>structured output / tool calling</b> to enforce it.`},
 {on:'llm out',go:'role>llm ctx>llm ex>llm task>llm fmt>llm llm>out',t:`Result: a predictable, parseable output your code can trust. Version this prompt like code and run evals when you change it.`}
]}],
learn:[
 {h:'Core techniques',b:`<ul><li><b>Zero-shot:</b> just instructions. Fine for easy tasks.</li><li><b>Few-shot:</b> include examples. Big wins on format and edge cases.</li><li><b>Chain-of-Thought (CoT):</b> "think step by step" or reasoning models. Better on multi-step logic, costs more tokens.</li><li><b>Self-consistency:</b> sample several reasoning paths and take a majority vote.</li><li><b>Decomposition / prompt chaining:</b> split a big task into smaller LLM calls.</li><li><b>ReAct:</b> interleave reasoning with tool actions (the agent lesson covers this).</li></ul>`},
 {h:'Production habits',b:`<ul><li>Use <b>delimiters / XML tags</b> to separate instructions from data. This also helps against prompt injection.</li><li>Tell it what to do when it's unsure: "If the answer isn't in the context, say you don't know."</li><li><b>Prompt templates</b> with variables (LangChain <code>ChatPromptTemplate</code>), stored and <b>versioned</b> (e.g. LangSmith Prompt Hub).</li><li>Put long documents <b>before</b> the question. Keep instructions crisp and positive ("do X", not only "don't Y").</li></ul>`},
 {k:'pitfall',h:'Common mistakes',b:`<ul><li>Changing prompts without a regression eval set.</li><li>Asking for JSON in prose instead of using structured output.</li><li>Giant prompts full of contradictory rules.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I structure prompts as role, context in delimiters, a few examples, the task and an enforced output schema. Prompts are versioned artifacts. Every change runs against an eval dataset in LangSmith before it ships, because a fix for one case often breaks another."</p>`}
],
cmp:[{cols:['Technique','When','Cost','Example'],rows:[
 ['Zero-shot','simple, well-known tasks','lowest','"Summarize this in 3 bullets"'],['Few-shot','strict format or style, edge cases','+ example tokens','3 labelled ticket → category pairs'],['Chain-of-thought','multi-step reasoning, math, planning','more output tokens','"Reason step by step, then answer"'],['Prompt chaining','complex workflows','several calls','extract → validate → summarize'],['Structured output','machine-readable responses','≈ same','JSON schema / tool schema']]}],
quiz:[
 {q:`Most reliable way to get parseable JSON from an LLM API?`,o:['Ask nicely in the prompt','Use structured output / function calling with a schema','Raise temperature','Use more examples only'],a:1,x:`Schema-enforced output (or tool calling) is far more reliable than prose instructions.`},
 {q:`Few-shot prompting mainly helps with…`,o:['Reducing latency','Showing the exact format and style you expect','Increasing the context window','Training the model weights'],a:1,x:`Examples teach in-context. No weights change.`},
 {q:`Why wrap retrieved documents in tags like <docs>…</docs>?`,o:[`It's required by tokenizers`,'To separate data from instructions (clarity + injection defense)','To compress tokens','For caching'],a:1,x:`Clear boundaries reduce confusion and make injected instructions inside docs easier to ignore.`},
 {q:`Chain-of-thought improves reasoning but costs…`,o:['Nothing','More output tokens and latency','Accuracy','The context window only'],a:1,x:`The reasoning is generated text, so you pay for it in tokens and time.`}
],
order:{q:`Order a well-structured prompt`,items:['Role & rules','Context in delimiters','Few-shot examples','The task','Output format']},
cards:[[`How do you manage prompts in production?`,`Templates with variables, versioned in a registry, every change gated by an eval dataset, and outputs schema-enforced.`],[`Zero-shot vs few-shot vs CoT?`,`Zero-shot is instructions only. Few-shot adds examples for format and edge cases. CoT asks for step-by-step reasoning for multi-step problems, at the cost of more tokens.`]]
}
]});

/* ---------------- RAG BASICS ---------------- */
{id:'rag-basics',em:'📚',t:'RAG: The Full Pipeline',mins:20,d:`Ingest → chunk → embed → store → retrieve → augment → generate, with every stage animated.`,
anim:[{type:'flow',title:'Offline: indexing pipeline',h:300,zones:[{x:20,y:40,w:760,h:220,l:'RUNS ONCE / ON DOC CHANGE'}],nodes:[
 ['src','Sources',90,150,'PDFs, Confluence, tickets'],['load','Load & clean',250,150,'parse, strip noise'],['chunk','Chunk',390,150,'~300–800 tokens'],['emb','Embed',520,150,'embedding model','p'],['vdb','Vector DB',680,150,'vectors + metadata','b']],
 edges:[['src','load'],['load','chunk'],['chunk','emb'],['emb','vdb']],
 steps:[
 {on:'src',t:`<b>Sources:</b> your private knowledge such as runbooks, wikis, PDFs and past incidents. The LLM has never seen this data.`},
 {on:'load',go:'src>load',t:`<b>Load & clean:</b> parse each format (PDF, HTML, tables), strip headers and footers, keep useful <b>metadata</b> (source, date, team, access level).`},
 {on:'chunk',go:'load>chunk',t:`<b>Chunk:</b> split into retrievable pieces with a little overlap so ideas aren't cut mid-thought.`},
 {on:'emb',go:'chunk>emb',t:`<b>Embed:</b> each chunk becomes a vector.`},
 {on:'vdb',go:'emb>vdb',t:`<b>Store:</b> vectors + original text + metadata go into a vector index (pgvector, Pinecone, Weaviate, Qdrant, FAISS…).`}
]},
{type:'flow',title:'Online: answering a question',h:420,nodes:[
 ['q','User question',100,70,'"How do I rotate the API key?"'],['qe','Embed query',90,190,'same model!','p'],['vdb','Vector DB',320,190,'ANN search','b'],
 ['top','Top-k chunks',320,320,'k = 4, with sources','y'],['prompt','Augmented prompt',560,320,'question + context'],['llm','LLM',560,190,'','p'],['ans','Grounded answer',710,70,'with citations','g']],
 edges:[['q','qe'],['qe','vdb'],['vdb','top'],['top','prompt'],['prompt','llm'],['llm','ans'],{f:'q',t:'prompt',dash:1,cv:-60}],
 steps:[
 {on:'q',t:`A user asks a question the base model can't answer from training data.`},
 {on:'qe',go:'q>qe',t:`Embed the question with the <b>same</b> embedding model used for the chunks.`},
 {on:'vdb',go:'qe>vdb',t:`<b>Retrieve:</b> approximate nearest-neighbour search finds the closest chunk vectors. Metadata filters (team, date, permissions) can narrow the search.`},
 {on:'top',go:'vdb>top',t:`Return the <b>top-k</b> chunks (e.g. 4) with their sources.`},
 {on:'prompt',go:'top>prompt q>prompt',t:`<b>Augment:</b> build the prompt: instructions + retrieved context in delimiters + the question + "answer only from the context, cite sources".`},
 {on:'llm',go:'prompt>llm',t:`<b>Generate:</b> the LLM reads the context and writes the answer.`},
 {on:'ans',go:'llm>ans',t:`A <b>grounded</b> answer with citations, no fine-tuning needed. Update a doc and you just re-index it.`}
]}],
learn:[
 {h:'Why RAG exists',b:`<ul><li>LLMs don't know your <b>private</b> or <b>recent</b> data (training cutoff).</li><li>They <b>hallucinate</b> confidently. Grounding in retrieved text plus citations reduces that and makes answers verifiable.</li><li>Cheaper and faster to update than fine-tuning: change a document, re-embed that chunk, done.</li><li>Supports <b>access control</b>: filter retrieval by the user's permissions.</li></ul>`},
 {h:'Where RAG fails (and interviewers probe)',b:`<ul><li><b>Retrieval miss:</b> the right chunk wasn't in the top-k. This is the most common failure, so fix retrieval before blaming the LLM.</li><li><b>Bad chunking:</b> the answer was split across chunks, or tables got mangled.</li><li><b>Noisy context:</b> irrelevant chunks distract the model.</li><li><b>Unfaithful generation:</b> the model ignores the context or adds facts.</li><li><b>Stale index:</b> docs changed but weren't re-indexed.</li></ul>`},
 {k:'analogy',h:'Analogy',b:`<p>An open-book exam. The LLM is a smart student; RAG is the librarian who hands over the 4 most relevant pages just before each question.</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"RAG has an offline indexing path (load, clean, chunk, embed and store with metadata) and an online path (embed the query, retrieve top-k with metadata filters, optionally rerank, then generate with a grounded prompt that requires citations). When quality drops I debug retrieval first, using recall@k and context precision, before touching the prompt or the model."</p>`}
],
cmp:[{t:'RAG vs alternatives',cols:['Approach','Adds knowledge?','Freshness','Cost to update','Best for'],rows:[
 ['Prompt only','only what fits in the prompt','manual','free','small, static context'],['RAG','✅ large private corpora','re-index docs','cheap','Q&A over docs, support, runbooks'],['Fine-tuning','weakly; mainly style and format','retrain','expensive','tone, format, domain behaviour'],['Long-context stuffing','✅ if it fits','per request','high token cost','one-off analysis of a few docs']]}],
quiz:[
 {q:`What must be the same at index time and query time?`,o:['The LLM','The embedding model','The chunk overlap','Temperature'],a:1,x:`Query and chunk vectors must come from the same embedding space.`},
 {q:`RAG answers are wrong. Logs show the right chunk was never retrieved. Fix where?`,o:['Generation prompt','Retrieval: chunking, hybrid search, k, reranking','Use a bigger LLM','Raise temperature'],a:1,x:`If the context never contained the answer, no prompt can fix it.`},
 {q:`A key advantage of RAG over fine-tuning for company docs:`,o:['No embeddings needed','Easy to update and cite sources','Always faster per request','Removes all hallucinations'],a:1,x:`Update by re-indexing, and get citations back to sources.`},
 {q:`Metadata filters at retrieval are useful for…`,o:['Tokenization','Permissions, recency and scoping by team or product','Sampling','Training'],a:1,x:`Filter by ACL, date or product before or during vector search.`},
 {q:`Which step happens offline?`,o:['Embedding the user query','Chunking documents','Generating the answer','Reranking results'],a:1,x:`Chunking and embedding the documents is indexing, done ahead of time.`}
],
order:{q:`Order the full RAG flow`,items:['Load & clean documents','Chunk them','Embed chunks & store in vector DB','Embed the user query & retrieve top-k','Build augmented prompt','LLM generates grounded answer']},
match:{pairs:[['Ingestion','Load, clean, chunk, embed'],['Retrieval','Find top-k similar chunks'],['Augmentation','Insert context into prompt'],['Generation','LLM writes cited answer']]},
cards:[[`Walk me through a RAG pipeline.`,`Offline: load, clean, chunk, embed and store with metadata. Online: embed the query, filter and retrieve top-k, optionally rerank, build a grounded prompt, generate with citations. Evaluate retrieval and generation separately.`],[`Your RAG bot hallucinates. How do you debug?`,`Check traces. Was the answer in the retrieved chunks? If not, it's a retrieval issue: chunking, hybrid search, reranking, k. If yes, it's a generation issue: prompt, faithfulness instruction, model. Measure with faithfulness and context-recall evals.`]]
},

/* ---------------- CHUNKING + VECTOR DB ---------------- */
{id:'chunking',em:'✂️',t:'Chunking & Vector Databases',mins:20,d:`Fixed, recursive, semantic and parent-child chunking, plus how HNSW makes vector search fast.`,
anim:[{type:'arr',title:'Chunking strategies',frames:[
 {rows:[{lab:'Document',a:['## Rotate keys','Step 1: open vault','Step 2: run rotate.sh','Step 3: restart svc','## Billing','Invoices go out monthly']}],t:`One runbook page: two sections with different topics. How should we cut it?`},
 {rows:[{lab:'Fixed-size (every N tokens)',a:['## Rotate keys','Step 1: open vault','Step 2: run rotate.sh','Step 3: restart svc','## Billing','Invoices go out monthly'],hl:'0 1 2',ok:'3 4 5'}],t:`<b>Fixed-size:</b> cut every N tokens. Simple and fast, but chunk 2 mixes "Step 3" with Billing, so the topics blur.`},
 {rows:[{lab:'Overlap (sliding)',a:['## Rotate keys','Step 1: open vault','Step 2: run rotate.sh','Step 3: restart svc','## Billing','Invoices go out monthly'],hl:'0 1 2 3',ok:'2 3'}],t:`<b>Overlap</b> (e.g. 10–20%) repeats the edge content in the next chunk, so a step that falls on a boundary survives.`},
 {rows:[{lab:'Recursive / structure-aware',a:['## Rotate keys','Step 1: open vault','Step 2: run rotate.sh','Step 3: restart svc','## Billing','Invoices go out monthly'],hl:'0 1 2 3',ok:'4 5'}],t:`<b>Recursive:</b> split on headings, then paragraphs, then sentences, only as small as needed. Each chunk = one coherent topic. A great default (LangChain's RecursiveCharacterTextSplitter).`},
 {rows:[{lab:'Parent (returned to LLM)',a:['Full "Rotate keys" section'],ok:'0',noix:1},{lab:'Children (embedded & searched)',a:['Step 1','Step 2','Step 3'],hl:'1'}],t:`<b>Parent-child / small-to-big:</b> search over small, precise child chunks, but hand the LLM the whole parent section for full context.`},
 {rows:[{lab:'Semantic chunking',a:['rotate…','vault…','rotate.sh…','restart…','|','billing…'],hl:'0 1 2 3',bad:'4',ok:'5'}],t:`<b>Semantic:</b> embed sentences and cut where meaning shifts (similarity drops). Better topic boundaries, but costs more at index time.`}
]},
{type:'flow',title:'How HNSW search works',h:400,zones:[{x:30,y:20,w:740,h:100,l:'LAYER 2 (sparse highways)'},{x:30,y:140,w:740,h:100,l:'LAYER 1'},{x:30,y:260,w:740,h:120,l:'LAYER 0 (all vectors)'}],nodes:[
 ['a2','A',150,75],['b2','B',600,75],['a1','A',150,195],['c1','C',380,195],['b1','B',600,195],['a0','A',150,325],['d0','D',300,325],['c0','C',380,325],['e0','E',470,325,'','g'],['b0','B',600,325],['q','query',520,240,'','y']],
 edges:[['a2','b2'],['a1','c1'],['c1','b1'],['a0','d0'],['d0','c0'],['c0','e0'],['e0','b0'],{f:'a2',t:'a1',dash:1},{f:'b2',t:'b1',dash:1},{f:'c1',t:'c0',dash:1}],
 steps:[
 {t:`Brute-force search compares the query to <b>every</b> vector: O(n). Too slow for millions of chunks, so vector DBs use <b>ANN</b> (approximate nearest neighbour) indexes like <b>HNSW</b>.`},
 {on:'q',t:`HNSW = <b>Hierarchical Navigable Small World</b> graph: layers of linked vectors, sparse at the top and complete at the bottom.`},
 {on:'a2 b2',go:'a2>b2',t:`Start at the top layer and take big "highway" jumps toward the query (like taking a flight between cities).`},
 {on:'b1 c1',go:'b2>b1 b1>c1',t:`Drop down a layer and keep moving greedily to closer neighbours (now driving between towns).`},
 {on:'e0',go:'c1>c0 c0>e0',ok:'e0',t:`At layer 0, walk local streets to the nearest match: <b>E</b>. That takes about log(n) hops instead of n comparisons.`},
 {ok:'e0',t:`Trade-off: ANN is <b>approximate</b>. Parameters like <code>ef_search</code> and <code>M</code> trade recall against speed and memory.`}
]}],
learn:[
 {h:'Chunk size trade-off',b:`<ul><li><b>Too small:</b> precise matches but missing context ("Step 3" without knowing what it's for).</li><li><b>Too large:</b> more context but diluted embeddings, more tokens and more noise.</li><li>Typical start: <b>300–800 tokens, 10–20% overlap</b>, structure-aware. Then tune with retrieval evals, not vibes.</li><li>Add <b>metadata and contextual headers</b> to each chunk (doc title, section path) so it carries context.</li></ul>`},
 {h:'Vector database options',b:`<ul><li><b>pgvector</b> (Postgres): one DB for app data and vectors. Great if you already run Postgres or Supabase.</li><li><b>Pinecone</b>: fully managed and serverless.</li><li><b>Weaviate / Qdrant / Milvus</b>: open source, rich filtering, hybrid search.</li><li><b>FAISS / Chroma</b>: libraries and lightweight stores for prototypes.</li><li><b>Elasticsearch / OpenSearch</b>: strong BM25 plus vectors, good for hybrid search.</li></ul>`},
 {h:'Index types',b:`<ul><li><b>Flat:</b> exact, brute force. Fine under ~100k vectors.</li><li><b>HNSW:</b> graph-based, high recall, fast, memory-heavy. The most common.</li><li><b>IVF:</b> cluster vectors and search only the nearest clusters. Less memory, tune <code>nprobe</code>.</li><li><b>PQ (product quantization):</b> compresses vectors to save memory, with some loss of accuracy.</li></ul>`},
 {k:'pitfall',h:'Gotchas',b:`<ul><li>PDF tables and code blocks get shredded by naive splitters, so handle them specially.</li><li>Post-filtering after ANN can return fewer than k results. Prefer DBs with pre-filtering or filtered HNSW.</li><li>Forgetting to delete old vectors when a doc is updated.</li></ul>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I start with structure-aware recursive chunking around 500 tokens with overlap, add the section path as metadata, and use parent-child retrieval when answers need surrounding context. For storage I'd pick pgvector if we're already on Postgres, or a managed store like Pinecone at large scale, with an HNSW index tuned for recall and metadata pre-filtering for permissions."</p>`}
],
cmp:[{t:'Chunking strategies',cols:['Strategy','How','Pros','Cons'],rows:[
 ['Fixed-size','every N tokens','simple, predictable','splits mid-idea'],['Recursive','headings → paragraphs → sentences','coherent chunks, good default','depends on doc structure'],['Semantic','cut where embedding similarity drops','topic-pure chunks','slower, costlier indexing'],['Parent-child','search small, return big','precise + full context','more storage and complexity'],['Document-specific','per-format (Markdown, code, tables)','respects structure','custom code per type']]},
 {t:'ANN indexes',cols:['Index','Speed','Memory','Recall'],rows:[['Flat','slow at scale','low','100% (exact)'],['HNSW','very fast','high','very high'],['IVF','fast','medium','tunable (nprobe)'],['IVF-PQ','fast','very low','lower']]}],
quiz:[
 {q:`Small chunks give precise hits but the LLM lacks context. Best technique?`,o:['Bigger temperature','Parent-child (small-to-big) retrieval','Remove overlap','Switch to Flat index'],a:1,x:`Search on small children, return the larger parent to the LLM.`},
 {q:`What does chunk overlap protect against?`,o:['Prompt injection','Information split across a chunk boundary','Slow embeddings','Token limits'],a:1,x:`Overlap repeats edge content so boundary ideas stay intact.`},
 {q:`HNSW is a…`,o:['Tokenizer','Graph-based approximate nearest-neighbour index','Reranker','Chunking method'],a:1,x:`Hierarchical Navigable Small World graph for fast ANN search.`},
 {q:`Already running Postgres and want vectors next to app data. Choose…`,o:['Pinecone','pgvector','FAISS in memory','Redis only'],a:1,x:`pgvector keeps everything in one transactional DB.`},
 {q:`ANN search is "approximate" because…`,o:['Embeddings are random','It trades a little recall for big speed gains','It uses BM25','It skips metadata'],a:1,x:`It may occasionally miss the true nearest neighbour in exchange for log-time search.`}
],
match:{pairs:[['Recursive splitter','Split by headings → paragraphs → sentences'],['Semantic chunking','Cut where meaning shifts'],['IVF','Search only nearest clusters'],['Product quantization','Compress vectors to save memory']]},

},

/* ---------------- ADVANCED RETRIEVAL ---------------- */
{id:'retrieval-plus',em:'🎯',t:'Hybrid Search, Reranking & Query Tricks',mins:20,d:`BM25 + dense, RRF, cross-encoder rerankers, multi-query, HyDE and query rewriting.`,
anim:[{type:'flow',title:'Two-stage retrieval: recall, then precision',h:420,nodes:[
 ['q','Query',95,200,'"error E-4012 on login"'],['rw','Query rewrite',262,200,'LLM cleans / expands','p'],
 ['bm','BM25 (keywords)',420,90,'hits "E-4012" exactly','y'],['dn','Dense (embeddings)',420,310,'hits "auth failure"','b'],
 ['rrf','Fuse (RRF)',590,200,'top 50 candidates'],['rr','Reranker',590,350,'cross-encoder','p'],['ctx','Top 5 → LLM',730,350,'','g']],
 edges:[['q','rw'],['rw','bm'],['rw','dn'],['bm','rrf'],['dn','rrf'],['rrf','rr'],['rr','ctx']],
 steps:[
 {on:'q',t:`User query mixes an exact code ("E-4012") with a vague intent ("login").`},
 {on:'rw',go:'q>rw',t:`<b>Query rewriting:</b> an LLM fixes typos, expands acronyms, uses chat history to make the question standalone, or splits it into sub-questions.`},
 {on:'bm dn',go:'rw>bm rw>dn',t:`<b>Hybrid search:</b> run BM25 (exact keywords) and dense vector search (meaning) in parallel. Each catches what the other misses.`},
 {on:'rrf',go:'bm>rrf dn>rrf',t:`<b>Reciprocal Rank Fusion:</b> score = Σ 1/(k + rank) across both lists. Merges rankings without calibrating scores. Keep a generous top ~50.`},
 {on:'rr',go:'rrf>rr',t:`<b>Rerank:</b> a cross-encoder reads (query, chunk) <i>together</i> and scores true relevance. Slower, so only run it on the candidates.`},
 {on:'ctx',go:'rr>ctx',ok:'ctx',t:`Send only the best ~5 to the LLM: higher precision, fewer tokens, less distraction. <b>Stage 1 = recall, stage 2 = precision.</b>`}
]},
{type:'flow',title:'Query transformations',h:330,nodes:[
 ['q','Original query',100,165],['mq','Multi-query',330,60,'3–5 paraphrases → union'],['hyde','HyDE',330,165,'LLM writes fake answer → embed it'],['dec','Decomposition',330,270,'split into sub-questions'],['ret','Retriever',600,165,'','b']],
 edges:[['q','mq'],['q','hyde'],['q','dec'],['mq','ret'],['hyde','ret'],['dec','ret']],
 steps:[
 {on:'q',t:`Users write short, vague or compound questions. Transform the query <i>before</i> retrieving.`},
 {on:'mq',go:'q>mq mq>ret',t:`<b>Multi-query:</b> generate several paraphrases, retrieve for each and union the results. Better recall for ambiguous wording.`},
 {on:'hyde',go:'q>hyde hyde>ret',t:`<b>HyDE (Hypothetical Document Embeddings):</b> ask the LLM to draft a plausible answer, then embed <i>that</i>. Answer-shaped text matches answer-shaped chunks better than a short question does.`},
 {on:'dec',go:'q>dec dec>ret',t:`<b>Decomposition:</b> "Compare our 2024 and 2025 SLA" → two retrievals, then combine. Also called sub-question or step-back prompting.`}
]}],
learn:[
 {h:'Bi-encoder vs cross-encoder',b:`<ul><li><b>Bi-encoder</b> (embedding model): encodes query and doc <i>separately</i>, so doc vectors are pre-computed. Fast, scales to millions, less precise.</li><li><b>Cross-encoder</b> (reranker): encodes query+doc <i>together</i>, so it sees word-level interactions. Very accurate but can't pre-compute, so you run it on tens of candidates, not millions.</li><li>Popular rerankers: Cohere Rerank, BGE-reranker, Jina reranker, or an LLM-as-reranker.</li></ul>`},
 {h:'Other retrieval upgrades',b:`<ul><li><b>Metadata filtering & self-query:</b> an LLM extracts filters ("tickets from last week, team=SVS") from the question.</li><li><b>Contextual chunk headers:</b> prepend title or section to each chunk before embedding.</li><li><b>MMR (Maximal Marginal Relevance):</b> pick relevant <i>and</i> diverse chunks so you don't send 5 near-duplicates.</li><li><b>Tune k:</b> retrieve wide (50), rerank, keep narrow (3–8).</li></ul>`},
 {k:'analogy',h:'Analogy',b:`<p>Hiring: a recruiter skims 500 resumes quickly (bi-encoder / BM25). The hiring manager deeply interviews the top 20 (cross-encoder). Only the top 5 reach the final round (the LLM context).</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I use two-stage retrieval: hybrid BM25 + dense with reciprocal rank fusion for recall, then a cross-encoder reranker for precision, sending only the top few chunks. For vague questions I add query rewriting or multi-query, and I validate each addition with recall@k and answer-quality evals, because every stage adds latency and cost."</p>`}
],
cmp:[{cols:['Technique','Fixes','Cost'],rows:[
 ['Hybrid (BM25 + dense)','exact terms, IDs, codes missed by embeddings','+1 index, cheap'],['Reranker','relevant-but-not-top chunks; noise','+50–300 ms'],['Query rewriting','typos, follow-ups ("what about it?")','+1 LLM call'],['Multi-query','ambiguous wording, low recall','N retrievals'],['HyDE','short queries vs long docs mismatch','+1 LLM call'],['MMR','duplicate / redundant chunks','cheap']]},
 {t:'Bi-encoder vs Cross-encoder',cols:['','Bi-encoder','Cross-encoder'],rows:[['Input','query and doc separately','query + doc together'],['Pre-compute docs?','✅ yes','❌ no'],['Speed','ms over millions','slow, only for tens of docs'],['Accuracy','good','best'],['Role','first-stage retrieval','reranking']]}],
quiz:[
 {q:`Why not use a cross-encoder for first-stage retrieval over 10M chunks?`,o:['Too inaccurate','It must process every (query, doc) pair at query time, which is far too slow','It needs BM25',`It can't read text`],a:1,x:`Cross-encoders can't pre-compute document representations.`},
 {q:`RRF merges ranked lists using…`,o:['Raw cosine scores','1/(k + rank) summed across lists','Token counts','Random choice'],a:1,x:`Rank-based fusion avoids calibrating incomparable scores.`},
 {q:`HyDE embeds…`,o:['The query only','A hypothetical answer generated by an LLM','The whole corpus again','Metadata'],a:1,x:`An answer-shaped passage is closer in embedding space to real answer chunks.`},
 {q:`Follow-up question "what about the second one?" retrieves garbage. Fix?`,o:['Bigger k','Rewrite into a standalone question using chat history','Lower temperature','Semantic chunking'],a:1,x:`Condense history plus follow-up into a self-contained query before retrieval.`},
 {q:`MMR helps by…`,o:['Compressing vectors','Balancing relevance with diversity','Removing stop words','Caching'],a:1,x:`Maximal Marginal Relevance avoids sending near-duplicate chunks.`}
],
order:{q:`Order an advanced retrieval pipeline`,items:['Rewrite / condense query','Hybrid search (BM25 + dense)','Fuse with RRF (~50 candidates)','Cross-encoder rerank','Send top 5 to the LLM']},
match:{pairs:[['BM25','Exact keyword matching'],['Cross-encoder','Joint query-doc relevance score'],['Multi-query','Several paraphrases, union results'],['Self-query','LLM extracts metadata filters']]},
cards:[[`What's reranking and when do you add it?`,`A cross-encoder re-scores retrieved candidates by reading query and chunk together. Add it when the right chunk is retrieved but not ranked high enough, or when context has noise. Budget the extra 50–300 ms.`],[`Why hybrid search?`,`Dense retrieval captures meaning but blurs exact tokens like error codes, SKUs and names. BM25 nails exact terms. Fusing them (RRF) gives robust recall.`]]
},

/* ---------------- TYPES OF RAG ---------------- */
{id:'rag-types',em:'🧬',t:'Types of RAG',mins:20,d:`Naive, advanced, modular, agentic, corrective (CRAG), self-RAG, GraphRAG and multimodal RAG compared.`,
anim:[{type:'flow',title:'Agentic & corrective RAG loop',h:470,nodes:[
 ['q','Question',75,70],['plan','Agent: route / plan',265,70,'which source? retrieve?','p'],['vdb','Vector store',490,70,'','b'],['web','Web / API / SQL tool',480,190,'','b'],
 ['grade','Grade relevance',700,130,'LLM judge','y'],['rw','Rewrite query',700,280,'','r'],['gen','Generate',420,350,'','p'],['chk','Check: grounded?',180,350,'self-reflection','y'],['ans','Answer',180,435,'','g']],
 edges:[['q','plan'],['plan','vdb'],['plan','web'],['vdb','grade'],['web','grade'],['grade','gen','relevant'],{f:'grade',t:'rw',l:'irrelevant'},{f:'rw',t:'vdb',dash:1},['gen','chk'],['chk','ans','yes'],{f:'chk',t:'gen',l:'no → retry',dash:1,cv:40}],
 steps:[
 {on:'q',t:`<b>Naive RAG</b> always retrieves once and always generates. Agentic RAG puts an LLM <b>in control</b> of the loop.`},
 {on:'plan',go:'q>plan',t:`<b>Routing:</b> the agent decides whether to retrieve at all, and from where: vector store, SQL DB, web search or an API.`},
 {on:'vdb',go:'plan>vdb',t:`It calls the retriever as a <b>tool</b>.`},
 {on:'grade',go:'vdb>grade',t:`<b>Corrective RAG (CRAG):</b> an LLM grades each retrieved doc for relevance.`},
 {on:'rw web',go:'grade>rw rw>vdb plan>web',bad:'grade',t:`If the docs are irrelevant: rewrite the query and retry, or fall back to <b>web search</b>.`},
 {on:'gen',go:'grade>gen',t:`With good context it generates an answer.`},
 {on:'chk',go:'gen>chk',t:`<b>Self-RAG:</b> the model critiques its own answer. Is it supported by the docs? Does it answer the question? If not, loop back.`},
 {ok:'ans',go:'chk>ans',t:`Only grounded answers get out. This loop is exactly what you build with <b>LangGraph</b>: nodes, conditional edges and state.`}
]}],
learn:[
 {h:'The evolution',b:`<ul><li><b>Naive RAG:</b> retrieve top-k, then generate. A one-shot pipeline.</li><li><b>Advanced RAG:</b> adds pre-retrieval steps (query rewriting, better chunking) and post-retrieval steps (reranking, compression).</li><li><b>Modular RAG:</b> swappable components (retrievers, routers, rerankers) wired together as a pipeline or graph.</li><li><b>Agentic RAG:</b> an LLM agent decides when, where and how to retrieve, possibly over several steps and tools.</li></ul>`},
 {h:'Specialized variants',b:`<ul><li><b>Corrective RAG (CRAG):</b> grade retrieved docs and correct with query rewriting or web search when they're poor.</li><li><b>Self-RAG:</b> the model decides when to retrieve and reflects on whether its output is supported.</li><li><b>GraphRAG:</b> build a <b>knowledge graph</b> of entities and relationships (plus community summaries) from the corpus. Great for multi-hop ("which services depend on the auth team's API?") and global "summarize themes" questions.</li><li><b>Multimodal RAG:</b> retrieve over images, diagrams, tables and slides using vision-capable embeddings or captions.</li><li><b>Adaptive RAG:</b> route by query complexity: no retrieval, single-shot, or iterative multi-step.</li><li><b>SQL / structured RAG (text-to-SQL):</b> the LLM writes queries against databases for numeric or aggregate questions.</li></ul>`},
 {k:'pitfall',h:'Trade-offs',b:`<p>Every loop adds LLM calls, which means more <b>latency, cost and failure modes</b>. Start with advanced RAG and add agentic loops only where evals show a real gain. Cap iterations.</p>`},
 {k:'say',h:'Say it in the interview',b:`<p>"I'd start with advanced RAG: hybrid retrieval plus reranking. If questions need multiple sources or multi-hop reasoning I'd move to agentic RAG in LangGraph with a router, a relevance-grading node and a fallback to web or SQL, the corrective RAG pattern, with an iteration cap. For relationship-heavy domains like service dependency maps I'd consider GraphRAG."</p>`}
],
cmp:[{cols:['Type','Key idea','Strength','Weakness'],rows:[
 ['Naive','retrieve once → generate','simple, fast','brittle, noisy'],['Advanced','+ rewrite, hybrid, rerank','big quality jump','more components'],['Modular','pluggable pipeline blocks','flexible, testable','design effort'],['Agentic','LLM decides when/where to retrieve','multi-source, multi-step','latency, cost, unpredictability'],['Corrective (CRAG)','grade docs → fix or fallback','robust to bad retrieval','extra LLM calls'],['Self-RAG','model reflects on support','fewer hallucinations','needs capable model'],['GraphRAG','knowledge graph + communities','multi-hop & global questions','expensive indexing'],['Multimodal','images, tables, slides','non-text knowledge','complex ingestion']]}],
quiz:[
 {q:`"Which microservices are indirectly affected if the auth DB fails?" Best fit?`,o:['Naive RAG','GraphRAG (multi-hop over relationships)','Higher temperature','Fixed-size chunking'],a:1,x:`Multi-hop relationship questions are where knowledge graphs shine.`},
 {q:`Corrective RAG's distinctive step is…`,o:['Fine-tuning','Grading retrieved docs and correcting (rewrite / web fallback)','Tokenization','Caching'],a:1,x:`CRAG evaluates retrieval quality and corrects course.`},
 {q:`What makes RAG "agentic"?`,o:['Using a vector DB','An LLM decides whether, where and how often to retrieve via tools','Using embeddings','Streaming responses'],a:1,x:`The agent controls retrieval as a decision loop.`},
 {q:`Main downside of agentic RAG vs advanced RAG?`,o:['Lower quality','Higher latency, cost and less predictability',`Can't use vector DBs`,'No citations'],a:1,x:`More LLM calls and branches mean more cost and more variance.`},
 {q:`"Revenue by region last quarter" over a database. Best approach?`,o:['Embed the rows','Text-to-SQL tool','HyDE','Semantic chunking'],a:1,x:`Aggregations belong in SQL, not vector similarity.`}
],
match:{pairs:[['Self-RAG','Model critiques its own grounding'],['GraphRAG','Entities + relationships graph'],['Adaptive RAG','Route by query complexity'],['Modular RAG','Swappable pipeline components']]},
cards:[[`Naive vs advanced vs agentic RAG?`,`Naive: retrieve once, generate. Advanced: adds query rewriting, hybrid search and reranking. Agentic: an LLM agent decides when and where to retrieve, loops, grades results and uses multiple tools.`],[`When would you NOT use agentic RAG?`,`When latency or cost budgets are tight and questions are single-hop. Advanced RAG is faster, cheaper and more predictable. Add agency only where evals prove a gain.`]]
}
]});
