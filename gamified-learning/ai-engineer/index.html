  $$('[data-b]',mount).forEach(b=>b.onclick=ev=>{
    if(!sel){b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');return;}
    if(sel.dataset.a===b.dataset.b){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;left--;
      if(!left){const x=Math.max(5,15-miss*2);gainXP(x,ev);$('[data-end]',mount).innerHTML=`<div class="expl g"><b>✅ All matched!</b></div><div class="navrow"><span></span><button class="btn" data-nx>Continue →</button></div>`;$('[data-nx]',mount).onclick=()=>done();}}
    else{miss++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');$('[data-m]',mount).textContent='Misses: '+miss;}
  });
}
function flashcards(cards){
  return `<div class="grid2">${cards.map(c=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="in"><div class="fa"><div class="kick" style="margin-bottom:6px">Interview Q</div>${c[0]}<div class="hint">Tap to flip</div></div><div class="fb">${c[1]}</div></div></div>`).join('')}</div>`;
}

/* ---------- lesson ---------- */
function learnHTML(l){
  const icon={analogy:'🧠',pitfall:'⚠️',say:'🎤'};
  return `<div class="learn">${(l.learn||[]).map(c=>`<div class="lc ${c.k||''}"><h4>${c.k?icon[c.k]+' ':''}${c.h}</h4>${c.b||''}${c.code?codeBlock(c.code):''}</div>`).join('')}</div>`;
}
function cmpHTML(l){
  return (l.cmp||[]).map(t=>`${t.t?`<div class="cmp-t">${t.t}</div>`:''}<div class="tblw"><table class="cmp"><thead><tr>${t.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`).join('');
}
function lessonView(l){
  const stages=[];
  if(l.anim) stages.push(['watch','🎬 Watch']);
  stages.push(['learn','📖 Learn']);
  if(l.cmp) stages.push(['cmp','⚖️ Compare']);
  if(l.probs) stages.push(['probs','🧩 Problems']);
  if(l.cards) stages.push(['cards','🃏 Recall']);
  stages.push(['play','🎮 Play']);
  let cur=0, players=[], earned=S.xp, watchedXP=false;
  cleanup.push(()=>players.forEach(p=>p.destroy()));
  const seg=A.segments[l.seg];
  root.innerHTML=`<div class="wrap"><div class="crumbs"><a data-home>🏠 Map</a> › <span>${esc(seg.name)}</span> › <span>Lesson ${l.n}</span></div>
   <div class="h1" style="margin-top:10px">${l.em} ${esc(l.t)}</div><p class="sub">${l.d}${l.mins?` · ~${l.mins} min`:''}</p>
   <div class="stepper" data-stp></div><div data-body></div></div>`;
  $('[data-home]').onclick=()=>go('');
  const body=$('[data-body]');
  function stepper(){ $('[data-stp]').innerHTML=stages.map((s,j)=>`<button class="${j===cur?'on':j<cur?'ok':''}" data-st="${j}">${j<cur?'✓ ':''}${s[1]}</button>`).join('');
    $$('[data-st]').forEach(b=>b.onclick=()=>show(+b.dataset.st)); }
  function nav(){ return `<div class="navrow">${cur>0?`<button class="btn ghost" data-pv>← ${stages[cur-1][1]}</button>`:'<span></span>'}${cur<stages.length-1?`<button class="btn" data-nx>Next: ${stages[cur+1][1]} →</button>`:''}</div>`; }
  function bindNav(){ const p=$('[data-pv]',body); if(p) p.onclick=()=>show(cur-1); const n=$('[data-nx]',body); if(n) n.onclick=()=>show(cur+1); }
  function show(j){
    players.forEach(p=>p.destroy()); players=[]; cur=j; stepper(); const k=stages[j][0];
    body.innerHTML=`<div class="pane" data-pn></div>`; const pn=$('[data-pn]',body);
    if(k==='watch'){ pn.innerHTML=`<div data-pl></div><p class="hint">Tip: ← → keys step through, ▶ auto-plays. Watch every step for +10 XP.</p>${nav()}`;
      players.push(Player($('[data-pl]',pn),l.anim,{keys:true,onAllSeen:()=>{if(!watchedXP){watchedXP=true;gainXP(10)}}})); }
    else if(k==='learn'){ pn.innerHTML=learnHTML(l)+nav(); }
    else if(k==='cmp'){ pn.innerHTML=cmpHTML(l)+nav(); }
    else if(k==='cards'){ pn.innerHTML=`<p class="sub">Answer out loud first, then flip. This is how you'll say it in the interview.</p>`+flashcards(l.cards)+nav(); }
    else if(k==='probs'){
      pn.innerHTML=l.probs.map((p,pi)=>`<div class="card prob"><div class="prob-h"><h4>${pi+1}. ${p.n}</h4><span class="tag ${p.lv}">${{e:'Easy',m:'Medium',h:'Hard'}[p.lv]}</span>${p.lc?`<span class="cx">LeetCode #${p.lc}</span>`:''}</div>
        <p style="margin:6px 0;color:#d3daf7">${p.q||''}</p><div class="lc analogy" style="margin:10px 0"><h4>💡 Key idea</h4><p>${p.idea}</p></div>
        ${p.trace?`<div data-tr="${pi}" style="margin:12px 0"></div>`:''}
        <details class="rev"><summary>🧠 Think first, then reveal the Python solution</summary>${codeBlock(p.code)}<div class="cx">⏱ ${p.cx||''}</div></details></div>`).join('')+nav();
      l.probs.forEach((p,pi)=>{ if(p.trace) players.push(Player($(`[data-tr="${pi}"]`,pn),Object.assign({type:'arr',title:'Trace: '+p.n},p.trace),{autoplay:false})); });
    }
    else if(k==='play'){ runPlay(pn); return; }
    bindNav();
  }
  function runPlay(pn){
    const seq=[]; if(l.quiz) seq.push('quiz'); if(l.order) seq.push('order'); if(l.match) seq.push('match');
    let qs={s:0,n:0}; let ix=0;
    const next=()=>{ if(ix>=seq.length) return finish(); const g=seq[ix++];
      if(g==='quiz') quizGame(pn,l.quiz,(s,n)=>{qs={s,n};next()});
      else if(g==='order') orderGame(pn,l.order,next);
      else matchGame(pn,l.match,next); };
    function finish(){
      const ratio=qs.n?qs.s/qs.n:1; const stars=ratio>=.99?3:ratio>=.6?2:1;
      const first=!S.done[l.id]; S.done[l.id]=Math.max(S.done[l.id]||0,stars); gainXP(first?25:10); save(); confetti(stars*30);
      const nx=LESSONS[LESSONS.indexOf(l)+1];
      pn.innerHTML=`<div class="done-scr card"><div class="big">${stars===3?'🏆':stars===2?'🎉':'💪'}</div><h2 style="margin:6px 0">Lesson complete!</h2>
       <div class="stars">${'⭐'.repeat(stars)}<span style="opacity:.2">${'⭐'.repeat(3-stars)}</span></div>
       <p class="sub">Quiz: ${qs.s}/${qs.n} correct · +${S.xp-earned} XP this lesson${first?' (incl. +25 first-clear bonus)':''}</p>
       <div class="row" style="justify-content:center">${nx?`<button class="btn" data-nl>Next: ${nx.em} ${esc(nx.t)} →</button>`:''}<button class="btn ghost" data-rp>↺ Replay games</button><button class="btn ghost" data-mp>🏠 Map</button></div></div>`;
      const b=$('[data-nl]',pn); if(b) b.onclick=()=>go('l-'+nx.id); $('[data-rp]',pn).onclick=()=>{ix=0;next()}; $('[data-mp]',pn).onclick=()=>go('');
    }
    next();
  }
  show(0);
}

/* ---------- boss ---------- */
function bossView(key){
  let pool=[], title='';
  if(key==='cards'){
    const cards=LESSONS.flatMap(l=>(l.cards||[]).map(c=>c));
    root.innerHTML=`<div class="wrap pane"><div class="crumbs"><a data-home>🏠 Map</a> › Flashcard sprint</div><div class="h1">🃏 Flashcard sprint</div><p class="sub">Every interview card across the track, shuffled. Say each answer out loud before flipping.</p>${flashcards(shuffle(cards).slice(0,24))}
      <div class="navrow"><button class="btn ghost" data-home2>← Map</button><button class="btn" data-dn>Mark sprint done ✓</button></div></div>`;
    $('[data-home]').onclick=$('[data-home2]').onclick=()=>go('');
    $('[data-dn]').onclick=ev=>{if(!S.boss.cards){S.boss.cards=1;gainXP(30,ev);confetti()} save(); go('');};
    return;
  }
  if(key==='all'){ pool=LESSONS.flatMap(l=>l.quiz||[]); title='Final boss: everything'; }
  else { const s=A.segments[+key]; if(!s) return go(''); pool=s.lessons.flatMap(l=>l.quiz||[]); title='Boss: '+s.name; }
  const qs=shuffle(pool).slice(0,12);
  root.innerHTML=`<div class="wrap"><div class="crumbs"><a data-home>🏠 Map</a> › ${esc(title)}</div><div class="h1">👾 ${esc(title)}</div><p class="sub">12 random questions · 3 lives · 3 in a row = double XP</p><div data-g></div></div>`;
  $('[data-home]').onclick=()=>go('');
  quizGame($('[data-g]'),qs,(s,n,xp,dead)=>{
    const win=!dead&&s/n>=.7; if(win){S.boss[key]=Math.max(S.boss[key]||0,s); gainXP(40); confetti(120);} save();
    $('[data-g]').innerHTML=`<div class="done-scr card"><div class="big">${win?'🏆':dead?'💀':'😤'}</div><h2>${win?'Boss defeated!':dead?'Out of lives':'So close!'}</h2><p class="sub">${s}/${n} correct${win?' · +40 XP bonus':' · need 70% to win'}</p>
     <div class="row" style="justify-content:center"><button class="btn" data-rt>↺ Fight again</button><button class="btn ghost" data-mp>🏠 Map</button></div></div>`;
    $('[data-rt]').onclick=()=>route(); $('[data-mp]').onclick=()=>go('');
  },{lives:3,combo:true,title:'Boss'});
}

renderTop(); route();
})();
</script></body></html>
