 {h:'Kinds of binary trees',b:`<ul><li><b>Full:</b> every node has 0 or 2 children.</li><li><b>Complete:</b> every level filled left to right (heaps are complete).</li><li><b>Balanced:</b> left and right heights differ by at most 1 everywhere, so height ≈ log n.</li><li><b>Skewed:</b> basically a linked list, so height = n and operations become O(n).</li></ul>`},
 {h:'How you will process trees',b:`<ul><li><b>DFS</b> (depth-first, usually recursive): go deep into one branch before the next. Next lesson.</li><li><b>BFS</b> (breadth-first, with a queue): level by level. The lesson after.</li><li>Almost every tree solution is: handle <code>None</code>, solve left, solve right, combine.</li></ul>`}
],
probs:[
 {n:'Search in a Binary Search Tree',lv:'e',lc:700,q:`Given the root of a BST and a value, return the node holding that value (or None).`,ex:[['root = [4,2,7,1,3], val = 2','node 2 (with children 1 and 3)','']],
  brute:[`Visit every node (any traversal) until you find the value, ignoring the BST ordering.`,`O(n) time`],
  idea:`Use the BST rule: smaller values are left, bigger values are right. Walk down one path only.`,steps:[`Start at the root.`,`If val &lt; node.val go left, if bigger go right.`,`Stop when you find it or hit None.`],
  code:`def searchBST(root, val):
    while root and root.val != val:
        root = root.left if val < root.val else root.right
    return root`,cx:`O(h) time (log n if balanced) · O(1) space`},
 {n:'Same Tree',lv:'e',lc:100,q:`Return True if two binary trees have exactly the same shape and values.`,ex:[['p = [1,2,3], q = [1,2,3]','True',''],['p = [1,2], q = [1,null,2]','False','2 is a left child in p but a right child in q']],
  brute:[`Serialize both trees to lists (including Nones) and compare the lists.`,`O(n) time, O(n) extra space`],
  idea:`Recursion: two trees are the same if the roots match, the left subtrees are the same, and the right subtrees are the same.`,steps:[`Both None → True.`,`One None or different values → False.`,`Return same(left, left) and same(right, right).`],
  code:`def isSameTree(p, q):
    if not p and not q:
        return True
    if not p or not q or p.val != q.val:
        return False
    return isSameTree(p.left, q.left) and isSameTree(p.right, q.right)`,cx:`O(n) time · O(h) stack`},
 {n:'Invert Binary Tree',lv:'e',lc:226,q:`Mirror a binary tree: swap the left and right children of every node.`,ex:[['root = [4,2,7,1,3,6,9]','[4,7,2,9,6,3,1]','Every left/right pair is swapped at every level']],
  brute:[`There's no slower obvious way here. You must touch every node once, so the question is just how to write it cleanly.`,`O(n) is the minimum`],
  idea:`Recursion: invert the left subtree, invert the right subtree, then swap them. The base case is an empty node.`,steps:[`If node is None, return None.`,`Recursively invert both children.`,`Swap them and return the node.`],
  code:`def invertTree(root):
    if not root:
        return None
    root.left, root.right = invertTree(root.right), invertTree(root.left)
    return root`,cx:`O(n) time · O(h) stack`}
],

],

APP.intro=Object.assign(APP.intro||{},{
'big-o':{one:`<b>Big-O</b> describes how the amount of work grows as the input gets bigger. It's not seconds, it's the <i>shape</i> of growth: flat, slowly rising, straight line, or exploding.`,
 ana:`<p>Finding a friend's name: checking every page of a phone book is O(n). Opening the middle and halving each time is O(log n). Being told the exact page number is O(1).</p>`,
 why:`<ul><li>Every interview answer ends with "time is O(…), space is O(…)".</li><li>The input size in the constraints tells you which complexity you need, which tells you which pattern to use.</li></ul>`,
 terms:[['n','The size of the input (number of elements)'],['Time complexity','How the number of steps grows with n'],['Space complexity','How much extra memory grows with n'],['O(1)','Constant: same work for any n'],['O(n)','Linear: one pass over the data'],['O(n²)','Quadratic: every pair, nested loops']],
 map:['See the common growth rates side by side','Learn to read constraints to pick a target complexity','Know the costs of Python operations'],pre:['how-to-dsa']},
'hashing':{one:`A <b>hash map</b> (Python <code>dict</code>) stores key → value pairs and finds any key almost instantly, no matter how many items it holds. A <b>hash set</b> (<code>set</code>) stores just keys.`,
 ana:`<p>A cloakroom: you hand over your coat and get ticket #47. Later you show #47 and the attendant goes straight to hook 47. No searching through every coat.</p>`,
 why:`<ul><li>It's the #1 tool for turning an O(n²) "search for a matching element" into O(n).</li><li>Used for counting, grouping, de-duplicating and "have I seen this before?".</li></ul>`,
 terms:[['Key','What you look up by (a name, a number, a tuple)'],['Value',`What's stored for that key`],['Hash function','Turns a key into a bucket number'],['Bucket','A slot in the underlying array'],['Collision','Two keys landing in the same bucket'],['Complement','The other number you need: target − x']],
 map:['See how a hash function finds things instantly','Watch Two Sum use a dict to avoid nested loops','Learn the counting and grouping patterns'],pre:['arrays-basics']},
'two-pointers':{one:`<b>Two pointers</b> means keeping two index variables (like <code>l</code> and <code>r</code>) moving through an array at the same time, so one pass replaces a nested loop.`,
 ana:`<p>Two people searching a sorted bookshelf for two books whose prices add up to ₹500: one starts at the cheap end, one at the expensive end. Too expensive? The right person steps left. Too cheap? The left person steps right.</p>`,
 why:`<ul><li>Turns many O(n²) pair problems into O(n) with O(1) extra memory.</li><li>Used for sorted-array pairs, palindromes, in-place removal and merging.</li></ul>`,
 terms:[['Pointer','Here, just an integer index into the array'],['Opposite ends','l starts at 0, r at the end, moving toward each other'],['Same direction','A slow "write" pointer and a fast "read" pointer'],['Sorted','In increasing order. Many two-pointer tricks need this']],
 map:['Warm up by reversing an array with two pointers','Watch the pointers hunt for a target sum','Learn the read/write variant for in-place edits','Solve Two Sum II, 3Sum and Container With Most Water'],pre:['arrays-basics','sorting']},
'sliding-window':{one:`A <b>sliding window</b> is a range [l, r] of consecutive elements that slides across an array or string. You update its contents as items enter and leave instead of recalculating from scratch.`,
 ana:`<p>Looking at a long train through a window that shows 3 carriages at a time. As the train moves, one carriage leaves the view and one enters. You don't re-count all three every time.</p>`,
 why:`<ul><li>The go-to pattern for "longest / shortest / best <b>contiguous</b> subarray or substring".</li><li>Turns O(n·k) or O(n²) into O(n).</li></ul>`,
 terms:[['Subarray / substring','A contiguous slice (no gaps)'],['Subsequence','Elements in order but possibly with gaps. NOT a window'],['Window','The current range from index l to r'],['Window size','r − l + 1'],['Fixed window','Size k never changes'],['Variable window','Grows and shrinks based on a condition']],
 map:['Understand subarray vs subsequence','Watch a fixed window slide with a running sum','Watch a variable window grow and shrink','Solve stock profit, longest unique substring, minimum window'],pre:['two-pointers','hashing']},
'prefix-sum':{one:`A <b>prefix sum</b> array stores running totals: P[i] = sum of the first i numbers. Then the sum of any range is one subtraction, P[j+1] − P[i].`,
 ana:`<p>A car's odometer: to know how far you drove between Salem and Bangalore, subtract the reading at Salem from the reading at Bangalore. No need to re-add every kilometre.</p>`,
 why:`<ul><li>Answers many range-sum queries in O(1) each.</li><li>Combined with a hash map it counts subarrays with sum k, even with negative numbers (where sliding window fails).</li></ul>`,
 terms:[['Prefix','The first i elements of the array'],['P[i]','Sum of nums[0..i−1], with P[0] = 0'],['Range sum','sum(nums[i..j]) = P[j+1] − P[i]'],['Running sum','A total updated as you walk the array']],
 map:['Build a prefix array and answer a range query','Count subarrays that sum to k with a dict','Use prefix and suffix products'],pre:['arrays-basics','hashing']},
'binary-search':{one:`<b>Binary search</b> finds an item in sorted data by checking the middle and throwing away the half where the answer can't be, so each step halves the search.`,
 ana:`<p>The "guess my number between 1 and 100" game: you guess 50, hear "higher", guess 75, hear "lower"… You never need more than 7 guesses, because each guess halves the possibilities.</p>`,
 why:`<ul><li>Searching 1 billion sorted items takes only ~30 steps.</li><li>The advanced form, "binary search on the answer", solves many minimize/maximize problems.</li></ul>`,
 terms:[['lo / hi','The current search range'],['mid','(lo + hi) // 2, the middle index we check'],['Monotonic','Only ever goes one way (false…false, true…true)'],['Search on answer','Binary search over possible answers instead of array indexes']],
 map:['Play the guessing game to feel the halving','Watch binary search find a number with code','Learn binary search on the answer (Koko)','Solve classic, rotated-array and Koko problems'],pre:['sorting','big-o']},
'stack':{one:`A <b>stack</b> is a pile where you add and remove only at the <b>top</b>: last in, first out (LIFO). A <b>queue</b> is a line where you add at the back and remove from the front: first in, first out (FIFO).`,
 ana:`<p>A stack of plates: you take the top plate. A ticket queue: the first person in line is served first. Your browser's Back button is a stack of pages.</p>`,
 why:`<ul><li>Matching brackets, undo, and evaluating expressions use stacks.</li><li>The <b>monotonic stack</b> solves "next greater element" style questions in O(n).</li><li>Queues power BFS on trees and graphs.</li></ul>`,
 terms:[['Push / pop','Add to top / remove from top (stack)'],['Enqueue / dequeue','Add to back / remove from front (queue)'],['LIFO / FIFO','Last-in-first-out / first-in-first-out'],['Monotonic stack','A stack kept in sorted order by popping items that break it'],['deque','Python double-ended queue: O(1) at both ends']],
 map:['Watch push/pop and enqueue/dequeue','Validate brackets with a stack, line by line','Learn the monotonic stack with daily temperatures'],pre:['arrays-basics']},
'linked-list':{one:`A <b>linked list</b> is a chain of <b>nodes</b>. Each node holds a value and a pointer (<code>next</code>) to the following node. The last one points to <code>None</code>.`,
 ana:`<p>A treasure hunt: each clue tells you where the next clue is. You can't jump to clue #5 directly. You must follow clues 1→2→3→4. But adding a new clue in the middle just means rewriting one note.</p>`,
 why:`<ul><li>Pointer-manipulation questions (reverse, merge, detect cycle) are interview classics.</li><li>They test careful step-by-step thinking.</li></ul>`,
 terms:[['Node','An object with val and next'],['Head','The first node; the list is accessed through it'],['next','Reference to the following node (None at the end)'],['Dummy node','A fake node placed before head to simplify edge cases'],['Fast / slow pointers','Two pointers moving at different speeds']],
 map:['See how nodes link and why access is O(n)','Watch insertion rewire just two pointers','Reverse a list with prev/curr/nxt, with code','Detect cycles with tortoise and hare'],pre:['arrays-basics']},
'heap':{one:`A <b>heap</b> (priority queue) always lets you grab the <b>smallest</b> item instantly (min-heap), and adding or removing items takes only O(log n).`,
 ana:`<p>A hospital emergency room: patients aren't seen in arrival order but by urgency. However many people arrive, the most urgent is always at the front.</p>`,
 why:`<ul><li>"Top k", "k-th largest", "merge k sorted lists", "schedule by priority", Dijkstra's shortest path.</li><li>Beats sorting when you only need the top few items or the data keeps changing.</li></ul>`,
 terms:[['Min-heap','Smallest item at the top (Python heapq)'],['Max-heap','Largest at the top (in Python: push negative numbers)'],['heappush / heappop','Add / remove the smallest, O(log n)'],['heap[0]','Peek at the smallest, O(1)'],['Sift up / down','How the heap repairs itself after a change']],
 map:['See why a heap beats scanning a list for the minimum','Watch an insert sift up the tree','Find the k-th largest with a size-k heap'],pre:['trees-101','sorting']},
'intervals':{one:`An <b>interval</b> is a range with a start and an end, like a meeting from 9 to 11, written [9, 11]. Interval problems ask you to merge, insert, count or schedule these ranges.`,
 ana:`<p>Your calendar: if one meeting runs 9–11 and another 10–12, they overlap and could be merged into a 9–12 block. How many rooms does the office need so that no meetings clash?</p>`,
 why:`<ul><li>Calendars, bookings and scheduling: very common in interviews.</li><li>The almost-universal first step, <b>sort by start</b>, is a great habit to show.</li></ul>`,
 terms:[['[start, end]','An interval'],['Overlap','Two intervals share some time: b.start ≤ a.end (when sorted)'],['Merge','Combine overlapping intervals into one'],['Sweep line','Process start and end events in time order']],
 map:['See overlapping vs separate intervals on a number line','Watch merging step by step with code','Solve merge, remove-overlaps and meeting rooms'],pre:['sorting','heap']},
'tree-dfs':{one:`<b>Depth-first search (DFS)</b> on a tree means going as deep as possible down one branch before backing up and trying the next, usually written with recursion.`,
 ana:`<p>Exploring a cave system: follow one tunnel to its dead end, walk back to the last fork, and take the next tunnel.</p>`,
 why:`<ul><li>Most tree questions (height, paths, validation, diameter) are a DFS where each node combines its children's answers.</li></ul>`,
 terms:[['Pre-order','Visit node, then left, then right'],['In-order','Left, node, right (sorted order in a BST)'],['Post-order','Left, right, then node (children first)'],['Subtree','A node and everything below it']],
 map:['Watch in-order traversal visit a BST in sorted order','See recursion "ask your children" to compute height','Solve depth, BST validation and diameter'],pre:['trees-101','recursion-basics']},
'tree-bfs':{one:`<b>Breadth-first search (BFS)</b> on a tree visits nodes <b>level by level</b>: the root, then all its children, then all grandchildren, using a queue.`,
 ana:`<p>Ripples in a pond: the first ring, then the second ring, then the third, spreading out evenly.</p>`,
 why:`<ul><li>Anything "per level" (level lists, right-side view, averages) and anything "nearest / minimum depth".</li></ul>`,
 terms:[['Level','All nodes at the same depth'],['Queue','FIFO line: deque with append / popleft'],['Level size','len(queue) at the start of a level']],
 map:['Watch the queue process one level at a time','Solve level-order traversal and right-side view'],pre:['trees-101','stack']},
'graphs':{one:`A <b>graph</b> is a set of <b>nodes</b> (vertices) joined by <b>edges</b>. Unlike trees, graphs can have cycles and no single root. BFS and DFS let you explore them.`,
 ana:`<p>A road map: cities are nodes, roads are edges. "Can I get from Salem to Bangalore?" is DFS. "What's the route with the fewest stops?" is BFS.</p>`,
 why:`<ul><li>Networks, dependencies, maps, social connections and grids (islands) are all graphs.</li><li>BFS/DFS with a visited set is a must-know template.</li></ul>`,
 terms:[['Vertex / node','A point in the graph'],['Edge','A connection between two nodes'],['Directed / undirected','One-way arrow vs two-way link'],['Neighbours','Nodes directly connected to a node'],['Adjacency list','Dict: node → list of neighbours'],['Visited set','Remembers explored nodes so you don\'t loop forever']],
 map:['Learn the graph vocabulary and adjacency list','Flood-fill a grid to count islands, with code','Find shortest hops with BFS'],pre:['tree-bfs','tree-dfs']},
'topo-sort':{one:`<b>Topological sort</b> orders tasks so that every task comes after the tasks it depends on, like finishing prerequisites before a course.`,
 ana:`<p>Getting dressed: socks before shoes, shirt before tie. Some orders are fine (socks or shirt first), but shoes before socks is not.</p>`,
 why:`<ul><li>"Course schedule", build systems, task pipelines, detecting circular dependencies.</li></ul>`,

 ana:`<p>What's 1+1+1+1+1? Five. Now add another +1: you instantly say six. You didn't recount; you <b>remembered</b> the previous answer. That's DP.</p>`,
 why:`<ul><li>"Number of ways", "minimum cost", "maximum profit" problems.</li><li>Turns exponential brute force into polynomial time.</li></ul>`,
 terms:[['Sub-problem','A smaller version of the same question'],['Memoization','Top-down: recursion + cache'],['Tabulation','Bottom-up: fill a table in a loop'],['State','What dp[i] means, in one sentence'],['Transition','The formula that builds dp[i] from smaller states']],
 map:['See why plain recursion repeats work','Fill a DP table for House Robber','Learn the 5-step DP recipe','Solve stairs, robber, coin change and LIS'],pre:['recursion-basics']},
'dp-2d':{one:`<b>2D dynamic programming</b> uses a table with rows and columns, typically for grids or for comparing two strings, where each cell is built from its neighbours.`,

'greedy':{one:`A <b>greedy</b> algorithm makes the best-looking choice at each step and never looks back. It's fast, but it's only correct when local best choices can't ruin the overall answer.`,
 ana:`<p>Giving change for ₹41 with ₹20/₹10/₹5/₹1 coins: always take the biggest coin that fits (20, 20, 1). That works for real currency, but with odd coin sets the greedy choice can be wrong.</p>`,
 why:`<ul><li>Often gives the simplest O(n) solution (jump game, max subarray, scheduling).</li><li>Interviewers check you can tell when greedy is safe, and when to use DP instead.</li></ul>`,

 {rows:[{lab:'buckets (an array of 8 slots)',a:['','','','','','','','']}],t:`Under the hood, a dict is an <b>array of buckets</b> plus a <b>hash function</b> that turns any key into a bucket number.`},
 {rows:[{lab:'buckets',a:['','','','apple:5','','','',''],ok:'3'}],v:{'hash("apple") % 8':3},t:`<code>d["apple"] = 5</code>: hash("apple") gives some big number; take it mod 8 → <b>3</b>. Store the pair in bucket 3.`},
 {rows:[{lab:'buckets',a:['','','','apple:5','','','kiwi:2',''],ok:'6'}],v:{'hash("kiwi") % 8':6},t:`<code>d["kiwi"] = 2</code> → bucket 6.`},

APP.probx=Object.assign(APP.probx||{},{
1:{q:`Given a list of numbers <code>nums</code> and a number <code>target</code>, return the <b>indexes</b> of the two numbers that add up to target. Exactly one answer exists, and you can't use the same element twice.`,
 ex:[['nums = [2, 7, 11, 15], target = 9','[0, 1]','nums[0] + nums[1] = 2 + 7 = 9'],['nums = [3, 2, 4], target = 6','[1, 2]','2 + 4 = 6 (not 3 + 3, since that would reuse index 0)']],
 ask:`For each number x, the partner you need is <code>target − x</code> (its "complement"). The question becomes: <i>have I already seen the complement?</i>`,
 brute:[`Check every pair with two nested loops: for i, for j &gt; i, if nums[i] + nums[j] == target return [i, j].`,`O(n²) time · O(1) space`],
 steps:[`Create an empty dict <code>seen</code> mapping value → index.`,`For each index i with value x, compute need = target − x.`,`If need is in seen, return [seen[need], i].`,`Otherwise store seen[x] = i and continue.`]},
49:{q:`Given a list of words, group together the words that are <b>anagrams</b> of each other (same letters, different order). Return the groups in any order.`,
 ex:[['["eat","tea","tan","ate","nat","bat"]','[["eat","tea","ate"], ["tan","nat"], ["bat"]]','"eat", "tea" and "ate" all use the letters a, e, t']],
 brute:[`For every word, compare it with every other word (sorting both to check anagram-ness).`,`O(n² · k log k) time`],
 steps:[`For each word, compute a key that's identical for anagrams: <code>tuple(sorted(word))</code>.`,`Append the word to <code>groups[key]</code> (a defaultdict(list)).`,`Return all the dict's values.`]},
128:{q:`Given an <b>unsorted</b> list of integers, return the length of the longest run of consecutive numbers (like 1, 2, 3, 4). Must run in O(n).`,
 ex:[['nums = [100, 4, 200, 1, 3, 2]','4','1, 2, 3, 4 are all present']],
 brute:[`Sort, then scan for runs. Simple, but O(n log n), which breaks the O(n) requirement. Even slower: for each number, keep checking x+1, x+2… with a list search.`,`O(n log n) or O(n³)`],
 steps:[`Put all numbers in a set for O(1) lookups.`,`For each x, only start counting if x−1 is NOT in the set (x is the start of a run).`,`Count upward while x+1, x+2… are in the set.`,`Track the longest run.`]},
167:{q:`The list <code>numbers</code> is <b>sorted</b> in increasing order. Return the 1-based positions [i, j] of the two numbers that add up to target, using only O(1) extra memory.`,
 ex:[['numbers = [2, 7, 11, 15], target = 9','[1, 2]','2 + 7 = 9, at positions 1 and 2 (1-based)']],
 ask:`It's Two Sum again, but sorted and without extra memory, so no dict. Sorted order is the hint for two pointers.`,
 brute:[`Two nested loops over all pairs, or a dict like in Two Sum (which uses O(n) memory).`,`O(n²) time, or O(n) memory`],
 steps:[`l = 0, r = last index.`,`s = numbers[l] + numbers[r].`,`s == target → answer. s &lt; target → l += 1 (need bigger). s &gt; target → r −= 1 (need smaller).`]},
15:{q:`Return all <b>unique</b> triplets [a, b, c] from the list that add up to 0. The same triplet must not appear twice.`,
 ex:[['nums = [-1, 0, 1, 2, -1, -4]','[[-1, -1, 2], [-1, 0, 1]]','Two different triplets sum to zero']],
 brute:[`Three nested loops over all triplets, plus a set to remove duplicates.`,`O(n³) time`],
 steps:[`Sort the list.`,`For each index i (skip it if nums[i] equals the previous value), look for two numbers after i that sum to −nums[i].`,`Use two pointers l = i+1, r = end, moving them like Two Sum II.`,`On a match, record it, then move l past duplicate values.`]},
11:{q:`You get a list of heights. Each height is a vertical line at that position. Choose two lines that, with the x-axis, hold the <b>most water</b>. Area = distance between the lines × the shorter line's height.`,
 ex:[['height = [1, 8, 6, 2, 5, 4, 8, 3, 7]','49','Lines at index 1 (height 8) and 8 (height 7): width 7 × min(8, 7) = 49']],
 brute:[`Try every pair of lines and compute each area.`,`O(n²) time`],
 steps:[`Start with the widest container: l = 0, r = end.`,`Compute the area and keep the best.`,`Move the pointer at the <b>shorter</b> line inward: the shorter line limits the area, so only replacing it can help.`,`Stop when l meets r.`]},
121:{q:`<code>prices[i]</code> is a stock's price on day i. Choose one day to buy and a <b>later</b> day to sell. Return the maximum profit, or 0 if no profit is possible.`,
 ex:[['prices = [7, 1, 5, 3, 6, 4]','5','Buy at 1 (day 1), sell at 6 (day 4)'],['prices = [7, 6, 4, 3, 1]','0','Prices only fall, so don\'t trade']],
 brute:[`For every buy day, try every later sell day.`,`O(n²) time`],
 steps:[`Track <code>lo</code> = the cheapest price seen so far.`,`For each price, the best profit if you sell today is price − lo.`,`Update best profit, then update lo.`]},
3:{q:`Given a string, find the length of the longest <b>substring</b> (contiguous piece) with no repeated characters.`,
 ex:[['s = "abcabcbb"','3','"abc"'],['s = "pwwkew"','3','"wke". Note "pwke" is a subsequence, not a substring']],
 brute:[`Check every substring and test whether all its characters are unique.`,`O(n³) time (or O(n²) with a set)`],
 steps:[`Keep a window [l, r] and a set of characters inside it.`,`Add s[r]. If it's already in the set, remove s[l] and move l right until the duplicate is gone.`,`After each step, the window is valid, so update best = max(best, r − l + 1).`]},
76:{q:`Given strings s and t, return the <b>shortest substring of s</b> that contains every character of t (including duplicates). Return "" if none exists.`,
 ex:[['s = "ADOBECODEBANC", t = "ABC"','"BANC"','"BANC" contains A, B and C and nothing shorter does']],
 brute:[`Check every substring of s and test whether it covers t.`,`O(n² · |t|) or worse`],
 steps:[`Count what t needs (need[ch]) and how many characters are still missing.`,`Expand r: if s[r] was needed, missing −= 1.`,`While missing == 0 (the window covers t): record it if it's the smallest, then shrink from l, increasing missing if you drop a needed character.`,`Return the best window.`]},
303:{q:`Build a class that, given a list once, can answer many queries <code>sumRange(i, j)</code> = sum of nums[i] through nums[j].`,
 ex:[['nums = [-2, 0, 3, -5, 2, -1]; sumRange(0, 2)','1','-2 + 0 + 3 = 1']],
 brute:[`Loop from i to j for every query.`,`O(n) per query`],
 steps:[`In the constructor, build P with P[0] = 0 and P[k+1] = P[k] + nums[k].`,`sumRange(i, j) = P[j+1] − P[i].`]},
560:{q:`Count how many contiguous subarrays have a sum exactly equal to k. Numbers may be negative.`,
 ex:[['nums = [1, 1, 1], k = 2','2','[1,1] at indexes 0–1 and 1–2'],['nums = [1, 2, 1, -1, 2], k = 3','3','[1,2], [2,1], [1,2,1,-1]']],
 ask:`Because of negative numbers, a sliding window can't decide when to shrink. Prefix sums turn "subarray sum" into "difference of two running totals".`,
 brute:[`Try every start and end index and sum each subarray.`,`O(n²) time`],
 steps:[`Keep a running sum and a dict counting how often each running sum has appeared (start with {0: 1}).`,`At each element, add count[run − k] to the answer: each earlier prefix with that value starts a subarray summing to k.`,`Then record the current run in the dict.`]},
238:{q:`Return an array where answer[i] is the product of every number <b>except</b> nums[i]. Don't use division, and run in O(n).`,
 ex:[['nums = [1, 2, 3, 4]','[24, 12, 8, 6]','24 = 2×3×4, 12 = 1×3×4, …']],
 brute:[`For each i, multiply all the other numbers.`,`O(n²) time`],
 steps:[`Left pass: res[i] = product of everything to the left of i.`,`Right pass: multiply res[i] by the product of everything to the right of i.`,`Both passes are O(n) and use the output array itself.`]},
704:{q:`Given a <b>sorted</b> list and a target, return the target's index or −1 if it's missing. Must be O(log n).`,
 ex:[['nums = [-1, 0, 3, 5, 9, 12], target = 9','4',''],['same list, target = 2','-1','2 is not present']],
 brute:[`Linear scan from left to right.`,`O(n) time`],
 steps:[`lo = 0, hi = n − 1.`,`mid = (lo + hi) // 2. If nums[mid] == target, return mid.`,`If nums[mid] &lt; target, search right (lo = mid + 1); else search left (hi = mid − 1).`,`If lo passes hi, return −1.`]},
33:{q:`A sorted list was <b>rotated</b> at an unknown point (e.g. [0,1,2,4,5,6,7] → [4,5,6,7,0,1,2]). Find the target's index in O(log n), or −1.`,

'graphs:0':{code:`count = 0
for r in range(R):
    for c in range(C):
        if grid[r][c] == '1':
            count += 1
            sink(r, c)        # flood-fill the island
return count`,ln:[1,[4,5],6,[4,5,6],[4,5,6,7]]},
'p11':{code:`l, r, best = 0, len(h) - 1, 0
while l < r:
    best = max(best, (r - l) * min(h[l], h[r]))
    if h[l] < h[r]:
        l += 1
    else:
        r -= 1
return best`,ln:[[1,3,4,5],[3,6,7],[3,6,7],[3,6,7]]}
});

<script>/* LearnQuest engine — vanilla JS, no deps */
(function(){
'use strict';
const A = window.APP;
const $ = (s,el=document)=>el.querySelector(s);
const $$ = (s,el=document)=>[...el.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ids = v=> v==null?[]:Array.isArray(v)?v.map(String):String(v).trim().split(/\s+/).filter(Boolean);
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const todayKey = (d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

document.documentElement.style.setProperty('--acc',A.accent);
document.documentElement.style.setProperty('--acc2',A.accent2);

/* ---------- flatten lessons ---------- */
/* ---------- apply content patches (basics intros, problem details, code sync, concept scenes) ---------- */
(function(){
  const applySync=(sc,s)=>{ if(!sc||!s) return; sc.code=s.code; (s.ln||[]).forEach((x,i)=>{ if(sc.frames&&sc.frames[i]) sc.frames[i].ln=x; }); };
  A.segments.forEach(seg=>seg.lessons.forEach(l=>{
    if(A.intro&&A.intro[l.id]) l.intro=Object.assign({},A.intro[l.id],l.intro||{});
    if(l.anim&&!Array.isArray(l.anim)) l.anim=[l.anim];
    if(A.sync&&l.anim) l.anim.forEach((sc,i)=>applySync(sc,A.sync[l.id+':'+i]));
    if(A.pre&&A.pre[l.id]) l.anim=[].concat(A.pre[l.id],l.anim||[]);
    (l.probs||[]).forEach(p=>{ if(A.probx&&A.probx[p.lc||p.n]) Object.assign(p,A.probx[p.lc||p.n]); if(p.trace&&A.sync) applySync(p.trace,A.sync['p'+(p.lc||p.n)]); });
  }));
})();
const LESSONS=[]; A.segments.forEach((s,si)=>s.lessons.forEach(l=>{l.seg=si;l.n=LESSONS.length+1;LESSONS.push(l)}));
const byId = id=>LESSONS.find(l=>l.id===id);

/* ---------- state ---------- */
const KEY='lq:'+A.id;
let S={xp:0,done:{},days:[],boss:{},focus:0};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const LV_NAMES=['Rookie','Apprentice','Builder','Practitioner','Engineer','Senior Engineer','Staff Engineer','Principal','Distinguished','Legend'];
const lvl=()=>{const L=Math.floor(S.xp/250);return{n:L+1,name:LV_NAMES[Math.min(L,LV_NAMES.length-1)],pct:(S.xp%250)/2.5}};
function streak(){
  const set=new Set(S.days); let d=new Date(), n=0;
  if(!set.has(todayKey(d))) d.setDate(d.getDate()-1);
  while(set.has(todayKey(d))){n++;d.setDate(d.getDate()-1)}
  return n;
}
function markDay(){const k=todayKey(); if(!S.days.includes(k)){S.days.push(k);}}
function gainXP(n,ev){
  S.xp+=n; markDay(); save(); renderTop();
  const f=document.createElement('div'); f.className='xpfly'; f.textContent='+'+n+' XP';
  const x=ev&&ev.clientX?ev.clientX:window.innerWidth/2, y=ev&&ev.clientY?ev.clientY:120;
  f.style.left=(x-30)+'px'; f.style.top=(y-20)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),1000);
}
function confetti(n=60){
  const cols=['#8b5cf6','#22d3ee','#fbbf24','#22c55e','#f472b6','#f97316'];
  for(let i=0;i<n;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';
    c.style.background=cols[i%cols.length];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.4)+'s';
    c.style.transform='rotate('+Math.random()*360+'deg)';document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}
}
const nextLesson=()=>LESSONS.find(l=>!S.done[l.id]);

/* ---------- top bar ---------- */
const root=document.getElementById('app');
document.body.insertAdjacentHTML('afterbegin',`<div class="top"><div class="in">
 <div class="brand" id="brand"><div class="logo">${A.emoji}</div><span class="nm">${esc(A.name)}</span></div>
 <div class="stats" id="stats"></div></div></div>`);
$('#brand').onclick=()=>go('');
let timer={left:0,total:0,run:false,h:null};
function renderTop(){
  const L=lvl();
  $('#stats').innerHTML=`<div class="pill" title="Daily streak">🔥 ${streak()}</div>
   <div class="pill" title="Level ${L.n}">⭐ L${L.n} <span class="lvlbar"><i style="width:${L.pct}%"></i></span> ${S.xp} XP</div>
   <div class="pill timer ${timer.run?'run':''}" id="tmr" title="Focus timer">⏱ ${timer.total?fmt(timer.left):'Focus'}</div>
   ${location.pathname.startsWith('/gamified-learning')?'<a class="pill" href="/gamified-learning/" style="text-decoration:none;color:inherit" title="All learning tracks">🗂️ <span class="nm">All tracks</span></a>':''}`;
  $('#tmr').onclick=timerClick;
}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function timerClick(){
  if(timer.total){ timer.run=!timer.run; if(timer.run) tick(); else clearTimeout(timer.h); renderTop(); return;}
  modal(`<h3 style="margin-top:0">⏱ Focus block</h3><p class="sub">One block = one track. Do AI, System Design and DSA as separate blocks.</p>
   <div class="row"><button class="btn" data-m="15">15 min</button><button class="btn ghost" data-m="30">30 min</button><button class="btn ghost" data-m="0">Cancel</button></div>`,
   (box,close)=>$$('[data-m]',box).forEach(b=>b.onclick=()=>{const m=+b.dataset.m;close();if(m){timer={left:m*60,total:m*60,run:true,h:null};tick();renderTop();}}));
}
function tick(){
  clearTimeout(timer.h);
  timer.h=setTimeout(()=>{ if(!timer.run) return; timer.left--;
    if(timer.left<=0){timer={left:0,total:0,run:false,h:null};S.focus=(S.focus||0)+1;gainXP(20);confetti(80);
      modal(`<div style="text-align:center"><div style="font-size:3rem">🏁</div><h3>Focus block complete!</h3><p class="sub">+20 XP. Take a 2-minute break, then start the next track.</p><button class="btn" data-x>Nice</button></div>`,(b,c)=>$('[data-x]',b).onclick=c);}
    else tick(); renderTop(); },1000);
}
function modal(html,bind){
  const m=document.createElement('div'); m.className='modal'; m.innerHTML=`<div class="card">${html}</div>`;
  const close=()=>m.remove(); m.addEventListener('click',e=>{if(e.target===m)close()});
  document.body.appendChild(m); bind&&bind(m,close);
}

/* ---------- routing ---------- */
function go(h){ if(location.hash.slice(1)===h) route(); else location.hash=h; }
window.addEventListener('hashchange',route);
let cleanup=[];
function route(){
  cleanup.forEach(f=>f()); cleanup=[];
  const h=location.hash.slice(1);
  window.scrollTo(0,0);
  if(h.startsWith('l-')&&byId(h.slice(2))) return lessonView(byId(h.slice(2)));
  if(h.startsWith('boss-')) return bossView(h.slice(5));
  if(h==='plan') return homeView('plan');
  homeView();
}

/* ---------- 30-day plan ---------- */
function buildPlan(){
  const items=[]; A.segments.forEach((s,si)=>{s.lessons.forEach(l=>items.push({k:'l',l}));items.push({k:'b',si})});
  const days=[];
  if(items.length<=30){ items.forEach(it=>days.push([it])); }
  else { const per=items.length/30; let acc=0; for(let d=0;d<30;d++){const n=Math.round((d+1)*per)-Math.round(d*per); days.push(items.slice(acc,acc+n)); acc+=n;} }
  const extra=['all','cards'];let e=0; while(days.length<30){days.push([{k:extra[e%2]==='all'?'b':'c',si:'all'}]);e++}
  return days;
}
const PLAN=buildPlan();
function itemLabel(it){ if(it.k==='l') return it.l.em+' '+it.l.t; if(it.k==='c') return '🃏 Flashcard sprint (all topics)'; return '👾 Boss battle: '+(it.si==='all'?'Everything':A.segments[it.si].name); }
function itemHref(it){ if(it.k==='l') return 'l-'+it.l.id; if(it.k==='c') return 'boss-cards'; return 'boss-'+it.si; }
function itemDone(it){ if(it.k==='l') return !!S.done[it.l.id]; if(it.k==='c') return !!S.boss.cards; return !!S.boss[it.si]; }

/* ---------- home ---------- */
function homeView(focus){
  const nl=nextLesson(); const st=streak(); const L=lvl();
  const doneN=Object.keys(S.done).length;
  const studied=S.days.length + (S.days.includes(todayKey())?0:1);
  const week=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return {on:S.days.includes(todayKey(d)),l:'SMTWTFS'[d.getDay()]}});
  let html=`<div class="h1">${A.emoji} ${esc(A.name)}</div><p class="sub">${A.tagline}</p>
  <div class="mission">
   <div class="card big"><div class="kick">Day ${Math.min(studied,30)} of 30 · Today's mission</div>
    ${nl?`<div class="mtitle">${nl.em} ${esc(nl.t)}</div><div class="sub" style="margin:0">${nl.d}</div>
    <div class="blocks"><span class="on">🎬 Watch</span><span class="on">📖 Learn</span>${nl.probs?'<span class="on">🧩 Problems</span>':''}<span class="on">🎮 Play</span></div>
    <div class="row"><button class="btn" id="startNext">Start lesson ${nl.n} →</button><button class="btn ghost" id="startTimer">⏱ Start ${nl.mins||15}-min block</button></div>`
    :`<div class="mtitle">🏆 All lessons complete!</div><p class="sub">Keep the streak alive with boss battles and flashcard sprints.</p><button class="btn" onclick="location.hash='boss-all'">Final boss →</button>`}
   </div>
   <div class="card"><div class="kick">Your progress</div>
    <div style="font-size:1.4rem;font-weight:700;margin:6px 0">⭐ Level ${L.n} · ${L.name}</div>
    <div class="qprog"><i style="width:${L.pct}%"></i></div>
    <div class="row" style="gap:16px;color:var(--mut);font-size:.9rem"><span>🔥 <b>${st}</b> day streak</span><span>✅ <b>${doneN}/${LESSONS.length}</b> lessons</span><span>🏁 <b>${S.focus||0}</b> focus blocks</span></div>
    <div class="weekdots">${week.map(w=>`<i class="${w.on?'on':''}">${w.l}</i>`).join('')}</div>
   </div>
  </div>`;
  A.segments.forEach((s,si)=>{
    const dn=s.lessons.filter(l=>S.done[l.id]).length;
    html+=`<div class="seg"><div class="seg-h"><h3>${s.em||''} ${esc(s.name)}</h3><span class="c">${dn}/${s.lessons.length} · ${s.desc||''}</span>
      <button class="btn sm ghost" style="margin-left:auto" onclick="location.hash='boss-${si}'">👾 Boss${S.boss[si]?' ✓':''}</button></div><div class="path">`;
    s.lessons.forEach(l=>{const d=S.done[l.id];
      html+=`<button class="node ${d?'done':''} ${nl===l?'next':''}" data-l="${l.id}"><div class="st">${d?'⭐'.repeat(d)+'<span style="opacity:.25">'+'⭐'.repeat(3-d)+'</span>':''}</div>
      <div class="em">${l.em}</div><div class="n">LESSON ${l.n}</div><div class="tt">${esc(l.t)}</div><div class="ds">${l.d}</div></button>`});
    html+=`</div></div>`;
  });
  html+=`<div class="sec-t" id="plan">🗓️ 30-day plan <span class="c" style="color:var(--dim);font-size:.85rem;font-weight:500">one block a day, ~${A.mins||15} min</span></div><div class="plan">`;
  PLAN.forEach((d,i)=>{const ok=d.every(itemDone); const boss=d.some(it=>it.k!=='l');
    html+=`<div class="pday ${ok?'ok':''} ${boss?'boss':''}" data-h="${itemHref(d[0])}"><div class="d">DAY ${i+1} ${ok?'✓':''}</div>${d.map(it=>`<div class="t">${esc(itemLabel(it))}</div>`).join('')}</div>`});
  html+=`</div><div class="foot">${A.footer||''}<br>Progress is saved in this browser. <a href="#" id="reset">Reset progress</a></div>`;
  root.innerHTML=`<div class="wrap pane">${html}</div>`;
  $$('[data-l]').forEach(b=>b.onclick=()=>go('l-'+b.dataset.l));
  $$('[data-h]').forEach(b=>b.onclick=()=>go(b.dataset.h));
  const sn=$('#startNext'); if(sn) sn.onclick=()=>go('l-'+nl.id);
  const stt=$('#startTimer'); if(stt) stt.onclick=()=>{timer={left:(nl.mins||15)*60,total:(nl.mins||15)*60,run:true,h:null};tick();renderTop();go('l-'+nl.id)};
  $('#reset').onclick=e=>{e.preventDefault();modal(`<h3 style="margin-top:0">Reset all progress?</h3><p class="sub">XP, streak and stars for this app will be cleared.</p><div class="row"><button class="btn" data-y style="background:var(--bad)">Reset</button><button class="btn ghost" data-n>Cancel</button></div>`,(b,c)=>{$('[data-n]',b).onclick=c;$('[data-y]',b).onclick=()=>{S={xp:0,done:{},days:[],boss:{},focus:0};save();c();renderTop();route();}})};
  if(focus==='plan') setTimeout(()=>$('#plan').scrollIntoView({behavior:'smooth'}),50);
}

/* ---------- code highlight ---------- */
const KW=new Set('def return if elif else for while in not and or is None True False class import from as with try except finally raise lambda yield pass break continue global nonlocal del assert async await'.split(' '));
const BI=new Set('len range print min max sum sorted enumerate zip map filter list dict set tuple int str float abs any all reversed heapq collections deque defaultdict Counter float inf self append pop popleft appendleft heappush heappop heapify bisect_left bisect_right ord chr'.split(' '));
function hl(code){
  const re=/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(\d+(?:\.\d+)?)\b|\b([A-Za-z_]\w*)\b/g;
  let out='',last=0,m,prev='';
  while((m=re.exec(code))){ out+=esc(code.slice(last,m.index)); last=re.lastIndex;
    if(m[1]) out+=`<span class="cm">${esc(m[1])}</span>`;
    else if(m[2]) out+=`<span class="st">${esc(m[2])}</span>`;
    else if(m[3]) out+=`<span class="nu">${m[3]}</span>`;
    else { const w=m[4]; if(KW.has(w)) out+=`<span class="kw">${w}</span>`; else if(prev==='def'||prev==='class') out+=`<span class="fnn">${w}</span>`; else if(BI.has(w)) out+=`<span class="bi">${w}</span>`; else out+=w; prev=w; continue;}
    prev='';
  }
  return out+esc(code.slice(last));
}
function codeBlock(code){
  const id='c'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{const b=document.getElementById(id); if(b) b.onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>{b.textContent='Copied ✓'},()=>{b.textContent='Select & copy'})}catch(e){b.textContent='Select & copy'}}},0);
  return `<div class="code"><button class="btn sm ghost cp" id="${id}">Copy</button><pre>${hl(code.replace(/^\n+|\s+$/g,''))}</pre></div>`;
}

/* ---------- animation player ---------- */
function normFlow(sc){
  const nodes=(sc.nodes||[]).map(n=>Array.isArray(n)?{id:n[0],l:n[1],x:n[2],y:n[3],s:n[4]||'',c:n[5]||'',at:n[6]||0}:Object.assign({s:'',c:'',at:0},n));
  nodes.forEach(n=>{ n.lines=wrapTxt(n.s); n.w=n.w||Math.max(64,String(n.l).length*8.6+28,Math.max(0,...n.lines.map(x=>x.length))*6.3+24); n.h=n.h||(n.lines.length?40+n.lines.length*14:44); });
  const edges=(sc.edges||[]).map(e=>Array.isArray(e)?{f:e[0],t:e[1],l:e[2]||'',at:e[3]}:e);
  const NM={};nodes.forEach(n=>NM[n.id]=n);
  return {nodes,edges,zones:sc.zones||[],rings:sc.rings||[],H:sc.h||400,NM};
}
function wrapTxt(t,max=24){ t=String(t||''); if(!t) return []; const w=t.split(' '); const out=[]; let cur='';
  w.forEach(x=>{ if(cur&&(cur+' '+x).length>max){out.push(cur);cur=x} else cur=cur?cur+' '+x:x }); if(cur) out.push(cur); return out; }
function subSVG(n,txt){ const L=wrapTxt(txt); const top=n.y-(18+L.length*14)/2; return L.map((x,i)=>`<tspan x="${n.x}" y="${top+25+i*14}">${esc(x)}</tspan>`).join(''); }
function clip(n,dx,dy){ const ax=Math.abs(dx)||1e-6, ay=Math.abs(dy)||1e-6; const t=Math.min((n.w/2+4)/ax,(n.h/2+4)/ay); return [n.x+dx*t,n.y+dy*t]; }
function seg(a,b){ const dx=b.x-a.x,dy=b.y-a.y; const p=clip(a,dx,dy), q=clip(b,-dx,-dy); return [p,q]; }
function geo(a,b,cv){ // returns {d (svg path), pt(t), mid}
  if(!cv){ const [p,q]=seg(a,b); return {d:`M${p[0]},${p[1]} L${q[0]},${q[1]}`,pt:t=>[p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t],mid:[(p[0]+q[0])/2,(p[1]+q[1])/2]}; }
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1; const c=[mx-dy/L*cv,my+dx/L*cv];
  const p=clip(a,c[0]-a.x,c[1]-a.y), q=clip(b,c[0]-b.x,c[1]-b.y);
  const pt=t=>[(1-t)*(1-t)*p[0]+2*(1-t)*t*c[0]+t*t*q[0],(1-t)*(1-t)*p[1]+2*(1-t)*t*c[1]+t*t*q[1]];
  return {d:`M${p[0]},${p[1]} Q${c[0]},${c[1]} ${q[0]},${q[1]}`,pt,mid:pt(.5)}; }

function Player(mount,scenes,opts={}){
  scenes=Array.isArray(scenes)?scenes:[scenes];
  let touched=false, prevSig='', si=0, i=0, playing=false, tmo=null, spd=1, seen=new Set(), alive=true, pkTok=0;
  const onAllSeen=opts.onAllSeen||(()=>{});
  mount.innerHTML=`${scenes.length>1?`<div class="row" style="margin-bottom:10px" data-tabs>${scenes.map((s,k)=>`<button class="btn sm ${k?'ghost':''}" data-sc="${k}">${k+1}. ${esc(s.title||'Scene')}</button>`).join('')}</div>`:''}
   <div class="stage"><div class="stage-h"><b data-tt></b><span data-cnt></span></div><div data-vis></div>
   <div class="cap"><div class="k" data-k></div><div class="tx" data-cap></div></div>
   <div class="ctrls"><button class="ib" data-prev title="Previous (←)">◀</button><button class="ib" data-play title="Play/Pause (space)">▶</button><button class="ib" data-next title="Next (→)">▶|</button>
   <div class="dots" data-dots></div><button class="spd" data-spd>1x</button><button class="spd" data-rs title="Restart">↺</button></div></div>`;
  const vis=$('[data-vis]',mount);
  $$('[data-sc]',mount).forEach(b=>b.onclick=()=>{setScene(+b.dataset.sc)});
  $('[data-prev]',mount).onclick=()=>{touched=true;stop();show(i-1)};
  $('[data-next]',mount).onclick=()=>{touched=true;stop();show(i+1)};
  $('[data-play]',mount).onclick=()=>playing?stop():play();
  $('[data-rs]',mount).onclick=()=>{show(0);play()};
  $('[data-spd]',mount).onclick=e=>{spd=spd===1?1.5:spd===1.5?0.7:1;e.target.textContent=(spd===0.7?'0.7':spd)+'x'};
  let sc, steps, flow;
  function setScene(k){
    si=k; sc=scenes[k]; stop();
    $$('[data-sc]',mount).forEach((b,j)=>b.classList.toggle('ghost',j!==k));
    $('[data-tt]',mount).textContent=sc.title||'';
    if(sc.type==='arr'){ steps=sc.frames; prevSig='';
      vis.innerHTML=sc.code?`<div class="arr-split"><div class="arr" data-arr></div><div class="codepane"><div class="cp-h">Python · the highlighted line is running</div>${sc.code.replace(/^\n+|\s+$/g,'').split('\n').map((ln,j)=>`<div class="cl" data-ln="${j+1}"><span class="lno">${j+1}</span>${hl(ln)||' '}</div>`).join('')}</div></div>`:`<div class="arr" data-arr></div>`; }
    else { flow=normFlow(sc); steps=sc.steps; buildSVG(); }
    $('[data-dots]',mount).innerHTML=steps.map((_,j)=>`<i data-d="${j}"></i>`).join('');
    $$('[data-d]',mount).forEach(d=>d.onclick=()=>{touched=true;stop();show(+d.dataset.d)});
    show(0); touched=false; if(opts.autoplay!==false) setTimeout(()=>alive&&!touched&&play(),700);
  }
  function buildSVG(){
    const {nodes,edges,zones,H}=flow;

    (flow.rings||[]).forEach(r=>s+=`<ellipse cx="${r.x}" cy="${r.y}" rx="${r.r}" ry="${r.ry||r.r}" fill="none" stroke="#34437c" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>${r.l?`<text class="fel" x="${r.x}" y="${r.y+4}" style="font-size:13px;font-weight:700;fill:#6b77a6">${esc(r.l)}</text>`:''}`);

function quizGame(mount,qs,done,opt={}){
  let k=0,score=0,lives=opt.lives||0,combo=0,xp=0;
  qs=qs.map(q=>{const order=shuffle(q.o.map((_,j)=>j)); return Object.assign({},q,{o:order.map(j=>q.o[j]),a:order.indexOf(q.a)})});
  function draw(){
    const q=qs[k];
    mount.innerHTML=`<div class="qbox pane"><div class="qmeta"><span>${opt.title||'Quiz'} · ${k+1}/${qs.length}</span><span>${lives?`<span class="hearts">${'❤️'.repeat(lives)}${'🖤'.repeat((opt.lives||0)-lives)}</span> `:''}${combo>=2?`<span class="combo">🔥 x${combo}</span>`:''}</span></div>
     <div class="qprog"><i style="width:${k/qs.length*100}%"></i></div><div class="qq">${q.q}</div>
     <div class="opts">${q.o.map((o,j)=>`<button class="opt" data-o="${j}"><span class="k">${'ABCDEF'[j]}</span><span>${o}</span></button>`).join('')}</div><div data-ex></div></div>`;
    $$('[data-o]',mount).forEach(b=>b.onclick=ev=>{
      const j=+b.dataset.o, good=j===q.a;
      $$('[data-o]',mount).forEach(x=>{x.classList.add('off'); if(+x.dataset.o===q.a) x.classList.add('ok')});
      if(good){score++;combo++;const g=10*(opt.combo&&combo>=3?2:1);xp+=g;gainXP(g,ev);} else {b.classList.add('bad');combo=0;if(lives)lives--;}
      $('[data-ex]',mount).innerHTML=`<div class="expl ${good?'g':'r'}"><b>${good?'✅ Correct!':'❌ Not quite.'}</b> ${q.x||''}</div>
        <div class="navrow"><span></span><button class="btn" data-nx>${k<qs.length-1&&!(opt.lives&&lives<=0)?'Next →':'Finish'}</button></div>`;
      $('[data-nx]',mount).onclick=()=>{ if(opt.lives&&lives<=0) return done(score,qs.length,xp,true); k++; if(k<qs.length) draw(); else done(score,qs.length,xp,false); };
      $('[data-nx]',mount).scrollIntoView({behavior:'smooth',block:'nearest'});
    });
  }

}

  function runPlay(pn){
    const seq=[]; if(l.quiz) seq.push('quiz'); if(l.order) seq.push('order'); if(l.match) seq.push('match');
    let qs={s:0,n:0}; let ix=0;
    const next=()=>{ if(ix>=seq.length) return finish(); const g=seq[ix++];
      if(g==='quiz') quizGame(pn,l.quiz,(s,n)=>{qs={s,n};next()});
      else if(g==='order') orderGame(pn,l.order,next);
      else matchGame(pn,l.match,next); };
    function finish(){
      const ratio=qs.n?qs.s/qs.n:1; const stars=ratio>=.99?3:ratio>=.6?2:1;
      const first=!S.done[l.id]; S.done[l.id]=Math.max(S.done[l.id]||0,stars); gainXP(first?25:10); save(); confetti(stars*30);
      const nx=LESSONS[LESSONS.indexOf(l)+1];
      pn.innerHTML=`<div class="done-scr card"><div class="big">${stars===3?'🏆':stars===2?'🎉':'💪'}</div><h2 style="margin:6px 0">Lesson complete!</h2>
       <div class="stars">${'⭐'.repeat(stars)}<span style="opacity:.2">${'⭐'.repeat(3-stars)}</span></div>
       <p class="sub">Quiz: ${qs.s}/${qs.n} correct · +${S.xp-earned} XP this lesson${first?' (incl. +25 first-clear bonus)':''}</p>
       <div class="row" style="justify-content:center">${nx?`<button class="btn" data-nl>Next: ${nx.em} ${esc(nx.t)} →</button>`:''}<button class="btn ghost" data-rp>↺ Replay games</button><button class="btn ghost" data-mp>🏠 Map</button></div></div>`;
      const b=$('[data-nl]',pn); if(b) b.onclick=()=>go('l-'+nx.id); $('[data-rp]',pn).onclick=()=>{ix=0;next()}; $('[data-mp]',pn).onclick=()=>go('');
    }
    next();
  }
  show(0);
}

/* ---------- boss ---------- */
function bossView(key){
  let pool=[], title='';
  if(key==='cards'){
    const cards=LESSONS.flatMap(l=>(l.cards||[]).map(c=>c));
    root.innerHTML=`<div class="wrap pane"><div class="crumbs"><a data-home>🏠 Map</a> › Flashcard sprint</div><div class="h1">🃏 Flashcard sprint</div><p class="sub">Every interview card across the track, shuffled. Say each answer out loud before flipping.</p>${flashcards(shuffle(cards).slice(0,24))}
      <div class="navrow"><button class="btn ghost" data-home2>← Map</button><button class="btn" data-dn>Mark sprint done ✓</button></div></div>`;
    $('[data-home]').onclick=$('[data-home2]').onclick=()=>go('');
    $('[data-dn]').onclick=ev=>{if(!S.boss.cards){S.boss.cards=1;gainXP(30,ev);confetti()} save(); go('');};
    return;
  }
  if(key==='all'){ pool=LESSONS.flatMap(l=>l.quiz||[]); title='Final boss: everything'; }
  else { const s=A.segments[+key]; if(!s) return go(''); pool=s.lessons.flatMap(l=>l.quiz||[]); title='Boss: '+s.name; }
  const qs=shuffle(pool).slice(0,12);
  root.innerHTML=`<div class="wrap"><div class="crumbs"><a data-home>🏠 Map</a> › ${esc(title)}</div><div class="h1">👾 ${esc(title)}</div><p class="sub">12 random questions · 3 lives · 3 in a row = double XP</p><div data-g></div></div>`;
  $('[data-home]').onclick=()=>go('');
  quizGame($('[data-g]'),qs,(s,n,xp,dead)=>{
    const win=!dead&&s/n>=.7; if(win){S.boss[key]=Math.max(S.boss[key]||0,s); gainXP(40); confetti(120);} save();
    $('[data-g]').innerHTML=`<div class="done-scr card"><div class="big">${win?'🏆':dead?'💀':'😤'}</div><h2>${win?'Boss defeated!':dead?'Out of lives':'So close!'}</h2><p class="sub">${s}/${n} correct${win?' · +40 XP bonus':' · need 70% to win'}</p>
     <div class="row" style="justify-content:center"><button class="btn" data-rt>↺ Fight again</button><button class="btn ghost" data-mp>🏠 Map</button></div></div>`;
    $('[data-rt]').onclick=()=>route(); $('[data-mp]').onclick=()=>go('');
  },{lives:3,combo:true,title:'Boss'});
}

renderTop(); route();
})();
</script></body></html>
